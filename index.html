<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestión de Casos · Grupo París</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
<style>
:root{
  --ink:#0C0D10; --ink-soft:#15171C; --paper:#FFFFFF; --blue:#2563EB; --blue-dim:#EFF4FF; --blue-deep:#1D4ED8; --blue-bright:#3B82F6;
  --gray-50:#FAFAFB; --gray-100:#F3F4F7; --gray-150:#ECEDF2; --gray-200:#E1E3EA;
  --gray-400:#9DA0AC; --gray-500:#71747F; --gray-600:#4E515D; --gray-700:#33353E;
  --green:#0F9D58; --green-dim:#E8F7EF; --amber:#D97706; --amber-dim:#FDF3E3;
  --red:#DC2626; --red-dim:#FDECEC; --purple:#7C3AED; --purple-dim:#F2ECFE;
  --info:#0EA5E9; --info-dim:#E6F7FE;
  --line:1px solid var(--gray-200); --radius-s:9px; --radius-m:14px; --radius-l:22px;
  --shadow-1:0 1px 2px rgba(15,17,22,.05), 0 1px 1px rgba(15,17,22,.04);
  --shadow-2:0 14px 32px -8px rgba(15,17,22,.16), 0 4px 10px -4px rgba(15,17,22,.08);
  --shadow-blue:0 10px 24px -6px rgba(37,99,235,.4);
  --sidebar-w:230px; --topbar-h:60px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--gray-50); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;}
.mono{font-family:'JetBrains Mono',monospace;}
.hidden{display:none !important;}
.view:not(.hidden){animation:viewIn .22s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* LOGIN */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(1200px 800px at 15% 100%, #16181D 0%, var(--ink) 55%); position:relative; overflow:hidden;}
#login-screen::before{content:""; position:absolute; inset:0; background:radial-gradient(700px 500px at 82% 18%, rgba(37,99,235,.32), transparent 60%), radial-gradient(500px 400px at 8% 85%, rgba(124,58,237,.14), transparent 60%);}
.login-card{position:relative; z-index:2; width:380px; background:#fff; border-radius:var(--radius-l); padding:40px 36px 32px; box-shadow:0 40px 90px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);}
.login-mark{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
.login-mark .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue-bright),var(--purple));flex-shrink:0;}
.login-mark span{font-weight:800; letter-spacing:-.02em; font-size:16px; display:block;}
.login-mark small{display:block; font-size:10.5px; color:var(--gray-500); letter-spacing:.06em; text-transform:uppercase; margin-top:1px;}
.login-card h1{font-size:19px; font-weight:700; margin-bottom:4px;}
.login-card p.sub{color:var(--gray-500); font-size:12.8px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--gray-700); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--gray-200); border-radius:var(--radius-s); font-size:13.5px; font-family:inherit; background:var(--gray-50); transition:border-color .15s, box-shadow .15s;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-dim); background:#fff; outline:none;}
.field textarea{resize:vertical; min-height:80px;}
.btn{border:none; border-radius:var(--radius-s); font-weight:650; font-size:13.5px; padding:11px 16px; transition:transform .14s, box-shadow .18s, filter .15s; display:inline-flex; align-items:center; justify-content:center; gap:7px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg, var(--blue-bright), var(--blue-deep)); color:#fff; width:100%; box-shadow:0 4px 12px -3px rgba(37,99,235,.45);}
.btn-primary:hover{filter:brightness(1.07); box-shadow:var(--shadow-blue); transform:translateY(-1px);}
.btn-ghost{background:transparent; color:var(--gray-700); border:1.5px solid var(--gray-200);}
.btn-ghost:hover{border-color:var(--blue); color:var(--blue-deep); background:var(--blue-dim);}
.btn-dark{background:linear-gradient(135deg, #24262C, var(--ink)); color:#fff; box-shadow:0 4px 12px -4px rgba(12,13,16,.4);}
.btn-dark:hover{filter:brightness(1.25); transform:translateY(-1px);}
.btn-sm{padding:8px 13px; font-size:12.5px;}
.login-error{background:var(--red-dim); color:var(--red); border-radius:var(--radius-s); padding:9px 12px; font-size:12.5px; margin-bottom:14px; display:none;}
.login-foot{margin-top:18px; text-align:center; font-size:11px; color:var(--gray-400);}

/* SHELL */
#app{display:flex; min-height:100vh;}
.sidebar{width:var(--sidebar-w); flex-shrink:0; background:linear-gradient(180deg, var(--ink-soft) 0%, var(--ink) 100%); color:#fff; display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; box-shadow:4px 0 24px rgba(0,0,0,.18); z-index:25;}
.brand{display:flex; align-items:center; gap:9px; padding:6px 8px 18px;}
.brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue-bright),var(--purple));flex-shrink:0;}
.brand strong{font-size:13.5px; font-weight:800; letter-spacing:-.015em; display:block;}
.brand small{display:block; font-size:9px; color:#8E92A0; letter-spacing:.08em; text-transform:uppercase;}
.nav-item{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:10px; color:#B8BAC5; font-size:13px; font-weight:550; margin-bottom:2px; transition:background .16s,color .16s; width:100%; text-align:left; background:none; border:none; position:relative;}
.nav-item .material-symbols-outlined{font-size:18px; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%); color:#fff; box-shadow:0 6px 16px -4px rgba(37,99,235,.55);}
.nav-item .badge-count{margin-left:auto; background:rgba(255,255,255,.12); color:#fff; font-size:10px; padding:1px 6px; border-radius:20px; font-weight:650;}
.nav-item.active .badge-count{background:rgba(255,255,255,.25);}
.sidebar-foot{margin-top:auto; border-top:1px solid rgba(255,255,255,.08); padding-top:12px;}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px; cursor:pointer;}
.user-chip:hover{background:rgba(255,255,255,.06);}
.avatar{width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg, var(--blue-bright), var(--blue-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex-shrink:0;}
.user-chip .name{font-size:12.5px; font-weight:650; color:#fff;}
.user-chip .role{font-size:10.5px; color:#8E92A0;}

.main{flex:1; min-width:0;}
.topbar{height:var(--topbar-h); border-bottom:var(--line); background:#fff; display:flex; align-items:center; padding:0 24px; gap:14px; position:sticky; top:0; z-index:20;}
.topbar h1{font-size:16px; font-weight:750;}
.topbar .sub{font-size:12px; color:var(--gray-500);}
.content{padding:24px 26px 60px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.page-title{font-size:20px; font-weight:800; letter-spacing:-.01em;}
.page-sub{font-size:12.5px; color:var(--gray-500); margin-top:2px;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
.kpi-card{background:#fff; border:var(--line); border-radius:var(--radius-m); padding:16px 16px 14px; box-shadow:var(--shadow-1);}
.kpi-num{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700;}
.kpi-label{font-size:11.5px; color:var(--gray-500); margin-top:4px;}

.panel{background:#fff; border:var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-1); margin-bottom:18px;}
.panel-head{padding:14px 18px; border-bottom:var(--line); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-size:13.5px; font-weight:700;}
.panel-body{padding:6px 0;}

.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.filter-bar select, .filter-bar input{padding:8px 11px; border:1.5px solid var(--gray-200); border-radius:var(--radius-s); font-size:12.5px; background:#fff;}

table.tbl{width:100%; border-collapse:collapse; font-size:12.8px;}
table.tbl th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-400); padding:10px 16px; border-bottom:var(--line); font-weight:700;}
table.tbl td{padding:11px 16px; border-bottom:1px dashed var(--gray-150);}
table.tbl tr{cursor:pointer;}
table.tbl tr:hover td{background:var(--gray-50);}

.pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.8px; font-weight:700;}
.pill-nuevo{background:var(--blue-dim); color:var(--blue-deep);}
.pill-analisis{background:var(--amber-dim); color:var(--amber);}
.pill-esperando{background:var(--purple-dim); color:var(--purple);}
.pill-derivado{background:var(--gray-150); color:var(--gray-600);}
.pill-resuelto{background:var(--green-dim); color:var(--green);}
.pill-cerrado{background:var(--gray-150); color:var(--gray-500);}
.prio{font-weight:700; font-size:11px;}
.prio-Alta{color:var(--red);}
.prio-Media{color:var(--amber);}
.prio-Baja{color:var(--gray-500);}

.empty-state{padding:40px 20px; text-align:center; color:var(--gray-400); font-size:13px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow-2); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* Detalle de caso */
.detail-header{background:#fff; border:var(--line); border-radius:var(--radius-m); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-1);}
.dh-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
.dh-id{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--blue); font-weight:700;}
.dh-title{font-size:17px; font-weight:750; margin-top:2px;}
.info-strip{display:flex; gap:24px; flex-wrap:wrap; border-top:var(--line); padding-top:12px;}
.info-item{font-size:12px;}
.info-item span{display:block; color:var(--gray-400); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
.info-item b{font-size:13px;}
.action-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}

.detail-grid{display:grid; grid-template-columns:1.7fr 1fr; gap:16px;}
@media(max-width:900px){ .detail-grid{grid-template-columns:1fr;} }

.timeline{padding:4px 18px 14px;}
.t-item{display:grid; grid-template-columns:16px 100px 1fr; gap:12px; padding:9px 0; align-items:start; position:relative;}
.t-item::before{content:""; position:absolute; left:7px; top:22px; bottom:-9px; width:1.5px; background:var(--gray-200);}
.t-item:last-child::before{display:none;}
.t-dot{width:9px; height:9px; border-radius:50%; background:var(--gray-300,#D6D9E0); margin-top:4px;}
.t-dot.sistema{background:var(--gray-400);}
.t-dot.comentario{background:var(--blue);}
.t-dot.cambio_estado{background:var(--amber);}
.t-dot.asignacion{background:var(--purple);}
.t-when{font-size:10.5px; color:var(--gray-400); padding-top:1px;}
.t-what{font-size:12.5px; color:var(--ink);}
.t-who{font-size:10.5px; color:var(--gray-400); margin-top:2px;}

.side-block{background:#fff; border:var(--line); border-radius:var(--radius-m); padding:16px; margin-bottom:14px; box-shadow:var(--shadow-1);}
.side-block h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500); margin-bottom:10px;}
.comment-box textarea{width:100%; min-height:70px; border:1.5px solid var(--gray-200); border-radius:var(--radius-s); padding:9px 11px; font-size:12.5px; font-family:inherit; resize:vertical;}
.checkbox-row{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:11.5px; color:var(--gray-600);}

.alert-box{display:flex; gap:12px; background:var(--amber-dim); border:1px solid #FBD9A5; border-radius:var(--radius-m); padding:14px 16px; margin-bottom:16px; font-size:12.5px; color:#7C4A03;}
.alert-box.purple{background:var(--purple-dim); border-color:#DDCBFB; color:#4C1D95;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:700px){ .form-grid{grid-template-columns:1fr;} }

@media print{ .sidebar,.topbar,.action-row,.comment-box{display:none !important;} }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-mark"><div class="dot"></div><div><span>Gestión de Casos</span><small>Grupo París · Calidad</small></div></div>
    <h1>Ingresar</h1>
    <p class="sub">Accedé con tu usuario del equipo de Calidad.</p>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>Usuario</label><input id="loginUsuario" type="text" placeholder="tu.usuario" onkeydown="if(event.key==='Enter')intentarLogin()"></div>
    <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')intentarLogin()"></div>
    <button class="btn btn-primary" onclick="intentarLogin()" id="btnLogin">Ingresar</button>
    <div class="login-foot">Sistema interno — Grupo París</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar">
    <div class="brand"><div class="dot"></div><div><strong>Gestión de Casos</strong><small>Grupo París</small></div></div>
    <button class="nav-item active" id="navDashboard" onclick="setView('dashboard')"><span class="material-symbols-outlined">dashboard</span>Dashboard</button>
    <button class="nav-item" id="navBandeja" onclick="setView('bandeja')"><span class="material-symbols-outlined">inbox</span>Bandeja de entrada<span class="badge-count hidden" id="badgeBandeja">0</span></button>
    <button class="nav-item" id="navCasos" onclick="setView('casos')"><span class="material-symbols-outlined">folder_open</span>Casos</button>
    <button class="nav-item" id="navBuscar" onclick="setView('buscar')"><span class="material-symbols-outlined">search</span>Buscar cliente / VIN</button>
    <button class="nav-item" id="navReportar" onclick="setView('reportar')"><span class="material-symbols-outlined">add_circle</span>Reportar un caso</button>
    <button class="nav-item" id="navConfig" onclick="setView('config')"><span class="material-symbols-outlined">settings</span>Configuración</button>
    <div class="sidebar-foot">
      <div class="user-chip" onclick="cerrarSesion()" title="Cerrar sesión">
        <div class="avatar" id="userAvatar">—</div>
        <div><div class="name" id="userNombre">—</div><div class="role" id="userRol">—</div></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div><h1 id="topbarTitulo">Dashboard</h1><div class="sub" id="topbarSub">Estado general de los casos</div></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONEXIÓN CON EL BACKEND — mismo patrón que Planning de Entregas:
// la URL de Apps Script se lee de una variable de entorno de Vercel
// (VITE_API_URL) a través de /api/config, nunca se pide ni se guarda
// hardcodeada acá. Ver api/config.js.
// ============================================================
var API_URL = null;

function cargarConfigBackend(){
  return fetch('/api/config').then(function(r){
    if(!r.ok) throw new Error('config no disponible');
    return r.json();
  }).then(function(cfg){
    if(!cfg || !cfg.apiUrl) throw new Error('API_URL no configurada');
    API_URL = cfg.apiUrl;
    return API_URL;
  });
}
function gasGet(action, params){
  params = params || {};
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function(k){ if(params[k]!==undefined && params[k]!==null) url += '&'+k+'='+encodeURIComponent(params[k]); });
  return fetch(url).then(function(r){ return r.json(); });
}
function gasPost(action, params){
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:action, params:params||{}})
  }).then(function(r){ return r.json(); });
}

// ============================================================
// SESIÓN
// ============================================================
function sesionActual(){
  try{ return JSON.parse(localStorage.getItem('gc_sesion')||'null'); }catch(e){ return null; }
}
function guardarSesion(s){ localStorage.setItem('gc_sesion', JSON.stringify(s)); }
function cerrarSesion(){ localStorage.removeItem('gc_sesion'); location.reload(); }

function intentarLogin(){
  var usuario = document.getElementById('loginUsuario').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('btnLogin');
  errEl.style.display = 'none';
  if(!usuario || !password){ errEl.textContent='Completá usuario y contraseña.'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  cargarConfigBackend().then(function(){
    return gasPost('login', {usuario:usuario, password:password});
  }).then(function(res){
    btn.disabled = false; btn.textContent = 'Ingresar';
    if(!res.ok){ errEl.textContent = res.error||'No se pudo ingresar.'; errEl.style.display='block'; return; }
    guardarSesion(res);
    iniciarApp();
  }).catch(function(err){
    btn.disabled = false; btn.textContent = 'Ingresar';
    errEl.textContent = 'No se pudo conectar con el backend. ('+err.message+')';
    errEl.style.display = 'block';
  });
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ============================================================
// ARRANQUE
// ============================================================
window.addEventListener('DOMContentLoaded', function(){
  var s = sesionActual();
  if(s){ iniciarApp(); }
});

function iniciarApp(){
  var s = sesionActual();
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userNombre').textContent = s.nombre;
  document.getElementById('userRol').textContent = etiquetaRol_(s.rol);
  document.getElementById('userAvatar').textContent = (s.nombre||'?').charAt(0).toUpperCase();
  cargarConfigBackend().then(function(){
    setView('dashboard');
    actualizarBadgeBandeja_();
  }).catch(function(err){
    document.getElementById('content').innerHTML = '<div class="empty-state">No se pudo conectar con el backend.<br>'+err.message+'</div>';
  });
}
function etiquetaRol_(r){
  var mapa = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  return mapa[r] || r;
}

// ============================================================
// NAVEGACIÓN
// ============================================================
var VISTAS = ['dashboard','bandeja','casos','buscar','reportar','config','detalle'];
var TITULOS = {
  dashboard:['Dashboard','Estado general de los casos'],
  bandeja:['Bandeja de entrada','Eventos esperando revisión antes de convertirse en caso'],
  casos:['Casos','Todos los casos registrados'],
  buscar:['Buscar cliente / VIN','Historial completo de un cliente o vehículo'],
  reportar:['Reportar un caso','Carga manual — queda igual que cualquier otro caso'],
  config:['Configuración','Catálogos y parámetros del sistema'],
  detalle:['Detalle del caso','']
};

function setView(v, param){
  VISTAS.forEach(function(x){
    var nav = document.getElementById('nav'+x.charAt(0).toUpperCase()+x.slice(1));
    if(nav) nav.classList.toggle('active', x===v);
  });
  document.getElementById('topbarTitulo').textContent = TITULOS[v][0];
  document.getElementById('topbarSub').textContent = TITULOS[v][1];
  var render = {
    dashboard: renderDashboard,
    bandeja: renderBandeja,
    casos: renderCasos,
    buscar: renderBuscar,
    reportar: renderReportar,
    config: renderConfig,
    detalle: function(){ renderDetalle(param); }
  }[v];
  document.getElementById('content').innerHTML = '<div class="empty-state">Cargando…</div>';
  if(render) render();
}

function actualizarBadgeBandeja_(){
  gasGet('dashboard').then(function(res){
    if(!res.ok) return;
    var badge = document.getElementById('badgeBandeja');
    var n = res.eventosPendientesRevision||0;
    if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  });
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(){
  gasGet('dashboard').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var html = '<div class="kpi-grid">'+
      kpiCard_(res.urgentes,'Casos urgentes','var(--red)')+
      kpiCard_(res.abiertos,'Casos abiertos','var(--ink)')+
      kpiCard_(res.vencidos,'Vencidos (SLA)','var(--red)')+
      kpiCard_(res.nuevosSinAsignar,'Nuevos sin asignar','var(--blue)')+
      kpiCard_(res.resueltosSemana,'Resueltos esta semana','var(--green)')+
      kpiCard_(res.eventosPendientesRevision,'En bandeja de entrada','var(--purple)')+
    '</div>';
    if(res.eventosPendientesRevision>0){
      html += '<div class="alert-box purple"><span class="material-symbols-outlined">inbox</span><div>Hay <b>'+res.eventosPendientesRevision+' evento(s)</b> esperando revisión en la <a href="#" onclick="setView(\'bandeja\');return false;" style="color:var(--purple);font-weight:700;text-decoration:underline;">Bandeja de entrada</a> antes de convertirse en caso.</div></div>';
    }
    document.getElementById('content').innerHTML = html;
  });
}
function kpiCard_(num, label, color){
  return '<div class="kpi-card"><div class="kpi-num" style="color:'+color+';">'+(num!==undefined?num:'—')+'</div><div class="kpi-label">'+label+'</div></div>';
}

// ============================================================
// BANDEJA DE ENTRADA
// ============================================================
function renderBandeja(){
  gasGet('eventosPendientes').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var eventos = res.eventos||[];
    if(eventos.length===0){
      document.getElementById('content').innerHTML = '<div class="panel"><div class="empty-state">✓ No hay eventos esperando revisión.</div></div>';
      return;
    }
    var filas = eventos.map(function(e){
      var d = e.datosNormalizados||{};
      return '<tr>'+
        '<td class="mono" style="color:var(--gray-400);">'+e.id+'</td>'+
        '<td>'+(d.cliente||'—')+'</td>'+
        '<td>'+(d.marca||'—')+' '+(d.modelo||'')+'</td>'+
        '<td>'+(d.vin||'—')+'</td>'+
        '<td><span class="pill pill-nuevo">'+(e.fuente||'Manual')+'</span></td>'+
        '<td>'+(d.motivo||'—')+'</td>'+
        '<td style="white-space:nowrap;">'+e.fechaRecepcion+'</td>'+
        '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" style="width:auto;" onclick="confirmarEvento_(\''+e.id+'\', event)">Convertir en caso</button> '+
          '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="descartarEvento_(\''+e.id+'\', event)">Descartar</button></td>'+
      '</tr>';
    }).join('');
    document.getElementById('content').innerHTML =
      '<div class="panel"><table class="tbl"><thead><tr><th>Evento</th><th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Fuente</th><th>Motivo</th><th>Recibido</th><th></th></tr></thead><tbody>'+filas+'</tbody></table></div>';
  });
}
function confirmarEvento_(id, ev){
  ev.stopPropagation();
  var s = sesionActual();
  gasPost('confirmarEventoComoCaso', {idEvento:id, usuario:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Caso creado: '+res.codigo);
    renderBandeja(); actualizarBadgeBandeja_();
  });
}
function descartarEvento_(id, ev){
  ev.stopPropagation();
  if(!confirm('¿Descartar este evento? No se va a crear un caso.')) return;
  gasPost('descartarEvento', {idEvento:id, motivo:'Descartado desde la Bandeja de entrada.'}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Evento descartado');
    renderBandeja(); actualizarBadgeBandeja_();
  });
}

// ============================================================
// CASOS (listado + filtros)
// ============================================================
var filtroCasos_ = {};
function renderCasos(){
  var html = '<div class="filter-bar">'+
    '<select id="fEstado" onchange="aplicarFiltrosCasos_()"><option value="">Todos los estados</option>'+
      ['nuevo','analisis','esperando','derivado','resuelto','cerrado'].map(function(e){return '<option value="'+e+'">'+e+'</option>';}).join('')+
    '</select>'+
    '<select id="fPrioridad" onchange="aplicarFiltrosCasos_()"><option value="">Toda prioridad</option><option>Alta</option><option>Media</option><option>Baja</option></select>'+
    '<input id="fBusqueda" type="text" placeholder="Buscar por cliente, VIN..." oninput="aplicarFiltrosCasos_()">'+
  '</div><div class="panel"><div id="tablaCasos"><div class="empty-state">Cargando…</div></div></div>';
  document.getElementById('content').innerHTML = html;
  cargarYPintarCasos_();
}
function cargarYPintarCasos_(){
  gasGet('casos').then(function(res){
    if(!res.ok){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    window._casosCache = res.casos || res || [];
    pintarTablaCasos_();
  });
}
function aplicarFiltrosCasos_(){ pintarTablaCasos_(); }
function pintarTablaCasos_(){
  var estado = document.getElementById('fEstado').value;
  var prioridad = document.getElementById('fPrioridad').value;
  var q = document.getElementById('fBusqueda').value.toLowerCase();
  var casos = (window._casosCache||[]).filter(function(c){
    if(estado && c.estado!==estado) return false;
    if(prioridad && c.prioridad!==prioridad) return false;
    if(q){
      var texto = ((c.cliente||'')+' '+(c.dominio||'')+' '+(c.motivo||'')+' '+(c.id||'')).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  if(casos.length===0){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">No hay casos que coincidan.</div>'; return; }
  var filas = casos.map(function(c){
    return '<tr onclick="setView(\'detalle\',\''+c.id+'\')">'+
      '<td class="mono" style="color:var(--blue);font-weight:700;">'+c.id+'</td>'+
      '<td>'+(c.cliente||'—')+'</td>'+
      '<td>'+(c.marca||'—')+'</td>'+
      '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
      '<td><span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span></td>'+
      '<td>'+(c.responsable||'<span style="color:var(--gray-400);">Sin asignar</span>')+'</td>'+
      '<td style="white-space:nowrap;">'+(c.fechaCreacion||'—')+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaCasos').innerHTML =
    '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Estado</th><th>Prioridad</th><th>Responsable</th><th>Creado</th></tr></thead><tbody>'+filas+'</tbody></table>';
}

// ============================================================
// DETALLE DE CASO
// ============================================================
function renderDetalle(id){
  gasGet('caso', {id:id}).then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var c = res.caso;
    document.getElementById('topbarSub').textContent = c.cliente+' · '+c.id;
    var html = '<div class="detail-header">'+
      '<div class="dh-top"><div><div class="dh-id">'+c.id+'</div><div class="dh-title">'+(c.motivo||c.tipoCaso||'Caso')+' — '+(c.marca||'')+' '+(c.modelo||'')+'</div></div>'+
        '<span class="pill pill-'+c.estado+'" style="font-size:12px;padding:5px 12px;">'+c.estado+'</span></div>'+
      '<div class="info-strip">'+
        infoItem_('Cliente', c.cliente)+infoItem_('DNI', c.dni||'—')+infoItem_('Teléfono', c.telefono||'—')+
        infoItem_('VIN / Dominio', c.dominio||'—')+infoItem_('Sucursal', c.sucursal||'—')+infoItem_('Sector', c.sector||'—')+
        infoItem_('Fuente', c.fuente)+infoItem_('Responsable', c.responsable||'Sin asignar')+
        infoItem_('Prioridad', '<span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span>')+
        infoItem_('SLA vence', c.slaVencimiento||'—')+
      '</div>'+
      (c.descripcion ? '<div style="margin-top:12px;font-size:12.8px;color:var(--gray-700);">'+c.descripcion+'</div>' : '')+
      '<div class="action-row">'+
        estadoBotones_(c)+
        '<select id="selResponsable" style="padding:8px 11px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:12.5px;"><option value="">Asignar a...</option></select>'+
        '<button class="btn btn-ghost btn-sm" onclick="asignarCasoUI_(\''+c.id+'\')">Asignar</button>'+
        '<select id="selPrioridad" style="padding:8px 11px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:12.5px;"><option value="Alta">Alta</option><option value="Media">Media</option><option value="Baja">Baja</option></select>'+
        '<button class="btn btn-ghost btn-sm" onclick="cambiarPrioridadUI_(\''+c.id+'\')">Cambiar prioridad</button>'+
      '</div>'+
    '</div>';

    html += '<div class="detail-grid"><div>';
    html += '<div class="panel"><div class="panel-head"><h3>Novedades</h3></div><div class="timeline" id="timelineCaso">'+renderTimelineSeguimientos_(c.seguimientos||[])+'</div></div>';
    if(c.timelineVin && c.timelineVin.length){
      html += '<div class="panel"><div class="panel-head"><h3>Historial del vehículo (todos los casos)</h3></div><div class="timeline">'+
        c.timelineVin.map(function(t){ return '<div class="t-item"><div class="t-dot sistema"></div><div class="t-when">'+t.fecha+'</div><div><div class="t-what">'+t.tipoEvento+' — '+t.descripcion+'</div><div class="t-who">'+t.casoRelacionado+' · '+t.fuente+'</div></div></div>'; }).join('')+
      '</div></div>';
    }
    html += '</div><div>';
    html += '<div class="side-block"><h4>Agregar comentario</h4><div class="comment-box"><textarea id="comentarioTexto" placeholder="Escribí una novedad..."></textarea></div>'+
      '<div class="checkbox-row"><input type="checkbox" id="comentarioVisible"><label for="comentarioVisible">Visible para quien reportó</label></div>'+
      '<button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px;" onclick="comentarCasoUI_(\''+c.id+'\')">Guardar comentario</button></div>';
    html += '</div></div>';

    document.getElementById('content').innerHTML = html;
    poblarSelectResponsables_();
  });
}
function infoItem_(label, valor){
  return '<div class="info-item"><span>'+label+'</span><b>'+valor+'</b></div>';
}
function estadoBotones_(c){
  var estados = ['nuevo','analisis','esperando','derivado','resuelto','cerrado'];
  return '<select id="selEstado" style="padding:8px 11px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:12.5px;">'+
    estados.map(function(e){ return '<option value="'+e+'"'+(e===c.estado?' selected':'')+'>'+e+'</option>'; }).join('')+
    '</select><button class="btn btn-dark btn-sm" onclick="cambiarEstadoUI_(\''+c.id+'\')">Cambiar estado</button>';
}
function renderTimelineSeguimientos_(seguimientos){
  if(!seguimientos.length) return '<div class="empty-state" style="padding:24px;">Todavía no hay novedades.</div>';
  return seguimientos.map(function(s){
    return '<div class="t-item"><div class="t-dot '+s.tipo+'"></div><div class="t-when">'+s.fecha+'</div><div><div class="t-what">'+s.texto+'</div><div class="t-who">'+s.autor+'</div></div></div>';
  }).join('');
}
function poblarSelectResponsables_(){
  var sel = document.getElementById('selResponsable');
  if(!sel) return;
  gasGet('config').then(function(res){
    if(!res.ok) return;
    (res.catalogos.Responsable || res.catalogos.Sector || []).forEach(function(r){
      var opt = document.createElement('option'); opt.value=r; opt.textContent=r; sel.appendChild(opt);
    });
  });
}
function cambiarEstadoUI_(id){
  var estado = document.getElementById('selEstado').value;
  var s = sesionActual();
  gasPost('cambiarEstadoCaso', {id:id, estado:estado, autor:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Estado actualizado'); renderDetalle(id);
  });
}
function asignarCasoUI_(id){
  var responsable = document.getElementById('selResponsable').value;
  if(!responsable){ showToast('Elegí a quién asignar'); return; }
  var s = sesionActual();
  gasPost('asignarCaso', {id:id, responsable:responsable, autor:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Caso asignado a '+responsable); renderDetalle(id);
  });
}
function cambiarPrioridadUI_(id){
  var prioridad = document.getElementById('selPrioridad').value;
  var s = sesionActual();
  gasPost('cambiarPrioridadCaso', {id:id, prioridad:prioridad, autor:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Prioridad actualizada'); renderDetalle(id);
  });
}
function comentarCasoUI_(id){
  var texto = document.getElementById('comentarioTexto').value.trim();
  var visible = document.getElementById('comentarioVisible').checked;
  if(!texto){ showToast('Escribí algo primero'); return; }
  var s = sesionActual();
  gasPost('comentarCaso', {id:id, autor:s?s.nombre:'', texto:texto, visibleParaReportante:visible}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Comentario guardado'); renderDetalle(id);
  });
}

// ============================================================
// BUSCAR CLIENTE / VIN
// ============================================================
function renderBuscar(){
  document.getElementById('content').innerHTML =
    '<div class="panel"><div style="padding:18px;">'+
      '<div style="display:flex;gap:8px;"><input id="buscarQuery" type="text" placeholder="DNI, VIN/dominio o nombre del cliente..." style="flex:1;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:13px;" onkeydown="if(event.key===\'Enter\')ejecutarBusqueda_()">'+
      '<button class="btn btn-primary" style="width:auto;" onclick="ejecutarBusqueda_()">Buscar</button></div>'+
    '</div></div><div id="resultadoBusqueda"></div>';
}
function ejecutarBusqueda_(){
  var q = document.getElementById('buscarQuery').value.trim();
  if(!q) return;
  document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">Buscando…</div>';
  gasGet('buscarCliente', {query:q}).then(function(res){
    if(!res.ok){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos||[];
    if(casos.length===0){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="panel"><div class="empty-state">No se encontraron casos con ese dato.</div></div>'; return; }
    var filas = casos.map(function(c){
      return '<tr onclick="setView(\'detalle\',\''+c.id+'\')">'+
        '<td class="mono" style="color:var(--blue);font-weight:700;">'+c.id+'</td>'+
        '<td>'+(c.cliente||'—')+'</td>'+
        '<td>'+(c.marca||'—')+' '+(c.modelo||'')+'</td>'+
        '<td>'+(c.dominio||'—')+'</td>'+
        '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
        '<td>'+(c.fechaCreacion||'—')+'</td>'+
      '</tr>';
    }).join('');
    document.getElementById('resultadoBusqueda').innerHTML =
      '<div class="panel"><div class="panel-head"><h3>'+casos.length+' caso(s) encontrado(s)</h3></div>'+
      '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>'+filas+'</tbody></table></div>';
  });
}

// ============================================================
// REPORTAR UN CASO (manual — pasa por el Motor de Eventos igual que todo)
// ============================================================
function renderReportar(){
  gasGet('config').then(function(res){
    var cat = (res.ok && res.catalogos) || {};
    var opciones = function(lista){ return (lista||[]).map(function(v){return '<option>'+v+'</option>';}).join(''); };
    document.getElementById('content').innerHTML =
      '<div class="panel"><div style="padding:22px;">'+
      '<div class="form-grid">'+
        campo_('Cliente','repCliente','text','','full')+
        campo_('DNI','repDni','text')+
        campo_('Teléfono','repTelefono','text')+
        campo_('Email','repEmail','email')+
        campoSelect_('Marca','repMarca', opciones(cat.Marca))+
        campo_('Modelo','repModelo','text')+
        campo_('Dominio / VIN','repDominio','text')+
        campoSelect_('Sucursal','repSucursal', opciones(cat.Sucursal))+
        campoSelect_('Sector que reporta','repSector', opciones(cat.Sector))+
        campoSelect_('Tipo de caso','repTipoCaso', opciones(cat['Tipo de Caso']))+
        campoSelect_('Prioridad sugerida','repPrioridad', opciones(cat.Prioridad))+
        campo_('Motivo','repMotivo','text','','full')+
        campoTextarea_('Descripción','repDescripcion')+
      '</div>'+
      '<button class="btn btn-primary" style="width:auto;margin-top:14px;" onclick="crearCasoUI_()">Crear caso</button>'+
      '</div></div>';
  });
}
function campo_(label,id,type,valor,full){
  return '<div class="field'+(full?' full':'')+'"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+(valor||'')+'"></div>';
}
function campoSelect_(label,id,opciones){
  return '<div class="field"><label>'+label+'</label><select id="'+id+'"><option value="">—</option>'+opciones+'</select></div>';
}
function campoTextarea_(label,id){
  return '<div class="field full"><label>'+label+'</label><textarea id="'+id+'"></textarea></div>';
}
function crearCasoUI_(){
  var s = sesionActual();
  var datos = {
    cliente: document.getElementById('repCliente').value.trim(),
    dni: document.getElementById('repDni').value.trim(),
    telefono: document.getElementById('repTelefono').value.trim(),
    email: document.getElementById('repEmail').value.trim(),
    marca: document.getElementById('repMarca').value,
    modelo: document.getElementById('repModelo').value.trim(),
    vin: document.getElementById('repDominio').value.trim(),
    sucursal: document.getElementById('repSucursal').value,
    sector: document.getElementById('repSector').value,
    tipoCaso: document.getElementById('repTipoCaso').value,
    prioridadSugerida: document.getElementById('repPrioridad').value || 'Media',
    motivo: document.getElementById('repMotivo').value.trim(),
    descripcion: document.getElementById('repDescripcion').value.trim(),
    fuente: 'Manual',
    usuario: s?s.nombre:''
  };
  if(!datos.cliente){ showToast('Falta el nombre del cliente'); return; }
  gasPost('crearCaso', datos).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Caso creado: '+res.codigo);
    setView('detalle', res.id);
  });
}

// ============================================================
// CONFIGURACIÓN (lectura de catálogos y parámetros)
// ============================================================
function renderConfig(){
  gasGet('config').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var cat = res.catalogos||{};
    var conf = res.config||{};
    var html = '<div class="panel"><div class="panel-head"><h3>Catálogos</h3></div><div style="padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;">';
    Object.keys(cat).forEach(function(nombre){
      html += '<div><div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;margin-bottom:6px;">'+nombre+'</div>'+
        cat[nombre].map(function(v){return '<div style="font-size:12.5px;padding:3px 0;">'+v+'</div>';}).join('')+'</div>';
    });
    html += '</div></div>';
    html += '<div class="panel"><div class="panel-head"><h3>Parámetros</h3></div><table class="tbl"><tbody>'+
      Object.keys(conf).map(function(k){ return '<tr><td style="color:var(--gray-500);">'+k+'</td><td class="mono">'+conf[k]+'</td></tr>'; }).join('')+
      '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
  });
}
