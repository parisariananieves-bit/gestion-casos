var MESES_ES_ = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS_ES_ = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function renderCalendario(){
  var hoy = new Date();
  if(window._calAnio===undefined){ window._calAnio = hoy.getFullYear(); window._calMes = hoy.getMonth(); }
  if(window._calTipo===undefined) window._calTipo = 'creacion';
  document.getElementById('content').innerHTML =
    '<div class="cal-toolbar">'+
      '<button class="cal-nav-btn" onclick="navCalMes_(-1)"><span class="material-symbols-outlined" style="font-size:18px;">chevron_left</span></button>'+
      '<div class="cal-mes-label" id="calMesLabel"></div>'+
      '<button class="cal-nav-btn" onclick="navCalMes_(1)"><span class="material-symbols-outlined" style="font-size:18px;">chevron_right</span></button>'+
      '<button class="cal-today-btn" onclick="irAHoyCal_()">Hoy</button>'+
      fdropHtml_('cfMarca','Marca')+
      fdropHtml_('cfSucursal','Sucursal')+
      '<div class="cal-toggle" id="calToggleTipo">'+
        '<button data-v="creacion" onclick="setCalTipo_(\'creacion\')">Por creación</button>'+
        '<button data-v="sla" onclick="setCalTipo_(\'sla\')">Por vencimiento SLA</button>'+
      '</div>'+
    '</div>'+
    '<div class="panel" style="padding:12px;"><div id="calGridWrap"><div class="empty-state">Cargando…</div></div></div>'+
    '<div class="cal-legend">'+
      '<span><i style="background:var(--danger);"></i>Prioridad alta</span>'+
      '<span><i style="background:var(--warn);"></i>Prioridad media</span>'+
      '<span><i style="background:var(--text-faint);"></i>Prioridad baja</span>'+
    '</div>';
  var cache = leerCache_('casos');
  if(cache){ window._casosCache = cache; poblarSelectsCalendario_(cache); pintarCalendario_(); }
  gasGet('casos').then(function(res){
    if(!res.ok) return;
    var casos = res.casos || res || [];
    guardarCache_('casos', casos);
    if(window._vistaActual!=='calendario') return;
    window._casosCache = casos;
    poblarSelectsCalendario_(casos);
    pintarCalendario_();
  });
}
function poblarSelectsCalendario_(casos){
  configCacheada_().then(function(cfg){
    var cat = (cfg.ok && cfg.catalogos) || {};
    pintarDropdownFiltro_('cfMarcaBtn','cfMarcaMenu','cfMarca','Marca', (cat.Marca||[]).concat(casos.map(function(c){return c.marca;})), 'pintarCalendario_');
    pintarDropdownFiltro_('cfSucursalBtn','cfSucursalMenu','cfSucursal','Sucursal', (cat.Sucursal||[]).concat(casos.map(function(c){return c.sucursal;})), 'pintarCalendario_');
  });
}
function setCalTipo_(tipo){
  window._calTipo = tipo;
  Array.from(document.getElementById('calToggleTipo').children).forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-v')===tipo); });
  pintarCalendario_();
}
function navCalMes_(delta){
  window._calMes += delta;
  if(window._calMes<0){ window._calMes=11; window._calAnio--; }
  if(window._calMes>11){ window._calMes=0; window._calAnio++; }
  pintarCalendario_();
}
function irAHoyCal_(){
  var hoy = new Date();
  window._calAnio = hoy.getFullYear(); window._calMes = hoy.getMonth();
  pintarCalendario_();
}
function pintarCalendario_(){
  var wrap = document.getElementById('calGridWrap');
  if(!wrap) return; // ya no estamos en esta vista
  document.getElementById('calMesLabel').textContent = MESES_ES_[window._calMes]+' '+window._calAnio;
  Array.from(document.getElementById('calToggleTipo').children).forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-v')===window._calTipo); });

  var marca = document.getElementById('cfMarca').value;
  var sucursal = document.getElementById('cfSucursal').value;
  var casos = (window._casosCache||[]).filter(function(c){
    if(marca && c.marca!==marca) return false;
    if(sucursal && c.sucursal!==sucursal) return false;
    return true;
  });

  // Agrupamos por fecha (clave YYYY-M-D) según el tipo elegido.
  var porFecha = {};
  casos.forEach(function(c){
    var campo = window._calTipo==='sla' ? c.slaVencimiento : c.fechaCreacion;
    var f = parseFechaGC_(campo);
    if(!f) return;
    var clave = f.getFullYear()+'-'+f.getMonth()+'-'+f.getDate();
    (porFecha[clave] = porFecha[clave]||[]).push(c);
  });

  var primerDia = new Date(window._calAnio, window._calMes, 1);
  var offsetLunes = (primerDia.getDay()+6)%7; // que la semana arranque en lunes
  var inicioGrilla = new Date(window._calAnio, window._calMes, 1-offsetLunes);
  var hoy = new Date();

  var html = DIAS_ES_.map(function(d){ return '<div class="cal-weekday">'+d+'</div>'; }).join('');
  for(var i=0;i<42;i++){
    var d = new Date(inicioGrilla.getFullYear(), inicioGrilla.getMonth(), inicioGrilla.getDate()+i);
    var esOtroMes = d.getMonth()!==window._calMes;
    var esHoy = d.toDateString()===hoy.toDateString();
    var clave = d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    var casosDia = (porFecha[clave]||[]).slice().sort(function(a,b){ return ({Alta:0,Media:1,Baja:2}[a.prioridad]||3) - ({Alta:0,Media:1,Baja:2}[b.prioridad]||3); });
    var visibles = casosDia.slice(0,3);
    var resto = casosDia.length - visibles.length;
    html += '<div class="cal-day'+(esOtroMes?' otro-mes':'')+(esHoy?' hoy':'')+'">'+
      '<div class="cal-daynum">'+d.getDate()+'</div>'+
      visibles.map(function(c){
        return '<div class="cal-case-chip prio-'+c.prioridad+'" title="'+c.id+' — '+(c.cliente||'')+' — '+(c.motivo||c.tipoCaso||'')+'" onclick="setView(\'detalle\',\''+c.id+'\')">'+c.id+' · '+(c.cliente||'—')+'</div>';
      }).join('')+
      (resto>0 ? '<div class="cal-mas" onclick="verDiaCalendario_(\''+clave+'\')">+'+resto+' más</div>' : '')+
    '</div>';
  }
  wrap.innerHTML = '<div class="cal-grid">'+html+'</div>';
  window._calPorFecha = porFecha;
}
function verDiaCalendario_(clave){
  var casos = (window._calPorFecha||{})[clave]||[];
  var partes = clave.split('-');
  var fechaLegible = partes[2]+'/'+(Number(partes[1])+1)+'/'+partes[0];
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modalListaFiltrada').classList.add('show');
  document.getElementById('listaFiltradaTitulo').textContent = 'Casos del '+fechaLegible;
  document.getElementById('listaFiltradaBody').innerHTML = '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Estado</th><th>Prioridad</th><th>Responsable</th></tr></thead><tbody>'+
    casos.map(function(c){
      return '<tr onclick="cerrarModalListaFiltrada_();setView(\'detalle\',\''+c.id+'\')">'+
        '<td class="mono" style="color:var(--caso);font-weight:700;">'+c.id+'</td>'+
        '<td>'+(c.cliente||'—')+'</td><td>'+(c.marca||'—')+'</td>'+
        '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
        '<td><span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span></td>'+
        '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
      '</tr>';
    }).join('')+
  '</tbody></table>';
}

// EVIDENCIAS DEL CLIENTE — sección de solo lectura (no se puede editar ni
// borrar desde el expediente, punto 6 de la especificación de reclamos).
// Fotos con preview, videos reproducibles si el formato lo permite, y PDFs
// / otros documentos para descargar. Los archivos viven en Drive, en una
// carpeta privada por caso — nunca con un link "público".

function renderEvidenciasCliente_(c){
  var evidencias = [];
  try{ evidencias = JSON.parse(c.evidencias||'[]'); }catch(e){}
  if(!evidencias.length) return '';
  var items = evidencias.map(function(ev){
    var esImagen = String(ev.tipo||'').indexOf('image')===0;
    var esVideo = String(ev.tipo||'').indexOf('video')===0;
    var esPdf = ev.tipo==='application/pdf';
    var preview = esImagen
      ? '<a href="'+ev.url+'" target="_blank" rel="noopener"><img src="'+ev.url+'" style="width:100%;height:92px;object-fit:cover;border-radius:10px;display:block;" onerror="this.parentElement.innerHTML=\'<span class=&quot;material-symbols-outlined&quot; style=&quot;font-size:28px;color:var(--text-faint);&quot;>image</span>\';"></a>'
      : esVideo
        ? '<video controls style="width:100%;height:92px;border-radius:10px;background:#000;object-fit:contain;" preload="metadata"><source src="'+ev.url+'" type="'+ev.tipo+'"></video>'
        : '<a href="'+ev.url+'" target="_blank" rel="noopener" style="width:100%;height:92px;border-radius:10px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;"><span class="material-symbols-outlined" style="font-size:28px;color:var(--text-faint);">'+(esPdf?'picture_as_pdf':'description')+'</span></a>';
    return '<div style="border:1px solid var(--hairline);border-radius:12px;padding:8px;">'+
      preview+
      '<div style="font-size:11px;margin-top:6px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="'+(ev.nombre||'')+'">'+(ev.nombre||'archivo')+'</div>'+
      '<a href="'+ev.url+'" target="_blank" rel="noopener" style="font-size:10.5px;color:var(--caso-bright);">Abrir / descargar</a>'+
    '</div>';
  }).join('');
  return '<div class="panel"><div class="panel-head"><h3>📎 Evidencias del cliente ('+evidencias.length+')</h3></div>'+
    '<div style="padding:14px 17px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;">'+items+'</div>'+
    '<div style="padding:0 17px 14px;font-size:10.5px;color:var(--text-faint);">Evidencias originales adjuntadas por el cliente — no se pueden modificar desde acá.</div>'+
  '</div>';
}
// Link del formulario público de reclamos — la misma página estática
// (reclamo.html) vive en este mismo dominio de Vercel, así que no hay
// ninguna integración de WhatsApp que configurar: solo se copia el link
// para pegarlo a mano donde haga falta (WhatsApp, firma de mail, etc.).
function copiarLinkFormularioPublico_(){
  var link = window.location.origin + '/reclamo.html';
  var hacerCopia = function(){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(link);
    var ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); return Promise.resolve();
  };
  hacerCopia().then(function(){ showToast('Link del formulario copiado — pegalo en WhatsApp o donde lo necesites.'); })
    .catch(function(){ prompt('Copiá este link del formulario de reclamos:', link); });
}
function copiarLinkSeguimiento_(idCaso, token){
  var base = window.location.origin + '/seguimiento.html';
  var link = base + '?id=' + encodeURIComponent(idCaso) + '&token=' + encodeURIComponent(token);
  var hacerCopia = function(){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(link);
    var ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); return Promise.resolve();
  };
  hacerCopia().then(function(){ showToast('Link de seguimiento copiado — pegalo en WhatsApp o mail para el cliente.'); })
    .catch(function(){ prompt('Copiá este link para compartir con el cliente:', link); });
}

// BUSCAR CLIENTE / VIN — agrupa por VIN: un mismo vehículo con varios
// casos aparece como UN solo historial expandible, en vez de filas
// sueltas repetidas. Sin VIN, se agrupa por cliente.
// ============================================================
function renderBuscar(){
  var qInicial = window._pendingSearchQuery || '';
  window._pendingSearchQuery = null;
  document.getElementById('content').innerHTML =
    '<div class="panel"><div style="padding:18px;">'+
      '<div style="display:flex;gap:8px;"><input id="buscarQuery" type="text" placeholder="DNI, VIN/dominio o nombre del cliente..." value="'+qInicial.replace(/"/g,'&quot;')+'" style="flex:1;padding:10px 12px;border:1.5px solid var(--hairline);border-radius:9px;font-size:13px;background:var(--panel-2);color:var(--text);" onkeydown="if(event.key===\'Enter\')ejecutarBusqueda_()">'+
      '<button class="btn btn-primary" style="width:auto;" onclick="ejecutarBusqueda_()">Buscar</button></div>'+
    '</div></div><div id="resultadoBusqueda"></div>';
  if(qInicial) ejecutarBusqueda_();
}
function agruparPorVin_(casos){
  var grupos = [], mapa = {};
  casos.forEach(function(c){
    var clave = (c.dominio && String(c.dominio).trim()) ? 'VIN:'+c.dominio.trim().toUpperCase() : 'CLIENTE:'+(c.cliente||'—');
    if(!mapa[clave]){
      mapa[clave] = {vin: c.dominio||'', cliente:c.cliente, marca:c.marca, modelo:c.modelo, casos:[]};
      grupos.push(mapa[clave]);
    }
    mapa[clave].casos.push(c);
  });
  grupos.forEach(function(g){ g.casos.sort(function(a,b){ return (parseFechaGC_(b.fechaCreacion)||0) - (parseFechaGC_(a.fechaCreacion)||0); }); });
  grupos.sort(function(a,b){ return b.casos.length - a.casos.length; });
  return grupos;
}
function ejecutarBusqueda_(){
  var q = document.getElementById('buscarQuery').value.trim();
  if(!q) return;
  document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">Buscando…</div>';
  gasGet('buscarCliente', {query:q}).then(function(res){
    if(!res.ok){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos||[];
    if(casos.length===0){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="panel"><div class="empty-state">No se encontraron casos con ese dato.</div></div>'; return; }
    var grupos = agruparPorVin_(casos);
    var totalCasos = casos.length;
    var html = '<div class="panel"><div class="panel-head"><h3>'+grupos.length+' vehículo/cliente encontrado(s) · '+totalCasos+' caso(s) en total</h3></div></div>';
    html += grupos.map(function(g, gi){
      var abierto = grupos.length===1; // si hay un solo grupo, lo dejamos ya desplegado
      var ultimo = g.casos[0];
      return '<div class="vin-group">'+
        '<div class="vin-group-head" onclick="toggleVinGroup_('+gi+')">'+
          '<div class="vgh-main">'+
            '<div class="vgh-vin">'+(g.vin ? g.vin : (g.cliente||'Sin VIN'))+'</div>'+
            '<div class="vgh-cliente">'+(g.cliente||'—')+(g.marca?' · '+g.marca+' '+(g.modelo||''):'')+' — último: '+(ultimo.motivo||ultimo.tipoCaso||'—')+'</div>'+
          '</div>'+
          '<span class="vin-group-count">'+g.casos.length+' caso'+(g.casos.length>1?'s':'')+'</span>'+
          '<span class="material-symbols-outlined" id="vgIcon'+gi+'" style="color:var(--text-faint);">'+(abierto?'expand_less':'expand_more')+'</span>'+
        '</div>'+
        '<div class="vin-group-body'+(abierto?'':' hidden')+'" id="vgBody'+gi+'">'+
          g.casos.map(function(c){
            var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
            return '<div class="vin-case-row" onclick="setView(\'detalle\',\''+c.id+'\')">'+
              '<span class="vc-id">'+c.id+(esDefensa?' ⚖️':'')+'</span>'+
              '<span class="pill pill-'+c.estado+'">'+c.estado+'</span>'+
              '<span class="vc-motivo">'+(c.motivo||c.tipoCaso||'—')+'</span>'+
              '<span class="vc-fecha">'+(c.fechaCreacion||'—')+'</span>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>';
    }).join('');
    document.getElementById('resultadoBusqueda').innerHTML = html;
  });
}
function toggleVinGroup_(gi){
  var body = document.getElementById('vgBody'+gi);
  var icon = document.getElementById('vgIcon'+gi);
  var abierto = !body.classList.contains('hidden');
  body.classList.toggle('hidden', abierto);
  icon.textContent = abierto ? 'expand_more' : 'expand_less';
}

function pintarGraficosReportes_(res){
  var c = coloresGrafico_();
  if(document.getElementById('chartResueltos')) dibujarDonut_('chartResueltos', ['Resueltos/cerrados','Abiertos'], [res.resueltos, res.abiertos], [c.ok, c.caso]);
  if(document.getElementById('chartFuente')) dibujarBarras_('chartFuente', res.porFuente);
  if(document.getElementById('chartSector')) dibujarBarras_('chartSector', res.porSector);
  if(document.getElementById('chartMarca')) dibujarBarras_('chartMarca', res.porMarca);
  if(document.getElementById('chartSucursal')) dibujarBarras_('chartSucursal', res.porSucursal);
  if(document.getElementById('chartTipo')) dibujarBarras_('chartTipo', res.porTipoCaso);
  if(res.reclamos && document.getElementById('chartReclamosMarca')) dibujarBarras_('chartReclamosMarca', res.reclamos.porMarca);
}
function panelChart_(canvasId, titulo, lista){
  if(!lista || lista.length===0) return '';
  return '<div class="panel"><div class="panel-head"><h3>'+titulo+'</h3></div><div style="padding:14px 17px;height:'+Math.max(140, lista.length*34)+'px;"><canvas id="'+canvasId+'"></canvas></div></div>';
}
var _chartsGC_ = {};
function coloresGrafico_(){
  var css = getComputedStyle(document.body);
  return {
    caso: css.getPropertyValue('--caso').trim(), grid: css.getPropertyValue('--hairline').trim(),
    texto: css.getPropertyValue('--text-dim').trim(), ok: css.getPropertyValue('--ok').trim()
  };
}
function dibujarBarras_(canvasId, lista){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'bar',
    data: { labels: lista.map(function(x){return x.valor;}), datasets: [{ data: lista.map(function(x){return x.cantidad;}), backgroundColor: c.caso, borderRadius: 5, maxBarThickness: 22 }] },
    options: {
      indexAxis: 'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ beginAtZero:true, ticks:{color:c.texto, precision:0}, grid:{color:c.grid} },
        y:{ ticks:{color:c.texto, font:{size:11}}, grid:{display:false} }
      }
    }
  });
}
function dibujarDonut_(canvasId, labels, datos, colores){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: datos, backgroundColor: colores, borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{color:c.texto, font:{size:11.5}, boxWidth:11, padding:14}}} }
  });
}
// Línea — usada por "Evolución mensual de casos" (Etapa 4).
function dibujarLinea_(canvasId, labels, datos){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'line',
    data: { labels: labels, datasets: [{ data: datos, borderColor: c.caso, backgroundColor: c.caso+'33', fill:true, tension:.35, pointRadius:3, pointBackgroundColor:c.caso }] },
    options: {
      responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{ ticks:{color:c.texto, font:{size:10.5}}, grid:{display:false} }, y:{ beginAtZero:true, ticks:{color:c.texto, precision:0}, grid:{color:c.grid} } }
    }
  });
}
function tablaReporte_(titulo, sub, filasHtml, columnas, vacioMsg){
  return '<div class="panel"><div class="panel-head"><div><h3>'+titulo+'</h3><div style="font-size:11px;color:var(--text-faint);margin-top:2px;">'+sub+'</div></div></div>'+
    (filasHtml ?
      '<table class="tbl"><thead><tr>'+columnas.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+filasHtml+'</tbody></table>' :
      '<div class="empty-state">'+vacioMsg+'</div>')+
  '</div>';
}

function cerrarFormActa_(){
  document.getElementById('panelFormActa').classList.add('hidden');
}
function filtrarCasosParaMinutaBusqueda_(){
  var q = (document.getElementById('minutaBuscarCaso').value||'').trim().toLowerCase();
  var box = document.getElementById('minutaResultadosCasos');
  if(!q){ box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:11.5px;">Escribí para buscar un caso.</div>'; return; }
  var casos = (window._casosCache||[]).filter(function(c){
    var hay = (c.id+' '+(c.cliente||'')+' '+(c.dominio||'')+' '+(c.marca||'')+' '+(c.responsable||'')).toLowerCase();
    return hay.indexOf(q)>-1;
  }).slice(0,30);
  if(!casos.length){ box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:11.5px;">Sin resultados.</div>'; return; }
  box.innerHTML = casos.map(function(c){
    var sel = !!window._minutaSeleccion[c.id];
    return '<div class="caso-pick-item'+(sel?' selected':'')+'" onclick="toggleCasoEnMinuta_(\''+c.id+'\')">'+
      '<input type="checkbox" '+(sel?'checked':'')+' onclick="event.stopPropagation();toggleCasoEnMinuta_(\''+c.id+'\')">'+
      '<span class="cpi-id">'+c.id+'</span><span style="flex:1;">'+(c.cliente||'—')+' · '+(c.marca||'—')+'</span>'+
      '<span class="pill pill-'+c.estado+'" style="font-size:10px;">'+c.estado+'</span>'+
    '</div>';
  }).join('');
}
function toggleCasoEnMinuta_(casoId){
  if(window._minutaSeleccion[casoId]){
    delete window._minutaSeleccion[casoId];
  }else{
    var caso = (window._casosCache||[]).find(function(c){ return c.id===casoId; });
    window._minutaSeleccion[casoId] = {
      caso: caso || {id:casoId}, soloMencionado:false,
      resumen:'', problema:'', analisis:'', decision:'', accion:'',
      responsableCompromiso:'', fechaLimite:'', observaciones:''
    };
  }
  filtrarCasosParaMinutaBusqueda_();
  pintarCasosSeleccionadosMinuta_();
}
function marcarSoloMencionadoMinuta_(casoId, checked){
  if(window._minutaSeleccion[casoId]) window._minutaSeleccion[casoId].soloMencionado = checked;
  pintarCasosSeleccionadosMinuta_();
}
function actualizarCampoCompromisoMinuta_(casoId, campo, valor){

    return '<div class="field full"><label>'+label+'</label><textarea id="'+id+'" style="min-height:42px;" oninput="actualizarCampoCompromisoMinuta_(\''+casoId+'\',\''+campo+'\',this.value)">'+(valor||'')+'</textarea></div>';

  return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+tipo+'" value="'+(valor||'')+'" oninput="actualizarCampoCompromisoMinuta_(\''+casoId+'\',\''+campo+'\',this.value)"></div>';

function imprimirMinuta_(id){
  var render = function(a){
    var html = '<h1>'+a.titulo+'</h1>'+
      '<div class="mp-sub">'+(a.fecha||'')+(a.hora?' · '+a.hora:'')+(a.responsableReunion?' · Responsable: '+a.responsableReunion:'')+'</div>'+
      (a.objetivo?'<div style="margin-bottom:8px;"><b>Objetivo:</b> '+a.objetivo+'</div>':'')+
      (a.asistentes?'<div style="margin-bottom:8px;"><b>Participantes:</b> '+a.asistentes+'</div>':'')+
      (a.temas?'<div style="margin-bottom:8px;"><b>Temas tratados:</b> '+a.temas+'</div>':'')+
      '<h2>Casos tratados</h2>'+
      ((a.compromisos && a.compromisos.length) ? a.compromisos.map(function(co){
        return '<div class="mp-caso">'+
          '<b>'+co.casoId+'</b> — Estado del compromiso: '+co.estadoReal+'<br>'+
          (co.resumen?'<b>Resumen:</b> '+co.resumen+'<br>':'')+
          (co.problema?'<b>Problema:</b> '+co.problema+'<br>':'')+
          (co.analisis?'<b>Análisis:</b> '+co.analisis+'<br>':'')+
          (co.decision?'<b>Decisión:</b> '+co.decision+'<br>':'')+
          (co.accion?'<b>Acción acordada:</b> '+co.accion+'<br>':'')+
          'Responsable: '+(co.responsableCompromiso||'—')+' · Fecha límite: '+(co.fechaLimite||'—')+
          (co.observaciones?'<br>Observaciones: '+co.observaciones:'')+
        '</div>';
      }).join('') : '<div>Ningún caso con compromiso puntual.</div>')+
      (a.proximosPasos?'<h2>Próximos pasos</h2><div>'+a.proximosPasos+'</div>':'');
    document.getElementById('minutaPrintRoot').innerHTML = html;
    document.body.classList.add('print-minuta-mode');
    var limpiar = function(){ document.body.classList.remove('print-minuta-mode'); window.removeEventListener('afterprint', limpiar); };
    window.addEventListener('afterprint', limpiar);
    window.print();
    setTimeout(limpiar, 60000);
  };
  if(window._minutaActualDetalle && String(window._minutaActualDetalle.id)===String(id)){ render(window._minutaActualDetalle); return; }
  gasGet('acta', {id:id}).then(function(res){ if(res.ok) render(res.acta); else showToast(res.error); });
}

function cargarYPintarEquipo_(){
  var s = sesionActual();
  var pass = _passwordSesionActual_();
  if(!pass) return;
  gasPost('listarUsuarios', {actorUsuario:s.usuario, actorPassword:pass}).then(function(res){
    if(!res.ok){ document.getElementById('tablaEquipo').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    pintarTablaEquipo_(res.usuarios||[]);
  });
}
function abrirFormUsuario_(usuarioExistente){
  document.getElementById('panelFormImportar').classList.add('hidden');
  document.getElementById('panelFormUsuario').classList.remove('hidden');
  document.getElementById('formUsuarioTitulo').textContent = usuarioExistente ? 'Editar usuario' : 'Nuevo usuario';
  document.getElementById('equNombre').value = usuarioExistente ? usuarioExistente.nombre : '';
  document.getElementById('equUsuario').value = usuarioExistente ? usuarioExistente.usuario : '';
  document.getElementById('equUsuario').disabled = !!usuarioExistente;
  document.getElementById('equPassword').value = '';
  document.getElementById('equPassword').placeholder = usuarioExistente ? '(dejar vacío para no cambiarla — próximamente)' : '';
  document.getElementById('equRol').value = usuarioExistente ? usuarioExistente.rol : 'sector';
  document.getElementById('equSector').value = usuarioExistente ? (usuarioExistente.sector||'') : '';
  document.getElementById('equEmail').value = usuarioExistente ? (usuarioExistente.email||'') : '';
  window._equipoEditando = usuarioExistente ? usuarioExistente.usuario : null;
}
function cerrarFormUsuario_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
}
function abrirFormImportar_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
  document.getElementById('panelFormImportar').classList.remove('hidden');
  document.getElementById('importarNombres').value = '';
}
function importarUsuariosUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  if(!actorPassword) return;
  var texto = document.getElementById('importarNombres').value.trim();
  if(!texto){ showToast('Pegá al menos un nombre'); return; }
  var lineas = texto.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  gasPost('importarUsuarios', {actorUsuario:s.usuario, actorPassword:actorPassword, nombres:lineas}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    var creados = res.creados||[], omitidos = res.omitidos||[];
    window._usuariosActivosCache = null;
    showToast(creados.length+' usuario(s) importado(s), sin acceso todavía'+(omitidos.length?' — '+omitidos.length+' omitido(s)':''));
    document.getElementById('panelFormImportar').classList.add('hidden');
    renderEquipo();
  });
}
function guardarUsuarioUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  var nombre = document.getElementById('equNombre').value.trim();
  var usuario = document.getElementById('equUsuario').value.trim();
  var rol = document.getElementById('equRol').value;
  var sector = document.getElementById('equSector').value.trim();
  var email = document.getElementById('equEmail').value.trim();
  if(!nombre || !usuario){ showToast('Falta nombre o usuario'); return; }

  if(window._equipoEditando){
    gasPost('editarUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, usuarioObjetivo:window._equipoEditando, nombre:nombre, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      window._usuariosActivosCache = null;
      showToast('Usuario actualizado'); cerrarFormUsuario_(); renderEquipo();
    });
  } else {
    var password = document.getElementById('equPassword').value;
    if(!password || password.length<4){ showToast('La contraseña tiene que tener al menos 4 caracteres'); return; }
    gasPost('crearUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, nombre:nombre, usuario:usuario, password:password, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      window._usuariosActivosCache = null;
      showToast('Usuario creado'); cerrarFormUsuario_(); renderEquipo();
    });
  }
}
function cambiarActivoUsuarioUI_(usuario, activo){
  var s = sesionActual();
  gasPost('desactivarUsuario', {actorUsuario:s.usuario, actorPassword:_passwordSesionActual_(), usuarioObjetivo:usuario, activo:activo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._usuariosActivosCache = null;
    showToast(activo?'Usuario activado':'Usuario desactivado'); renderEquipo();
  });
}
function pintarTablaEquipo_(usuarios){
  var etiquetasRol = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  var filas = usuarios.map(function(u){
    return '<tr style="cursor:default;">'+
      '<td>'+u.nombre+'</td>'+
      '<td class="mono">'+u.usuario+'</td>'+

      '<td>'+(u.sector||'—')+'</td>'+

      '<button class="btn btn-dark btn-sm" style="width:auto;" onclick="toggleCreacionAutomaticaUI_()">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true' ? 'Apagar creación automática' : 'Activar creación automática')+'</button>'+
    '</div></div>';
  }

  document.getElementById('content').innerHTML = html;
}
function tabBtn_(id, label, activa){
  var esActiva = id===activa;
  return '<button class="btn '+(esActiva?'btn-dark':'btn-ghost')+' btn-sm" style="width:auto;'+(esActiva?'border-color:var(--caso);color:var(--caso);':'')+'" onclick="window._configTabActiva=\''+id+'\';pintarConfig_();">'+label+'</button>';
}
function agregarCatalogoItemUI_(nombre){
  var input = document.getElementById('nuevoItem_'+nombre);
  var valor = input.value.trim();
  if(!valor) return;
  gasPost('agregarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    if(!window._catalogosCache[nombre]) window._catalogosCache[nombre]=[];
    window._catalogosCache[nombre].push(valor);
    pintarConfig_();
    showToast('Agregado a '+nombre);
  });
}
function eliminarCatalogoItemUI_(nombre, valor){
  if(!confirm('¿Quitar "'+valor+'" de '+nombre+'?')) return;
  gasPost('eliminarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._catalogosCache[nombre] = window._catalogosCache[nombre].filter(function(v){return v!==valor;});
    pintarConfig_();
    showToast('Quitado de '+nombre);
  });
}
function guardarConfigParamUI_(clave){
  var valor = document.getElementById('conf_'+clave).value;
  gasPost('actualizarConfig', {clave:clave, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache[clave] = valor;
    showToast('Guardado');
  });
}
function toggleCreacionAutomaticaUI_(){
  var actual = String(window._configCache.CREAR_CASOS_AUTOMATICO)==='true';
  var nuevo = !actual;
  var msg = nuevo
    ? '¿Activar la creación automática de casos? A partir de ahora, los eventos van a crear el caso solos, sin pasar por la Bandeja de entrada.'
    : '¿Apagar la creación automática? Los eventos van a volver a esperar confirmación manual en la Bandeja de entrada.';
  if(!confirm(msg)) return;
  gasPost('actualizarConfig', {clave:'CREAR_CASOS_AUTOMATICO', valor:nuevo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache.CREAR_CASOS_AUTOMATICO = nuevo;
    pintarConfig_();
    showToast(nuevo ? 'Creación automática activada' : 'Creación automática apagada');
  });
}

// No registramos Service Worker (mismo criterio que Planning ahora): evita
// versiones viejas cacheadas en el navegador de alguien. Si quedó uno de
// una prueba anterior, lo desinstala una sola vez.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  }).catch(function(){});
}
</script>
</body>
</html>
