<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0D16">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestión de Casos">
<meta name="mobile-web-app-capable" content="yes">
<title>Gestión de Casos · Grupo París</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  /* Paleta oscura — mismos tokens que usa Planning de Entregas (--bg,
     --panel, --panel-2, --hairline, --text...) para que las dos apps
     compartan una sola identidad visual. Modo claro disponible abajo,
     activable con el mismo toggle que tiene Planning. */
  --ink:#0C0D10; --ink-soft:#15171C;
  --bg:#0F131A; --panel:#161B24; --panel-2:#1D2330; --hairline:#2A303D;
  --text:#EAEDF3; --text-dim:#A3ABBD; --text-faint:#7A8296;
  --ok:#3FBF88; --ok-soft:rgba(63,191,136,.16);
  --warn:#E8B23D; --warn-soft:rgba(232,178,61,.16);
  --danger:#E85D5D; --danger-soft:rgba(232,93,93,.16);
  --pending:#7A8296; --pending-soft:rgba(122,130,150,.18);
  --purple:#8B7CF6; --purple-soft:rgba(139,124,246,.16);
  --info:#6D7CF6; --info-soft:rgba(109,124,246,.16);
  --caso:#4C86F0; --caso-soft:rgba(76,134,240,.16); --caso-deep:#8FB4F8; --caso-bright:#5B93F5;
  --accent: var(--caso); --accent-soft: var(--caso-soft);
  --radius-s:9px; --radius-m:14px; --radius-l:22px;
  --shadow-1:0 1px 2px rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.16);
  --shadow-2:0 14px 32px -8px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.3);
  --sidebar-w:196px; --topbar-h:60px;
}
/* MODO CLARO — el diseño original de la app; se activa con el toggle
   de tema (mismo criterio y nombres de función que usa Planning). */
body.light-mode{
  --bg:#FAFAFB; --panel:#FFFFFF; --panel-2:#FAFAFB; --hairline:#E1E3EA;
  --text:#0C0D10; --text-dim:#4E515D; --text-faint:#9DA0AC;
  --ok:#0F9D58; --ok-soft:#E8F7EF;
  --warn:#D97706; --warn-soft:#FDF3E3;
  --danger:#DC2626; --danger-soft:#FDECEC;
  --pending:#9DA0AC; --pending-soft:#F3F4F7;
  --purple:#7C3AED; --purple-soft:#F2ECFE;
  --info:#4338CA; --info-soft:#EEF2FF;
  --caso:#2563EB; --caso-soft:#EFF4FF; --caso-deep:#1D4ED8; --caso-bright:#3B82F6;
  --shadow-1:0 1px 2px rgba(15,17,22,.05), 0 1px 1px rgba(15,17,22,.04);
  --shadow-2:0 14px 32px -8px rgba(15,17,22,.16), 0 4px 10px -4px rgba(15,17,22,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.45; transition:background .18s ease, color .18s ease;}
.mono{font-family:'IBM Plex Mono',monospace;}
.headline{font-family:'Space Grotesk',sans-serif;}
/* Íconos — esta regla es la que activa la tipografía de Material
   Symbols; sin ella, cualquier ícono se ve como texto literal
   (dashboard, inbox, folder_managed...) en vez del glifo. Faltaba en
   el archivo original — por eso el ícono del login se veía como texto. */
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal; font-style:normal; font-size:20px; line-height:1;
  letter-spacing:normal; text-transform:none; display:inline-block;
  width:1em; height:1em; overflow:hidden;
  white-space:nowrap; word-wrap:normal; direction:ltr;
  -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;
  vertical-align:middle;
}
.hidden{display:none !important;}
.view:not(.hidden){animation:viewIn .28s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--caso); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
::selection{background:var(--caso-soft); color:var(--text);}

/* LOGIN — pantalla propia, con estilo fijo (no depende del tema
   claro/oscuro de la app) para que no se rompa la combinación de
   colores según qué tema haya quedado guardado. Mismo criterio visual
   que Planning: fondo oscuro con glow, tarjeta "vidrio esmerilado". */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden;
  background:radial-gradient(900px 620px at 82% 12%, rgba(76,134,240,.35), transparent 60%),
             radial-gradient(650px 500px at 10% 90%, rgba(139,124,246,.18), transparent 60%),
             linear-gradient(160deg, #05060A 0%, #0A0D16 40%, #10141F 75%, #0A0D16 100%);
}
.login-card{position:relative; z-index:2; width:100%; max-width:392px; background:rgba(22,27,36,.6); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:34px 32px 28px; box-shadow:0 30px 70px -16px rgba(0,0,0,.6);}
.login-mark{display:flex; align-items:center; gap:11px; margin-bottom:26px;}
.login-mark .dot{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5B93F5,#1D4ED8);flex-shrink:0; box-shadow:0 6px 16px -4px rgba(37,99,235,.55); display:flex; align-items:center; justify-content:center;}
.login-mark span{font-family:'Space Grotesk',sans-serif; font-weight:800; letter-spacing:-.01em; font-size:19px; display:block; color:#fff;}
.login-mark small{display:block; font-size:10.5px; color:rgba(255,255,255,.5); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; font-weight:650;}
.login-card h1{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin-bottom:5px; color:#fff;}
.login-card p.sub{color:rgba(255,255,255,.55); font-size:12.8px; margin-bottom:24px; line-height:1.5;}
.login-field-gc{margin-bottom:14px; text-align:left;}
.login-field-gc label{display:block; font-size:11.5px; font-weight:650; color:rgba(255,255,255,.6); margin-bottom:6px; letter-spacing:.02em;}
.login-field-gc input{width:100%; padding:11px 13px; border:1px solid rgba(255,255,255,.16); border-radius:12px; font-size:13.5px; font-family:inherit; background:rgba(255,255,255,.06); color:#fff; transition:border-color .15s, background .15s;}
.login-field-gc input::placeholder{color:rgba(255,255,255,.32);}
.login-field-gc input:focus{border-color:#5B93F5; background:rgba(255,255,255,.1); outline:none;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); font-size:13.5px; font-family:inherit; background:var(--panel-2); color:var(--text); transition:border-color .15s, box-shadow .15s;}
.field input::placeholder, .field textarea::placeholder{color:var(--text-faint);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--caso); box-shadow:0 0 0 3px var(--caso-soft); background:var(--panel); outline:none;}
.field textarea{resize:vertical; min-height:80px;}
.btn{border:none; border-radius:var(--radius-s); font-weight:650; font-size:13.5px; padding:11px 16px; transition:transform .14s, box-shadow .18s, filter .15s; display:inline-flex; align-items:center; justify-content:center; gap:7px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg, var(--caso-bright), var(--caso-deep)); color:#fff; width:100%; box-shadow:0 4px 12px -3px rgba(37,99,235,.45);}
.btn-primary:hover{filter:brightness(1.07); box-shadow:0 10px 24px -6px rgba(37,99,235,.4); transform:translateY(-1px);}
.login-submit-gc{width:100%; background:linear-gradient(135deg,#5B93F5,#1D4ED8); color:#fff; border:none; border-radius:12px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 8px 20px -6px rgba(37,99,235,.5); transition:transform .12s,filter .15s;}
.login-submit-gc:hover{filter:brightness(1.08); transform:translateY(-1px);}
.login-submit-gc:active{transform:scale(.98);}
.login-submit-gc:disabled{opacity:.55; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--text-dim); border:1.5px solid var(--hairline);}
.btn-ghost:hover{border-color:var(--caso); color:var(--caso-deep); background:var(--caso-soft);}
.btn-dark{background:linear-gradient(135deg, #24262C, var(--ink)); color:#fff; box-shadow:0 4px 12px -4px rgba(12,13,16,.4);}
.btn-dark:hover{filter:brightness(1.25); transform:translateY(-1px);}
.btn-sm{padding:8px 13px; font-size:12.5px;}
.login-error{background:rgba(232,93,93,.16); color:#ff9a9a; border:1px solid rgba(232,93,93,.3); border-radius:12px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; display:none;}
.login-foot{margin-top:20px; text-align:center; font-size:11px; color:rgba(255,255,255,.4);}

/* SHELL — riel de íconos angosto que se expande al pasar el mouse o al
   fijarlo (mismo patrón e interacción que usa Planning de Entregas), en
   vez del panel ancho fijo de antes. */
#app{display:flex; min-height:100vh;}
.sidebar{position:fixed; left:0; top:0; bottom:0; width:60px; background:linear-gradient(180deg, var(--ink-soft) 0%, var(--ink) 100%); color:#fff; display:flex; flex-direction:column; padding:14px 0 12px; overflow:hidden; box-shadow:4px 0 24px rgba(0,0,0,.18); z-index:65; transition:width .16s ease;}
.sidebar:hover, .sidebar.pinned{width:206px; overflow:visible; box-shadow:6px 0 24px rgba(0,0,0,.4);}
.sidebar-pin{position:absolute; top:13px; right:9px; background:none; border:none; color:#8E92A0; cursor:pointer; padding:3px; border-radius:6px; opacity:0; transition:opacity .12s,color .12s;}
.sidebar-pin .material-symbols-outlined{font-size:15px; display:block;}
.sidebar-pin:hover{color:#fff;}
.sidebar:hover .sidebar-pin, .sidebar.pinned .sidebar-pin{opacity:1;}
.sidebar.pinned .sidebar-pin{color:var(--caso-bright);}
.brand{display:flex; align-items:center; gap:8px; padding:4px 0 16px 15px; white-space:nowrap;}
.brand .dot{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--caso-bright),var(--caso-deep));flex-shrink:0;}
.brand strong{font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:800; letter-spacing:-.015em; display:block;}
.brand small{display:block; font-size:8.7px; color:#8E92A0; letter-spacing:.08em; text-transform:uppercase;}
.nav-label,.user-chip .info{opacity:0; max-width:0; overflow:hidden; transition:opacity .08s ease, max-width .16s ease; white-space:nowrap;}
.sidebar:hover .nav-label, .sidebar.pinned .nav-label,
.sidebar:hover .user-chip .info, .sidebar.pinned .user-chip .info{opacity:1; max-width:150px;}
.nav-item{display:flex; align-items:center; gap:11px; padding:8px 18px; border-radius:0; color:#B8BAC5; font-size:12.6px; font-weight:550; margin-bottom:1px; transition:background .16s,color .16s; width:100%; text-align:left; background:none; border:none; position:relative;}
.sidebar:not(:hover):not(.pinned):not(.open) .nav-item{justify-content:center; padding-left:0; padding-right:0;}
.nav-item .material-symbols-outlined{font-size:17px; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--caso-soft); color:var(--caso-bright);}
.nav-item .badge-count{margin-left:auto; background:rgba(255,255,255,.12); color:#fff; font-size:9.5px; padding:1px 6px; border-radius:20px; font-weight:650;}
.nav-item.active .badge-count{background:rgba(255,255,255,.2);}
.sidebar-scroll{overflow-y:auto; overflow-x:hidden; flex:1; min-height:0; padding:0 6px;}
.sidebar-scroll::-webkit-scrollbar{width:4px;}
.sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:10px;}
.sidebar-foot{margin-top:auto; border-top:1px solid rgba(255,255,255,.08); padding-top:9px;}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px 13px; cursor:pointer;}
.sidebar:not(:hover):not(.pinned):not(.open) .user-chip{justify-content:center;}
.user-chip:hover{background:rgba(255,255,255,.06);}
.avatar{width:27px; height:27px; border-radius:50%; background:var(--caso-soft); color:var(--caso-bright); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex-shrink:0;}
.user-chip .info{display:flex; flex-direction:column; min-width:0;}
.user-chip .name{font-size:11.8px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-chip .role{font-size:9.6px; color:#8E92A0;}
.user-menu-pop{display:none; flex-direction:column; gap:1px; padding:6px; position:absolute; bottom:calc(100% + 4px); left:6px; width:190px; background:#20263a; border:1px solid rgba(255,255,255,.1); border-radius:10px; box-shadow:0 -8px 24px rgba(0,0,0,.5); z-index:70;}
.user-menu-pop.show{display:flex;}
.user-menu-pop button{display:flex; align-items:center; gap:9px; background:none; border:none; color:#B8BAC5; font-size:12px; font-weight:600; padding:8px 10px; border-radius:7px; cursor:pointer; text-align:left; font-family:inherit; white-space:nowrap;}
.user-menu-pop button:hover{background:rgba(255,255,255,.08); color:#fff;}
.user-menu-pop button .material-symbols-outlined{font-size:16px;}
.user-menu-pop button.danger{color:#F09090;}
.user-menu-pop button.danger:hover{background:rgba(232,93,93,.16);}
.sidebar-overlay{display:none;}

.main{flex:1; min-width:0; margin-left:60px; transition:margin-left .16s ease;}
.sidebar:hover ~ .main, .sidebar.pinned ~ .main{margin-left:206px;}
.topbar{height:var(--topbar-h); border-bottom:1px solid var(--hairline); background:rgba(255,255,255,.86); backdrop-filter:blur(10px); display:flex; align-items:center; padding:0 22px; gap:14px; position:sticky; top:0; z-index:20; box-shadow:0 1px 0 rgba(15,17,22,.03);}
.topbar h1{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--text);}
.topbar .sub{font-size:11.5px; color:var(--text-faint); font-weight:600;}
.menu-toggle{display:none; background:none; border:none; color:var(--text); padding:4px; margin-right:2px; border-radius:8px; cursor:pointer;}
.menu-toggle .material-symbols-outlined{font-size:22px;}
.topbar-search{position:relative; flex:1; max-width:420px;}
.topbar-search .material-symbols-outlined{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-faint); pointer-events:none;}
.topbar-search input{width:100%; padding:8px 12px 8px 34px; border:1.5px solid var(--hairline); border-radius:20px; font-size:12.6px; background:var(--panel-2); color:var(--text); transition:border-color .15s, box-shadow .15s, background .15s;}
.topbar-search input:focus{border-color:var(--caso); box-shadow:0 0 0 3px var(--caso-soft); background:var(--panel); outline:none;}
.live-dot{width:6px; height:6px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; opacity:0; transition:opacity .2s;}
.live-dot.show{opacity:1; animation:pulseDot 1s ease infinite;}
@keyframes pulseDot{0%,100%{opacity:.4;} 50%{opacity:1;}}
.content{padding:20px 24px 60px; max-width:1320px;}

/* RESPONSIVE — en pantallas chicas el riel se esconde del todo y se
   convierte en panel deslizable disparado por el botón de menú (mismo
   criterio que Planning: sidebar oculta + acceso por ícono, ahí ellos
   además suman un bottom-nav que acá no hizo falta por la cantidad de
   secciones). */
@media (max-width:900px){
  .sidebar{width:0; transform:translateX(-100%);}
  .sidebar.open{width:230px; transform:translateX(0); box-shadow:12px 0 40px rgba(0,0,0,.35); overflow:visible;}
  .sidebar.open .nav-label, .sidebar.open .user-chip .info{opacity:1; max-width:160px;}
  .sidebar.open .nav-item{justify-content:flex-start; padding-left:18px; padding-right:18px;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(12,13,16,.45); z-index:64;}
  .sidebar-overlay.show{display:block;}
  .sidebar-pin{display:none;}
  .menu-toggle{display:inline-flex; align-items:center; justify-content:center;}
  .main, .sidebar:hover ~ .main, .sidebar.pinned ~ .main{margin-left:0;}
  .topbar{padding:0 14px; gap:10px;}
  .topbar-search{max-width:none;}
  .content{padding:14px 12px 50px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr) !important;}
  .filter-bar{gap:6px;}
  .filter-bar select, .filter-bar input{flex:1 1 46%; font-size:12.5px;}
  .filter-bar .fdrop{flex:1 1 46%;}
  .filter-bar .fdrop-btn{width:100%; justify-content:space-between;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.tbl{min-width:640px;}
  .info-strip{gap:12px 18px;}
  .cal-day{min-height:64px; padding:4px 3px 3px;}
  .cal-case-chip{font-size:9px; padding:2px 4px;}
  .cal-toggle{margin-left:0;}
  .cal-mes-label{font-size:14px; min-width:0;}
}
@media (max-width:520px){
  .kpi-grid{grid-template-columns:1fr 1fr !important; gap:9px;}
  .topbar h1{font-size:13.5px;}
  .topbar .sub{display:none;}
}
.page-title{font-size:22px; font-weight:800; letter-spacing:-.02em; color:var(--text);}
.page-sub{font-size:13px; color:var(--text-faint); margin-top:3px;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:14px; margin-bottom:22px;}
.kpi-card{position:relative; background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:16px 18px 17px; box-shadow:var(--shadow-1); overflow:hidden; transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s;}
.kpi-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:transparent;}
.kpi-topbar{position:absolute; top:0; left:0; right:0; height:3px;}
.kpi-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:11px;}
.kpi-icon .material-symbols-outlined{font-size:17px;}
.kpi-num{font-family:'Space Grotesk',sans-serif; font-size:27px; font-weight:800; letter-spacing:-.02em;}
.kpi-label{font-size:11.6px; color:var(--text-faint); font-weight:600; margin-top:3px;}

.panel{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); box-shadow:var(--shadow-1); margin-bottom:16px; overflow:hidden;}
.panel-head{padding:15px 18px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:700; color:var(--text); letter-spacing:-.005em;}
.panel-body{padding:16px 18px;}

.chip-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:9px;}
.chip-row .clabel{font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-right:2px;}
.filter-chip{padding:5px 12px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-dim); font-size:11.5px; font-weight:650; cursor:pointer; white-space:nowrap; transition:border-color .12s,color .12s,background .12s;}
.filter-chip:hover{border-color:var(--caso); color:var(--text);}
.filter-chip.active{background:var(--caso-soft); border-color:var(--caso); color:var(--caso-deep);}
.filter-bar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; row-gap:8px;}
/* Vistas rápidas (Etapa 3) — fila de chips arriba de la tabla, mismo
   lenguaje visual que .cal-toggle pero libre (no exclusivo), porque un
   caso puede entrar en más de una vista a la vez. */
.quick-views{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
.qv-chip{padding:6px 13px; border-radius:20px; border:1.5px solid var(--hairline); background:var(--panel-2); color:var(--text-dim); font-size:11.5px; font-weight:650; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .14s,border-color .14s,color .14s;}
.qv-chip:hover{border-color:var(--caso);}
.qv-chip.active{background:var(--caso); border-color:var(--caso); color:#fff;}
.qv-chip .qv-n{opacity:.75; font-weight:700; margin-left:3px;}
.saved-views-wrap{position:relative; margin-left:auto; display:flex; gap:6px;}
.saved-views-menu{position:absolute; top:calc(100% + 6px); right:0; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; box-shadow:var(--shadow-2); min-width:210px; z-index:30; padding:6px; display:none;}
.saved-views-menu.open{display:block;}
.saved-views-menu .sv-item{display:flex; align-items:center; gap:6px; padding:7px 9px; border-radius:8px; font-size:12px; cursor:pointer;}
.saved-views-menu .sv-item:hover{background:var(--panel-2);}
.saved-views-menu .sv-item span.sv-name{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.saved-views-menu .sv-item button{background:none; border:none; color:var(--text-faint); padding:2px;}
.saved-views-menu .sv-item button:hover{color:var(--danger);}
.saved-views-menu .sv-empty{padding:8px 9px; font-size:11.5px; color:var(--text-faint);}
.filter-bar select, .filter-bar input{padding:6px 9px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); font-size:11.5px; background:var(--panel); color:var(--text); height:30px;}
.filter-bar input[type=date]{color:var(--text-dim);}
.filter-bar input::placeholder{color:var(--text-faint);}
.filter-bar .flabel{font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-right:-4px;}
.filter-bar .fclear{margin-left:auto; font-size:11px; color:var(--caso); font-weight:650; background:none; border:none; cursor:pointer; padding:6px 4px; white-space:nowrap;}
/* Filtro tipo dropdown compacto (Marca / Sucursal / Fuente) — un solo
   botón chiquito que abre una lista, en vez de una fila de chips, para
   que todos los filtros entren en un solo renglón sin scrollear. */
.fdrop{position:relative; display:inline-block;}
.fdrop-btn{padding:6px 10px; height:30px; border-radius:var(--radius-s); border:1.5px solid var(--hairline); background:var(--panel); color:var(--text-dim); font-size:11.5px; font-weight:650; cursor:pointer; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; font-family:inherit;}
.fdrop-btn:hover{border-color:var(--caso);}
.fdrop-btn.on{background:var(--caso-soft); border-color:var(--caso); color:var(--caso-deep);}
.fdrop-btn .material-symbols-outlined{font-size:15px;}
.fdrop-menu{display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:170px; max-height:260px; overflow-y:auto; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; box-shadow:var(--shadow-2); z-index:45; padding:4px;}
.fdrop-menu.show{display:block;}
.fdrop-menu button{display:block; width:100%; text-align:left; padding:6.5px 9px; border-radius:7px; border:none; background:none; color:var(--text-dim); font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap;}
.fdrop-menu button:hover{background:var(--panel-2); color:var(--text);}
.fdrop-menu button.sel{color:var(--caso-deep); font-weight:700; background:var(--caso-soft);}
.table-wrap{overflow-x:auto;}
.vin-group{border:1px solid var(--hairline); border-radius:var(--radius-m); margin-bottom:14px; overflow:hidden; background:var(--panel);}
.vin-group-head{display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--panel-2); cursor:pointer;}
.vin-group-head:hover{background:var(--caso-soft);}
.vin-group-head .vgh-main{flex:1; min-width:0;}
.vin-group-head .vgh-vin{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:var(--caso-deep);}
.vin-group-head .vgh-cliente{font-size:12.5px; color:var(--text-dim); margin-top:1px;}
.vin-group-count{background:var(--caso-soft); color:var(--caso-deep); font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; flex-shrink:0;}
.vin-group-body{border-top:1px solid var(--hairline);}
.vin-case-row{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--hairline); cursor:pointer;}
.vin-case-row:last-child{border-bottom:none;}
.vin-case-row:hover{background:var(--panel-2);}
.vin-case-row .vc-id{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--caso); font-size:12px; width:88px; flex-shrink:0;}
.vin-case-row .vc-motivo{flex:1; min-width:0; font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.vin-case-row .vc-fecha{font-size:11px; color:var(--text-faint); flex-shrink:0; white-space:nowrap;}
.updating-pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-faint); font-weight:650; margin-bottom:10px; opacity:0; transition:opacity .2s;}
.updating-pill.show{opacity:1;}
.updating-pill .spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--hairline);border-top-color:var(--caso);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* CALENDARIO — vista mensual estilo TaskTrak: casos como chips de color
   por prioridad, dentro de cada día. */
.cal-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.cal-nav-btn{width:32px; height:32px; border-radius:9px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.cal-nav-btn:hover{border-color:var(--caso); color:var(--caso);}
.cal-mes-label{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:800; text-transform:capitalize; min-width:170px;}
.cal-today-btn{padding:7px 13px; border-radius:8px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-dim); font-size:12px; font-weight:650; cursor:pointer;}
.cal-today-btn:hover{border-color:var(--caso); color:var(--caso);}
.cal-toggle{display:flex; gap:3px; background:var(--panel-2); border:1px solid var(--hairline); border-radius:9px; padding:3px; margin-left:auto;}
.cal-toggle button{padding:6px 12px; border-radius:6px; border:none; background:none; color:var(--text-dim); font-size:11.5px; font-weight:650; cursor:pointer; font-family:inherit;}
.cal-toggle button.active{background:var(--caso); color:#fff;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--hairline); border-radius:var(--radius-m); overflow:hidden; background:var(--hairline); gap:1px;}
.cal-weekday{background:var(--panel-2); padding:8px 0; text-align:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);}
.cal-day{background:var(--panel); min-height:104px; padding:6px 6px 4px; display:flex; flex-direction:column; gap:3px;}
.cal-day.otro-mes{background:var(--panel-2); opacity:.5;}
.cal-day .cal-daynum{font-size:11.5px; font-weight:700; color:var(--text-dim); margin-bottom:2px;}
.cal-day.hoy .cal-daynum{background:var(--caso); color:#fff; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.cal-case-chip{font-size:10.3px; padding:2.5px 6px; border-radius:6px; background:var(--caso-soft); color:var(--caso-deep); border-left:2.5px solid var(--caso); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
.cal-case-chip:hover{filter:brightness(.97);}
.cal-case-chip.prio-Alta{background:var(--danger-soft); color:var(--danger); border-left-color:var(--danger);}
.cal-case-chip.prio-Media{background:var(--warn-soft); color:var(--warn); border-left-color:var(--warn);}
.cal-case-chip.prio-Baja{background:var(--pending-soft); color:var(--text-dim); border-left-color:var(--text-faint);}
.cal-mas{font-size:10px; color:var(--caso); font-weight:700; cursor:pointer; padding:1px 4px;}
.cal-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:11px; color:var(--text-dim);}
.cal-legend span{display:inline-flex; align-items:center; gap:5px;}
.cal-legend i{width:9px; height:9px; border-radius:3px; display:inline-block;}

table.tbl{width:100%; border-collapse:collapse; font-size:12.4px; background:var(--panel);}
table.tbl th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:11px 15px; background:var(--panel-2); border-bottom:1px solid var(--hairline); font-weight:700;}
table.tbl td{padding:11px 15px; border-bottom:1px solid var(--hairline); color:var(--text-dim);}
table.tbl tr{cursor:pointer;}
table.tbl tr:hover td{background:var(--panel-2);}

/* PILLS — mismos colores que el prototipo (pill-new/pending/progress/resolved) */
.pill{display:inline-flex; align-items:center; gap:5px; padding:4.5px 11px; border-radius:20px; font-size:11px; font-weight:650; letter-spacing:-.005em;}
.pill::before{content:""; width:6px; height:6px; border-radius:50%;}
.pill-nuevo{background:var(--caso-soft); color:var(--caso-deep);} .pill-nuevo::before{background:var(--caso);}
.pill-analisis{background:var(--info-soft); color:var(--info);} .pill-analisis::before{background:var(--info);}
.pill-esperando{background:var(--warn-soft); color:var(--warn);} .pill-esperando::before{background:var(--warn);}
.pill-derivado{background:var(--purple-soft); color:var(--purple);} .pill-derivado::before{background:var(--purple);}
.pill-resuelto{background:var(--ok-soft); color:var(--ok);} .pill-resuelto::before{background:var(--ok);}
.pill-cerrado{background:var(--pending-soft); color:var(--text-dim);} .pill-cerrado::before{background:var(--text-faint);}
.prio{font-size:10.6px; font-weight:700; padding:3px 9px; border-radius:6px;}
.prio-Alta{background:var(--danger-soft); color:var(--danger);}
.prio-Media{background:var(--warn-soft); color:var(--warn);}
.prio-Baja{background:var(--pending-soft); color:var(--text-dim);}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:12.5px;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:12.3px; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.3); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* Detalle de caso */
.detail-header{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-l); padding:20px 22px; margin-bottom:14px; box-shadow:var(--shadow-1);}
.dh-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
.dh-id{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-faint); font-weight:650;}
.dh-title{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:800; letter-spacing:-.01em; margin-top:2px; color:var(--text);}
.info-strip{display:flex; gap:22px; flex-wrap:wrap; border-top:1px solid var(--hairline); padding-top:12px;}
.info-item{font-size:12.2px;}
.info-item span{display:block; color:var(--text-faint); font-size:10.3px; text-transform:uppercase; letter-spacing:.05em; font-weight:650; margin-bottom:3px;}
.info-item b{font-size:12.6px; color:var(--text); font-weight:650;}
.action-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.action-row select{background:var(--panel-2); color:var(--text); border:1.5px solid var(--hairline);}

.detail-grid{display:grid; grid-template-columns:1fr 300px; gap:16px;}
@media(max-width:900px){ .detail-grid{grid-template-columns:1fr;} }

.timeline{padding:14px 18px 14px 30px; position:relative;}
.timeline::before{content:""; position:absolute; left:26px; top:18px; bottom:14px; width:2px; background:var(--hairline);}
.t-item{display:grid; grid-template-columns:16px 96px 1fr; gap:12px; padding:9px 0; align-items:start; position:relative;}
.t-dot{width:11px; height:11px; border-radius:50%; background:var(--panel); border:2.2px solid var(--caso); margin-top:2px; z-index:1;}
.t-dot.sistema{border-color:var(--text-faint);}
.t-dot.comentario{background:var(--caso); border-color:var(--caso);}
.t-dot.cambio_estado{background:var(--warn); border-color:var(--warn);}
.t-dot.asignacion{background:var(--purple); border-color:var(--purple);}
.t-dot.cambio_prioridad{background:var(--danger); border-color:var(--danger);}
.t-when{font-size:10.5px; color:var(--text-faint); font-weight:600; padding-top:1px;}
.t-what{font-size:12.4px; font-weight:600; color:var(--text);}
.t-who{font-size:11.2px; color:var(--text-faint); margin-top:1px;}

.side-block{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:15px 17px; margin-bottom:12px; box-shadow:var(--shadow-1);}
.side-block h4{font-size:11.6px; font-weight:700; margin-bottom:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);}
.comment-box textarea{width:100%; min-height:56px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); padding:9px 11px; font-size:12.2px; font-family:inherit; resize:vertical; background:var(--panel-2); color:var(--text);}
.checkbox-row{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:11.5px; color:var(--text-dim);}

.alert-box{display:flex; gap:11px; align-items:flex-start; background:var(--caso-soft); border:1.5px solid var(--caso); border-radius:var(--radius-m); padding:13px 15px; margin-bottom:18px; font-size:11.8px; color:var(--caso-deep);}
.alert-box.purple{background:var(--purple-soft); border-color:var(--purple); color:var(--purple);}
.alert-box a{color:inherit;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:15px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:700px){ .form-grid{grid-template-columns:1fr;} }

.overlay{position:fixed; inset:0; background:rgba(17,17,17,.55); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .18s; z-index:70;}
.overlay.show{opacity:1; pointer-events:auto;}
.modal{position:fixed; top:50%; left:50%; transform:translateY(10px) translate(-50%,-50%) scale(.98); width:min(600px,92vw); max-height:88vh; overflow-y:auto; background:#fff; border-radius:var(--radius-l); box-shadow:0 30px 80px rgba(0,0,0,.35); z-index:76; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;}
.modal.show{opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 4px;}
.modal-head h3{font-size:16px; font-weight:800; letter-spacing:-.01em; color:var(--text);}
.modal-head .close{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:var(--panel-2); border:none; color:var(--text-faint); font-size:14px; cursor:pointer;}
.modal-head .close:hover{color:var(--text);}
.modal-head .sub{font-size:12.3px; color:var(--text-faint); margin-top:4px;}
.modal-body{padding:16px 22px 22px;}
.modal.modal-wide{width:min(760px,95vw);}

@media print{ .sidebar,.topbar,.action-row,.comment-box{display:none !important;} }

/* Minutas de reunión / Compromisos — Etapa 5 */
.compromiso-badge{display:inline-flex; align-items:center; gap:5px; padding:3.5px 11px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
.compromiso-badge.pendiente{background:var(--pending-soft); color:var(--text-dim);}
.compromiso-badge.cumplido{background:var(--ok-soft); color:var(--ok);}
.compromiso-badge.vencido{background:var(--danger-soft); color:var(--danger);}
.caso-pick-box{border:1.5px solid var(--hairline); border-radius:var(--radius-m); max-height:240px; overflow-y:auto; margin-top:8px; background:var(--panel-2);}
.caso-pick-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--hairline); font-size:12px; cursor:pointer;}
.caso-pick-item:last-child{border-bottom:none;}
.caso-pick-item:hover{background:var(--panel);}
.caso-pick-item.selected{background:var(--caso-soft);}
.caso-pick-item .cpi-id{font-family:var(--mono,monospace); color:var(--caso); font-weight:700; min-width:70px;}
.compromiso-card{border:1.5px solid var(--hairline); border-radius:var(--radius-m); padding:14px; margin-top:10px; background:var(--panel-2);}
.compromiso-card .cc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;}
.compromiso-card .cc-head .cc-caso{font-weight:800; color:var(--caso); font-size:12.5px;}
.minuta-card{border-bottom:1px solid var(--hairline); padding:14px 0;}
.minuta-card:last-child{border-bottom:none;}
#minutaPrintRoot{display:none;}
@media print{
  body.print-minuta-mode > *:not(#minutaPrintRoot){display:none !important;}
  body.print-minuta-mode #minutaPrintRoot{display:block !important; position:static; padding:28px; color:#000; background:#fff; max-width:100%;}
  #minutaPrintRoot h1{font-size:19px; margin-bottom:2px;}
  #minutaPrintRoot h2{font-size:14px; margin:18px 0 6px;}
  #minutaPrintRoot .mp-sub{font-size:11.5px; color:#444; margin-bottom:14px;}
  #minutaPrintRoot .mp-caso{border:1px solid #ccc; border-radius:8px; padding:10px 12px; margin-bottom:10px; page-break-inside:avoid;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-mark"><div class="dot"><span class="material-symbols-outlined" style="color:#fff;font-size:20px;">folder_managed</span></div><div><span>Gestión de Casos</span><small>Grupo París · Calidad</small></div></div>
    <h1>Ingresar</h1>
    <p class="sub">Accedé con tu usuario del equipo de Calidad.</p>
    <div class="login-error" id="loginError"></div>
    <div class="login-field-gc"><label>Usuario</label><input id="loginUsuario" type="text" placeholder="tu.usuario" onkeydown="if(event.key==='Enter')intentarLogin()"></div>
    <div class="login-field-gc"><label>Contraseña</label><input id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')intentarLogin()"></div>
    <button class="login-submit-gc" onclick="intentarLogin()" id="btnLogin">Ingresar</button>
    <div class="login-foot">Sistema interno — Grupo París</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar_(false)"></div>
  <div class="sidebar" id="sidebar">
    <button class="sidebar-pin" onclick="toggleSidebarPin_()" title="Fijar menú expandido" id="sidebarPinBtn"><span class="material-symbols-outlined">push_pin</span></button>
    <div class="brand"><div class="dot"></div><div><strong class="nav-label">Gestión de Casos</strong><small class="nav-label">Grupo París</small></div></div>
    <div class="sidebar-scroll">
    <button class="nav-item active" id="navDashboard" onclick="setView('dashboard')" title="Dashboard"><span class="material-symbols-outlined">dashboard</span><span class="nav-label">Dashboard</span></button>
    <button class="nav-item" id="navBandeja" onclick="setView('bandeja')" title="Bandeja de entrada"><span class="material-symbols-outlined">inbox</span><span class="nav-label">Bandeja de entrada</span><span class="badge-count hidden" id="badgeBandeja">0</span></button>
    <button class="nav-item" id="navCasos" onclick="setView('casos')" title="Casos"><span class="material-symbols-outlined">folder_open</span><span class="nav-label">Casos</span></button>
    <button class="nav-item" id="navCalendario" onclick="setView('calendario')" title="Calendario"><span class="material-symbols-outlined">calendar_month</span><span class="nav-label">Calendario</span></button>
    <button class="nav-item" id="navReportar" onclick="setView('reportar')" title="Reportar un caso"><span class="material-symbols-outlined">add_circle</span><span class="nav-label">Reportar un caso</span></button>
    <button class="nav-item" id="navFormularioPublico" onclick="copiarLinkFormularioPublico_()" title="Copiar el link del formulario público para compartir por WhatsApp"><span class="material-symbols-outlined">share</span><span class="nav-label">Formulario de reclamos</span></button>
    <button class="nav-item" id="navReportes" onclick="setView('reportes')" title="Reportes"><span class="material-symbols-outlined">bar_chart</span><span class="nav-label">Reportes</span></button>
    <button class="nav-item" id="navDefensa" onclick="setView('defensa')" title="Defensa del Consumidor"><span class="material-symbols-outlined">balance</span><span class="nav-label">Defensa del Consumidor</span></button>
    <button class="nav-item" id="navActas" onclick="setView('actas')" title="Minutas de reunión"><span class="material-symbols-outlined">description</span><span class="nav-label">Minutas de reunión</span></button>
    <button class="nav-item" id="navEquipo" onclick="setView('equipo')" title="Equipo"><span class="material-symbols-outlined">group</span><span class="nav-label">Equipo</span></button>
    <button class="nav-item" id="navConfig" onclick="setView('config')" title="Configuración"><span class="material-symbols-outlined">settings</span><span class="nav-label">Configuración</span></button>
    </div>
    <div class="sidebar-foot" style="position:relative;">
      <div class="user-menu-pop" id="userMenuPop">
        <button onclick="toggleTheme()" id="themeToggleBtn"><span class="material-symbols-outlined">dark_mode</span><span>Modo claro</span></button>
        <button onclick="cerrarSesion()" class="danger"><span class="material-symbols-outlined">logout</span><span>Cerrar sesión</span></button>
      </div>
      <div class="user-chip" onclick="toggleUserMenu_(event)" title="Cuenta">
        <div class="avatar" id="userAvatar">—</div>
        <div class="info"><div class="name" id="userNombre">—</div><div class="role" id="userRol">—</div></div>
      </div>
    </div>
  </div>

  <div class="main">

      <div class="topbar-search">
        <span class="material-symbols-outlined">search</span>

</div>

</div>

<script>
// ============================================================
// CONEXIÓN CON EL BACKEND — mismo patrón que Planning de Entregas:
// la URL de Apps Script se lee de una variable de entorno de Vercel
// (VITE_API_URL) a través de /api/config, nunca se pide ni se guarda
// hardcodeada acá. Ver api/config.js.
// ============================================================
var API_URL = null;

function cargarConfigBackend(){
  return fetch('/api/config').then(function(r){
    if(!r.ok) throw new Error('config no disponible');
    return r.json();
  }).then(function(cfg){
    if(!cfg || !cfg.apiUrl) throw new Error('API_URL no configurada');
    API_URL = cfg.apiUrl;
    return API_URL;
  });
}
function gasGet(action, params){
  params = params || {};
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function(k){ if(params[k]!==undefined && params[k]!==null) url += '&'+k+'='+encodeURIComponent(params[k]); });
  return fetch(url).then(function(r){ return r.json(); });
}
function gasPost(action, params){
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:action, params:params||{}})
  }).then(function(r){ return r.json(); });
}

// ============================================================
// LOGOS DE MARCA — mismos archivos que usa Planning de Entregas
// (assets/logos/logo-<marca>.png). Si el archivo no está subido en ese
// path, el <img> se oculta solo y queda el texto de la marca sin ícono.
// ============================================================
var MARCA_LOGO_SLUG_ = {
  'Chevrolet':'chevrolet', 'Peugeot':'peugeot', 'Citroën':'citroen', 'Citroen':'citroen',
  'DFSK':'dfsk', 'Honda':'honda', 'Usados':'usados', 'Paris Usados':'usados'
};
function logoMarcaHtml_(marca, size){
  size = size || 16;
  var slug = MARCA_LOGO_SLUG_[marca];
  if(!slug) return '';
  return '<img src="/assets/logos/logo-'+slug+'.png" alt="" style="width:'+size+'px;height:'+size+'px;object-fit:contain;border-radius:4px;background:#fff;flex-shrink:0;vertical-align:middle;" onerror="this.style.display=\'none\'">';
}
function marcaConLogo_(marca, size){
  if(!marca) return '—';
  var logo = logoMarcaHtml_(marca, size);
  return '<span style="display:inline-flex;align-items:center;gap:6px;">'+logo+'<span>'+marca+'</span></span>';
}

// ============================================================
// SESIÓN
// ============================================================
function sesionActual(){
  try{ return JSON.parse(localStorage.getItem('gc_sesion')||'null'); }catch(e){ return null; }
}
function guardarSesion(s){ localStorage.setItem('gc_sesion', JSON.stringify(s)); }
function cerrarSesion(){ localStorage.removeItem('gc_sesion'); location.reload(); }

// ============================================================
// TEMA (oscuro/claro) — mismo criterio y nombres que usa Planning de
// Entregas, para que el toggle se sienta igual en las dos apps.
// ============================================================
function aplicarTema(modo){
  document.body.classList.toggle('light-mode', modo==='claro');
  var btn = document.getElementById('themeToggleBtn');
  if(btn) btn.innerHTML = '<span class="material-symbols-outlined">'+(modo==='claro'?'dark_mode':'light_mode')+'</span><span>'+(modo==='claro'?'Modo oscuro':'Modo claro')+'</span>';
  localStorage.setItem('gc_tema', modo);
  // Los gráficos de Chart.js toman el color al dibujarse — si cambiamos
  // de tema con uno ya pintado en pantalla, lo volvemos a dibujar para
  // que no quede con los colores del tema anterior.
  if(window._vistaActual==='dashboard'){ var c=leerCache_('reporteDashboard'); if(c) dibujarGraficosDashboard_(c); }
  if(window._vistaActual==='reportes' && window._reporteCache) pintarGraficosReportes_(window._reporteCache);
}
function toggleTheme(){
  var actual = localStorage.getItem('gc_tema')==='claro' ? 'claro' : 'oscuro';
  aplicarTema(actual==='claro' ? 'oscuro' : 'claro');
}
function toggleUserMenu_(ev){
  ev.stopPropagation();
  document.getElementById('userMenuPop').classList.toggle('show');
}
document.addEventListener('click', function(ev){
  var pop = document.getElementById('userMenuPop');
  if(pop && pop.classList.contains('show') && !pop.contains(ev.target)) pop.classList.remove('show');
});
// Tema por defecto: oscuro (igual que Planning) salvo que ya haya una
// preferencia guardada — se aplica apenas carga la página, antes del login.
aplicarTema(localStorage.getItem('gc_tema')==='claro' ? 'claro' : 'oscuro');
function _passwordSesionActual_(){
  var s = sesionActual();
  if(s && s.password) return s.password;
  showToast('Cerrá sesión y volvé a entrar una vez para poder usar Equipo.');
  return null;
}

function intentarLogin(){
  var usuario = document.getElementById('loginUsuario').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('btnLogin');
  errEl.style.display = 'none';
  if(!usuario || !password){ errEl.textContent='Completá usuario y contraseña.'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  cargarConfigBackend().then(function(){
    return gasPost('login', {usuario:usuario, password:password});
  }).then(function(res){
    btn.disabled = false; btn.textContent = 'Ingresar';
    if(!res.ok){ errEl.textContent = res.error||'No se pudo ingresar.'; errEl.style.display='block'; return; }
    // Guardamos la contraseña junto con la sesión (mismo criterio que ya usa
    // Planning) porque las acciones de Equipo (crear/editar/desactivar
    // usuarios) requieren re-confirmar credenciales de Calidad en cada
    // llamada al backend, y no queremos pedírsela de nuevo a cada rato.
    res.password = password;
    guardarSesion(res);
    iniciarApp();
  }).catch(function(err){
    btn.disabled = false; btn.textContent = 'Ingresar';
    errEl.textContent = 'No se pudo conectar con el backend. ('+err.message+')';
    errEl.style.display = 'block';
  });
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ============================================================
// ARRANQUE
// ============================================================
window.addEventListener('DOMContentLoaded', function(){
  var s = sesionActual();
  if(s){ iniciarApp(); }
});

function iniciarApp(){
  var s = sesionActual();
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  restaurarPinSidebar_();
  document.getElementById('userNombre').textContent = s.nombre;
  document.getElementById('userRol').textContent = etiquetaRol_(s.rol);
  document.getElementById('userAvatar').textContent = (s.nombre||'?').charAt(0).toUpperCase();
  document.getElementById('navEquipo').style.display = (s.rol==='calidad') ? '' : 'none';
  document.getElementById('navConfig').style.display = (s.rol==='calidad') ? '' : 'none';
  cargarConfigBackend().then(function(){
    setView('dashboard'); // renderDashboard ya actualiza el contador de la Bandeja con el mismo pedido — no hace falta pedirlo dos veces.
  }).catch(function(err){
    document.getElementById('content').innerHTML = '<div class="empty-state">No se pudo conectar con el backend.<br>'+err.message+'</div>';
  });
}
function etiquetaRol_(r){
  var mapa = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  return mapa[r] || r;
}

// ============================================================
// SIDEBAR MÓVIL + BÚSQUEDA GLOBAL (arriba de todo, en el topbar)
// ============================================================
function toggleSidebar_(force){
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebarOverlay');
  var open = (force!==undefined) ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}
// Fijar el menú expandido (igual que en Planning) — se guarda la
// preferencia para que quede así entre sesiones.
function toggleSidebarPin_(){
  var sb = document.getElementById('sidebar');
  var pinned = !sb.classList.contains('pinned');
  sb.classList.toggle('pinned', pinned);
  try{ localStorage.setItem('gc_sidebar_pinned', pinned?'1':'0'); }catch(e){}
}
function restaurarPinSidebar_(){
  try{
    if(localStorage.getItem('gc_sidebar_pinned')==='1') document.getElementById('sidebar').classList.add('pinned');
  }catch(e){}
}
function ejecutarBusquedaGlobal_(){
  var q = document.getElementById('topSearch').value.trim();
  if(!q) return;
  window._pendingSearchQuery = q;
  setView('buscar');
  toggleSidebar_(false);
}
function marcarLive_(on){
  var dot = document.getElementById('liveDot');
  if(dot) dot.classList.toggle('show', !!on);
}

// ============================================================
// NAVEGACIÓN
// ============================================================
var VISTAS = ['dashboard','bandeja','casos','calendario','buscar','reportar','reportes','defensa','actas','equipo','config','detalle'];
var TITULOS = {
  dashboard:['Dashboard','Estado general de los casos'],
  bandeja:['Bandeja de entrada','Eventos esperando revisión antes de convertirse en caso'],
  casos:['Casos','Todos los casos registrados'],
  calendario:['Calendario','Los casos, día por día'],
  buscar:['Buscar cliente / VIN','Historial completo de un cliente o vehículo'],
  reportar:['Reportar un caso','Carga manual — queda igual que cualquier otro caso'],
  reportes:['Reportes','Cuánto se resuelve, de dónde viene y qué se repite'],
  defensa:['Defensa del Consumidor','Seguimiento diferenciado, sin mezclarse con el resto'],
  actas:['Actas de reunión','Minutas de las reuniones del equipo'],
  equipo:['Equipo','Quiénes pueden gestionar y seguir casos'],
  config:['Configuración','Catálogos y parámetros del sistema'],
  detalle:['Detalle del caso','']
};

function setView(v, param){
  window._vistaActual = v; window._vistaActualParam = param;
  VISTAS.forEach(function(x){
    var nav = document.getElementById('nav'+x.charAt(0).toUpperCase()+x.slice(1));
    if(nav) nav.classList.toggle('active', x===v);
  });
  document.getElementById('topbarTitulo').textContent = TITULOS[v][0];
  document.getElementById('topbarSub').textContent = TITULOS[v][1];
  var render = {
    dashboard: renderDashboard,
    bandeja: renderBandeja,
    casos: renderCasos,
    calendario: renderCalendario,
    buscar: renderBuscar,
    reportar: renderReportar,
    reportes: renderReportes,
    defensa: renderDefensaConsumidor,
    actas: renderActas,
    equipo: renderEquipo,
    config: renderConfig,
    detalle: function(){ renderDetalle(param); }
  }[v];
  document.getElementById('content').innerHTML = '<div class="empty-state">Cargando…</div>';
  if(render) render();
}
function refrescarVistaActual_(){
  if(!window._vistaActual) return;
  ['dashboard','casos','eventosPendientes'].forEach(function(k){ guardarCache_(k, null); });
  window._casosCache = null; window._eventosCache = null;
  setView(window._vistaActual, window._vistaActualParam);
  // Si estamos en el dashboard, ese mismo pedido ya trae y pinta el contador
  // de la Bandeja — pedirlo de nuevo acá sería la misma llamada al backend
  // dos veces (justo lo que hacía sentir lenta la app).
  if(window._vistaActual!=='dashboard') actualizarBadgeBandeja_();
  showToast('Actualizado');
}
// Refresco silencioso automático en segundo plano — cada 60s, sin spinner
// ni "Cargando…", para que dashboard/bandeja/casos se mantengan al día
// mientras el usuario los tiene abiertos (mismo criterio que Planning).
setInterval(function(){
  if(!window._vistaActual || document.hidden) return;
  if(window._vistaActual==='dashboard') renderDashboard();
  else if(window._vistaActual==='casos') cargarYPintarCasos_();
  else if(window._vistaActual==='calendario'){
    gasGet('casos').then(function(res){
      if(!res.ok || window._vistaActual!=='calendario') return;
      var casos = res.casos || res || [];
      guardarCache_('casos', casos);
      window._casosCache = casos;
      poblarSelectsCalendario_(casos);
      pintarCalendario_();
    });
  }
  else if(window._vistaActual==='bandeja'){
    gasGet('eventosPendientes').then(function(res){
      if(!res.ok || window._vistaActual!=='bandeja') return;
      guardarCache_('eventosPendientes', res.eventos||[]);
      window._eventosCache = res.eventos||[];
      poblarSelectsBandeja_(window._eventosCache);
      pintarTablaBandeja_();
    });
  }
}, 60000);

function pintarBadgeBandeja_(n){
  var badge = document.getElementById('badgeBandeja');
  if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}
function actualizarBadgeBandeja_(){
  gasGet('dashboard').then(function(res){
    if(!res.ok) return;
    pintarBadgeBandeja_(res.eventosPendientesRevision||0);
  });
}

// ============================================================
// CACHÉ EN MEMORIA (pintar al toque con lo último que había, refrescar
// en silencio detrás — mismo criterio que ya usamos en Planning para que
// las pantallas no se sientan lentas ni parpadeen en "Cargando…").
// ============================================================
function leerCache_(name){ try{ return JSON.parse(sessionStorage.getItem('gc_cache_'+name)||'null'); }catch(e){ return null; } }
function guardarCache_(name,data){ try{ sessionStorage.setItem('gc_cache_'+name, JSON.stringify(data)); }catch(e){} }

// ============================================================
// FILTROS EN FORMATO CHIP (mismo patrón visual que los chips de
// marca/sucursal de Planning) — se usan en Casos y en la Bandeja para
// que "filtrar por marca / por sucursal" esté siempre a un clic, no
// escondido en un <select>.
// ============================================================
function pintarChipsFiltro_(contId, hiddenId, valores, aplicarFnName){
  var cont = document.getElementById(contId);
  if(!cont) return;
  var actual = document.getElementById(hiddenId).value;
  var unicos = Array.from(new Set(valores.filter(Boolean))).sort();
  var botones = [{v:'',label:'Todas'}].concat(unicos.map(function(v){return {v:v,label:v};}));
  cont.innerHTML = botones.map(function(b){
    return '<button type="button" class="filter-chip'+(actual===b.v?' active':'')+'" data-value="'+String(b.v).replace(/"/g,'&quot;')+'" onclick="elegirChip_(\''+contId+'\',\''+hiddenId+'\',this,\''+aplicarFnName+'\')">'+b.label+'</button>';
  }).join('');
}
function elegirChip_(contId, hiddenId, btn, aplicarFnName){
  document.getElementById(hiddenId).value = btn.getAttribute('data-value');
  Array.from(document.getElementById(contId).children).forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  window[aplicarFnName]();
}

// ============================================================
// FILTRO TIPO DROPDOWN COMPACTO — un botón chiquito que abre una lista
// (Marca / Sucursal / Fuente), para que todos los filtros entren en un
// solo renglón sin scrollear en vez de una fila de chips que se enrosca.
// ============================================================
function pintarDropdownFiltro_(btnId, menuId, hiddenId, labelBase, valores, aplicarFnName){
  var menu = document.getElementById(menuId), btn = document.getElementById(btnId);
  if(!menu || !btn) return;
  var actual = document.getElementById(hiddenId).value;
  var unicos = Array.from(new Set(valores.filter(Boolean))).sort();
  var opciones = [''].concat(unicos);
  var conLogos = labelBase==='Marca';
  menu.innerHTML = opciones.map(function(v){
    var etiqueta = (conLogos && v) ? (logoMarcaHtml_(v,14)+' <span>'+v+'</span>') : (v||'Todas');
    return '<button type="button" class="'+(actual===v?'sel':'')+'" style="display:flex;align-items:center;gap:6px;" onclick="elegirDropdownValor_(\''+btnId+'\',\''+menuId+'\',\''+hiddenId+'\',\''+String(v).replace(/'/g,"\\'")+'\',\''+labelBase+'\',\''+aplicarFnName+'\')">'+etiqueta+'</button>';
  }).join('');
  var logoBtn = (conLogos && actual) ? (logoMarcaHtml_(actual,14)+' ') : '';
  btn.innerHTML = logoBtn + (actual ? (labelBase+': '+actual) : labelBase) + ' <span class="material-symbols-outlined" style="font-size:14px;">expand_more</span>';
  btn.classList.toggle('on', !!actual);
}
function toggleFdrop_(menuId){
  var menu = document.getElementById(menuId);
  var abierto = menu.classList.contains('show');
  document.querySelectorAll('.fdrop-menu.show').forEach(function(m){ m.classList.remove('show'); });
  if(!abierto) menu.classList.add('show');
}
function elegirDropdownValor_(btnId, menuId, hiddenId, valor, labelBase, aplicarFnName){
  document.getElementById(hiddenId).value = valor;
  document.getElementById(menuId).classList.remove('show');
  var btn = document.getElementById(btnId);
  var logoBtn = (labelBase==='Marca' && valor) ? (logoMarcaHtml_(valor,14)+' ') : '';
  btn.innerHTML = logoBtn + (valor ? (labelBase+': '+valor) : labelBase) + ' <span class="material-symbols-outlined" style="font-size:14px;">expand_more</span>';
  btn.classList.toggle('on', !!valor);
  window[aplicarFnName]();
}
function fdropHtml_(id, labelBase){
  return '<div class="fdrop"><button type="button" class="fdrop-btn" id="'+id+'Btn" onclick="toggleFdrop_(\''+id+'Menu\')">'+labelBase+' <span class="material-symbols-outlined" style="font-size:14px;">expand_more</span></button><div class="fdrop-menu" id="'+id+'Menu"></div></div><input type="hidden" id="'+id+'" value="">';
}
document.addEventListener('click', function(ev){
  if(ev.target.closest && ev.target.closest('.fdrop')) return;
  document.querySelectorAll('.fdrop-menu.show').forEach(function(m){ m.classList.remove('show'); });
});

// ============================================================
// DASHBOARD
// ============================================================
// ------------------------------------------------------------
// DASHBOARD EJECUTIVO (Etapa 4) — filtros globales (marca/sucursal/sector/
// tipo de operación/período) que alimentan tanto los KPIs ('dashboard')
// como los gráficos ('reporte'); los dos endpoints ya soportan los mismos
// filtros del lado del backend.
// ------------------------------------------------------------
function filtrosGlobalesDashboard_(){
  return {
    marca: val_('dashMarca'), sucursal: val_('dashSucursal'), sector: val_('dashSector'),
    unidad: val_('dashUnidad'), desde: val_('dashDesde'), hasta: val_('dashHasta')
  };
}
// El esqueleto (filtros + grilla de KPIs + paneles de gráficos) se arma UNA
// sola vez; cambiar un filtro solo recarga los números y los gráficos, así
// nunca se pierde lo que ya estaba elegido en los dropdowns.
function pintarEsqueletoDashboard_(){
  var html =
    '<div class="filter-bar">'+
      fdropHtml_('dashMarca','Marca')+
      fdropHtml_('dashSucursal','Sucursal')+
      fdropHtml_('dashSector','Sector')+
      fdropHtml_('dashUnidad','Tipo de operación')+
      '<input id="dashDesde" type="date" title="Desde" onchange="aplicarFiltrosDashboard_()">'+
      '<input id="dashHasta" type="date" title="Hasta" onchange="aplicarFiltrosDashboard_()">'+
      '<button class="fclear" onclick="limpiarFiltrosDashboard_()">Limpiar</button>'+
    '</div>'+
    '<div class="kpi-grid" id="dashKpiGrid"></div>'+
    '<div id="dashAlertBox"></div>'+
    '<div class="detail-grid">'+
    '<div>'+
      '<div class="panel"><div class="panel-head"><h3>Evolución mensual de casos</h3></div><div style="padding:16px;height:220px;"><canvas id="chartDashEvolucion"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Casos por estado</h3></div><div style="padding:16px;height:220px;"><canvas id="chartDashEstado"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Por tipo de operación</h3></div><div style="padding:14px 17px;height:160px;"><canvas id="chartDashUnidad"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Por sucursal</h3></div><div style="padding:14px 17px;height:160px;"><canvas id="chartDashSucursal"></canvas></div></div>'+
    '</div><div>'+
      '<div class="panel"><div class="panel-head"><h3>Resueltos vs. abiertos</h3></div><div style="padding:16px;height:200px;"><canvas id="chartDashResueltos"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Por marca</h3></div><div style="padding:14px 17px;height:170px;"><canvas id="chartDashMarca"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Por sector</h3></div><div style="padding:14px 17px;height:170px;"><canvas id="chartDashSector"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Por responsable</h3></div><div style="padding:14px 17px;height:170px;"><canvas id="chartDashResponsable"></canvas></div></div>'+
      '<div class="panel"><div class="panel-head"><h3>Motivos más frecuentes</h3></div><div style="padding:14px 17px;height:190px;"><canvas id="chartDashMotivo"></canvas></div></div>'+
    '</div>'+
  '</div>';
  document.getElementById('content').innerHTML = html;
  if(window._casosCache) poblarFiltrosDashboard_();
}
function poblarFiltrosDashboard_(){
  var casosRef = window._casosCache || [];
  pintarDropdownFiltro_('dashMarcaBtn','dashMarcaMenu','dashMarca','Marca', casosRef.map(function(c){return c.marca;}), 'aplicarFiltrosDashboard_');
  pintarDropdownFiltro_('dashSucursalBtn','dashSucursalMenu','dashSucursal','Sucursal', casosRef.map(function(c){return c.sucursal;}), 'aplicarFiltrosDashboard_');
  pintarDropdownFiltro_('dashSectorBtn','dashSectorMenu','dashSector','Sector', casosRef.map(function(c){return c.sector;}), 'aplicarFiltrosDashboard_');

// caché instantánea + refresco silencioso, mismo criterio que Casos.
// ============================================================
function parseFechaGC_(str){
  if(!str) return null;
  var partes = String(str).split(' ');
  var f = (partes[0]||'').split('/');
  var h = (partes[1]||'0:0').split(':');
  if(f.length!==3) return null;
  return new Date(Number(f[2]), Number(f[1])-1, Number(f[0]), Number(h[0]||0), Number(h[1]||0));
}
function antiguedadTexto_(fechaCreacion){
  var f = parseFechaGC_(fechaCreacion);
  if(!f) return '—';
  var dias = Math.max(0, Math.floor((Date.now()-f.getTime())/(1000*60*60*24)));
  return dias===0 ? 'hoy' : (dias+'d');
}

function guardarVistaActual_(){
  var nombre = prompt('Nombre para esta vista (ej: "Chevrolet Postventa vencidos"):');
  if(!nombre || !nombre.trim()) return;

    quickView: window._quickViewActiva || 'todos'
  };

  vistas.push({id:'v'+Date.now(), nombre:nombre.trim(), filtros:filtros});

  showToast('Vista "'+nombre.trim()+'" guardada.');

  }).join('') : '<div class="sv-empty">Todavía no guardaste ninguna vista.</div>';

function aplicarVistaGuardada_(id){
  var v = leerVistasGuardadas_().find(function(x){ return x.id===id; });
  if(!v) return;
  Object.keys(v.filtros).forEach(function(k){

    var el = document.getElementById(k); if(el) el.value = v.filtros[k]||'';
  });

  window._quickViewActiva = v.filtros.quickView || 'todos';
  pintarQuickViews_(window._casosCache||[]);

function pintarTablaBandeja_(){
  var eventos = window._eventosCache || [];
  var fuente = document.getElementById('bfFuente').value;
  var marca = document.getElementById('bfMarca').value;
  var sucursal = document.getElementById('bfSucursal').value;
  var desde = document.getElementById('bfDesde').value ? new Date(document.getElementById('bfDesde').value+'T00:00:00') : null;
  var hasta = document.getElementById('bfHasta').value ? new Date(document.getElementById('bfHasta').value+'T23:59:59') : null;
  var q = (document.getElementById('bfBusqueda').value||'').toLowerCase();
  var filtrados = eventos.filter(function(e){
    var d = e.datosNormalizados||{};
    if(fuente && e.fuente!==fuente) return false;
    if(marca && d.marca!==marca) return false;
    if(sucursal && d.sucursal!==sucursal) return false;
    var fecha = parseFechaGC_(e.fechaRecepcion);
    if(desde && fecha && fecha<desde) return false;
    if(hasta && fecha && fecha>hasta) return false;
    if(q){
      var texto = ((d.cliente||'')+' '+(d.vin||'')+' '+(d.motivo||'')+' '+e.id).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  // Más reciente primero — igual criterio que Planning.
  filtrados.sort(function(a,b){ return (parseFechaGC_(b.fechaRecepcion)||0) - (parseFechaGC_(a.fechaRecepcion)||0); });
  var cont = document.getElementById('tablaBandeja');
  if(filtrados.length===0){ cont.innerHTML = '<div class="empty-state">'+(eventos.length===0?'✓ No hay eventos esperando revisión.':'No hay eventos que coincidan con los filtros.')+'</div>'; return; }
  var filas = filtrados.map(function(e){
    var d = e.datosNormalizados||{};

      '<td class="mono" style="color:var(--text-faint);">'+e.id+'</td>'+
      '<td>'+(d.cliente||'—')+'</td>'+
      '<td>'+(d.marca||'—')+' '+(d.modelo||'')+'</td>'+
      '<td>'+(d.vin||'—')+'</td>'+
      '<td>'+(d.sucursal||'—')+'</td>'+
      '<td><span class="pill pill-nuevo">'+(e.fuente||'Manual')+'</span></td>'+
      '<td>'+(d.motivo||'—')+'</td>'+
      '<td style="white-space:nowrap;">'+e.fechaRecepcion+'</td>'+
      '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" style="width:auto;" onclick="confirmarEvento_(\''+e.id+'\', event)">Convertir en caso</button> '+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="descartarEvento_(\''+e.id+'\', event)">Descartar</button></td>'+
    '</tr>';
  }).join('');
  cont.innerHTML = '<table class="tbl"><thead><tr><th>Evento</th><th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Sucursal</th><th>Fuente</th><th>Motivo</th><th>Recibido</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>';
}

      '<button class="btn btn-ghost btn-sm" style="width:auto;padding:6px 12px;" onclick="toggleMenuVistasGuardadas_()">Vistas guardadas <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;">expand_more</span></button>'+
      '<div class="saved-views-menu" id="menuVistasGuardadas"></div>'+

  '</div><div class="updating-pill" id="casosUpdating"><span class="spin"></span>Actualizando…</div>'+
  '<div class="panel"><div class="table-wrap" id="tablaCasos"><div class="empty-state">Cargando…</div></div></div>';
  document.getElementById('content').innerHTML = html;
  var cache = leerCache_('casos');
  if(cache){ window._casosCache = cache; poblarSelectsCasos_(cache); pintarQuickViews_(cache); pintarTablaCasos_(); }
  document.getElementById('casosUpdating').classList.toggle('show', !!cache);
  cargarYPintarCasos_();
}
function pintarQuickViews_(casos){
  var activa = window._quickViewActiva || 'todos';
  document.getElementById('quickViewsCasos').innerHTML = QUICK_VIEWS_CASOS_.map(function(qv){
    var n = casos.filter(qv.test).length;
    return '<button class="qv-chip'+(activa===qv.id?' active':'')+'" onclick="aplicarQuickView_(\''+qv.id+'\')">'+qv.label+'<span class="qv-n">'+n+'</span></button>';
  }).join('');
}
function aplicarQuickView_(id){
  window._quickViewActiva = id;
  if(id==='todos') limpiarFiltrosCasos_(false);
  pintarQuickViews_(window._casosCache||[]);
  pintarTablaCasos_();
}
function cargarYPintarCasos_(){
  gasGet('casos').then(function(res){
    if(!res.ok){ if(!window._casosCache) document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos || res || [];
    guardarCache_('casos', casos);
    if(window._vistaActual!=='casos') return;
    window._casosCache = casos;
    document.getElementById('casosUpdating').classList.remove('show');
    poblarSelectsCasos_(casos);
    pintarQuickViews_(casos);
    pintarTablaCasos_();
  });
}
function poblarSelectsCasos_(casos){
  configCacheada_().then(function(cfg){
    var cat = (cfg.ok && cfg.catalogos) || {};
    pintarDropdownFiltro_('fMarcaBtn','fMarcaMenu','fMarca','Marca', (cat.Marca||[]).concat(casos.map(function(c){return c.marca;})), 'aplicarFiltrosCasos_');
    pintarDropdownFiltro_('fSucursalBtn','fSucursalMenu','fSucursal','Sucursal', (cat.Sucursal||[]).concat(casos.map(function(c){return c.sucursal;})), 'aplicarFiltrosCasos_');
    pintarDropdownFiltro_('fUnidadBtn','fUnidadMenu','fUnidad','Tipo de operación', (cat['Unidad de Negocio']||[]).concat(casos.map(function(c){return c.unidad;})), 'aplicarFiltrosCasos_');
    pintarDropdownFiltro_('fFuenteBtn','fFuenteMenu','fFuente','Fuente', (cat.Fuente||[]).concat(casos.map(function(c){return c.fuente;})), 'aplicarFiltrosCasos_');
  });
}
function limpiarFiltrosCasos_(resetQuickView){
  ['fEstado','fPrioridad','fFuente','fMarca','fSucursal','fUnidad','fDesde','fHasta','fBusqueda'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('fDefensa').checked = false;
  if(resetQuickView!==false) window._quickViewActiva = 'todos';
  if(window._casosCache){ poblarSelectsCasos_(window._casosCache); pintarQuickViews_(window._casosCache); }
  pintarTablaCasos_();
}
function aplicarFiltrosCasos_(){ pintarTablaCasos_(); }
function pintarTablaCasos_(){
  var estado = document.getElementById('fEstado').value;
  var prioridad = document.getElementById('fPrioridad').value;
  var fuente = document.getElementById('fFuente').value;
  var marca = document.getElementById('fMarca').value;
  var sucursal = document.getElementById('fSucursal').value;
  var unidad = document.getElementById('fUnidad').value;
  var desde = document.getElementById('fDesde').value ? new Date(document.getElementById('fDesde').value+'T00:00:00') : null;
  var hasta = document.getElementById('fHasta').value ? new Date(document.getElementById('fHasta').value+'T23:59:59') : null;
  var soloDefensa = document.getElementById('fDefensa').checked;
  var q = document.getElementById('fBusqueda').value.toLowerCase();
  var quickView = QUICK_VIEWS_CASOS_.find(function(qv){ return qv.id===(window._quickViewActiva||'todos'); }) || QUICK_VIEWS_CASOS_[0];
  var casos = (window._casosCache||[]).filter(function(c){
    if(!quickView.test(c)) return false;
    if(estado && c.estado!==estado) return false;
    if(prioridad && c.prioridad!==prioridad) return false;
    if(fuente && c.fuente!==fuente) return false;
    if(marca && c.marca!==marca) return false;
    if(sucursal && c.sucursal!==sucursal) return false;
    if(unidad && c.unidad!==unidad) return false;
    if(soloDefensa && !(String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true)) return false;
    var fecha = parseFechaGC_(c.fechaCreacion);
    if(desde && fecha && fecha<desde) return false;
    if(hasta && fecha && fecha>hasta) return false;
    if(q){
      var texto = ((c.cliente||'')+' '+(c.dominio||'')+' '+(c.motivo||'')+' '+(c.id||'')).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  if(casos.length===0){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">No hay casos que coincidan.</div>'; return; }
  var filas = casos.map(function(c){
    var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
    var prioColor = {Alta:'var(--danger)',Media:'var(--warn)',Baja:'var(--text-faint)'}[c.prioridad]||'var(--text-faint)';
    return '<tr onclick="setView(\'detalle\',\''+c.id+'\')">'+
      '<td class="mono" style="color:var(--caso);font-weight:700;white-space:nowrap;">'+c.id+(esDefensa?' ⚖️':'')+'</td>'+
      '<td><div style="font-weight:650;color:var(--text);">'+(c.cliente||'—')+'</div>'+
        '<div style="font-size:10.5px;color:var(--text-faint);margin-top:1px;">'+(c.dominio?('<span class="mono">'+c.dominio+'</span> · '):'')+(c.motivo||c.tipoCaso||'')+'</div></td>'+
      '<td><div>'+marcaConLogo_(c.marca,15)+'</div>'+(c.modelo?'<div style="font-size:10.5px;color:var(--text-faint);">'+c.modelo+'</div>':'')+'</td>'+
      '<td>'+(c.sucursal||'—')+'</td>'+
      '<td style="font-size:11.5px;color:var(--text-dim);">'+(c.unidad||'—')+'</td>'+
      '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
      '<td><span class="prio prio-'+c.prioridad+'" style="display:inline-flex;align-items:center;gap:5px;"><i style="width:6px;height:6px;border-radius:50%;background:'+prioColor+';display:inline-block;"></i>'+c.prioridad+'</span></td>'+
      '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
      '<td style="white-space:nowrap;font-size:11.5px;color:var(--text-dim);">'+(c.fechaCreacion||'—')+'</td>'+
      '<td style="font-size:11.5px;color:var(--text-dim);">'+antiguedadTexto_(c.fechaCreacion)+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaCasos').innerHTML =
    '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Sucursal</th><th>Operación</th><th>Estado</th><th>Prioridad</th><th>Responsable</th><th>Creado</th><th>Antigüedad</th></tr></thead><tbody>'+filas+'</tbody></table>';
}

// CALENDARIO — vista mensual de los casos (creación o vencimiento de
// SLA), en vez de tener que abrirlos uno por uno desde la lista.
