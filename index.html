<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestión de Casos · Grupo París</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  /* Misma paleta que Planning de Entregas — Gestión de Casos usa el coral
     que ya es "el color de Casos" ahí, para que se sienta la misma familia. */
  --bg:#0F131A; --panel:#161B24; --panel-2:#1D2330; --hairline:#2A303D;
  --text:#EAEDF3; --text-dim:#A3ABBD; --text-faint:#7A8296;
  --ok:#3FBF88; --ok-soft:rgba(63,191,136,0.14);
  --warn:#E8B23D; --warn-soft:rgba(232,178,61,0.14);
  --danger:#E85D5D; --danger-soft:rgba(232,93,93,0.14);
  --pending:#6B7385; --pending-soft:rgba(107,115,133,0.16);
  --purple:#8B7CF6; --purple-soft:rgba(139,124,246,0.14);
  --caso:#FF6B4A; --caso-soft:rgba(255,107,74,0.16);
  --accent: var(--caso); --accent-soft: var(--caso-soft);
  --radius-s:9px; --radius-m:13px; --radius-l:18px;
  --shadow-1:0 1px 2px rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.14);
  --shadow-2:0 18px 40px -10px rgba(0,0,0,.5), 0 6px 16px -6px rgba(0,0,0,.35);
  --sidebar-w:224px; --topbar-h:58px;
}
body.light-mode{
  --bg:#F2F3F5; --panel:#FFFFFF; --panel-2:#F5F6F8; --hairline:#E1E3E8;
  --text:#181B20; --text-dim:#464D5A; --text-faint:#6B7280;
  --shadow-1:0 1px 2px rgba(20,20,30,.06), 0 1px 1px rgba(20,20,30,.05);
  --shadow-2:0 18px 40px -10px rgba(20,20,30,.14), 0 6px 16px -6px rgba(20,20,30,.10);
}
body.light-mode #login-screen{background:radial-gradient(1100px 760px at 18% 105%, #FFFFFF 0%, var(--bg) 55%);}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; font-size:13.5px; line-height:1.45;}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.hidden{display:none !important;}
.view:not(.hidden){animation:viewIn .2s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--caso); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
::selection{background:var(--caso-soft); color:var(--text);}

/* LOGIN */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(1100px 760px at 18% 105%, #1A2030 0%, var(--bg) 55%); position:relative; overflow:hidden;}
#login-screen::before{content:""; position:absolute; inset:0; background:radial-gradient(650px 460px at 84% 14%, rgba(255,107,74,.16), transparent 60%), radial-gradient(480px 380px at 6% 88%, rgba(139,124,246,.10), transparent 60%);}
.login-card{position:relative; z-index:2; width:376px; background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-l); padding:38px 34px 30px; box-shadow:var(--shadow-2);}
.login-mark{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
.login-mark .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--caso),#C2431F);flex-shrink:0;box-shadow:0 6px 16px -4px rgba(255,107,74,.5);}
.login-mark span{font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:-.01em; font-size:16px; display:block; color:var(--text);}
.login-mark small{display:block; font-size:10px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; margin-top:1px;}
.login-card h1{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-bottom:4px; color:var(--text);}
.login-card p.sub{color:var(--text-dim); font-size:12.5px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); font-size:13px; font-family:inherit; background:var(--panel-2); color:var(--text); transition:border-color .15s, box-shadow .15s;}
.field input::placeholder, .field textarea::placeholder{color:var(--text-faint);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--caso); box-shadow:0 0 0 3px var(--caso-soft); outline:none;}
.field textarea{resize:vertical; min-height:80px;}
.btn{border:none; border-radius:var(--radius-s); font-weight:650; font-size:13px; padding:10px 16px; transition:transform .14s, box-shadow .18s, filter .15s; display:inline-flex; align-items:center; justify-content:center; gap:7px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg, var(--caso), #C2431F); color:#fff; width:100%; box-shadow:0 4px 14px -3px rgba(255,107,74,.4);}
.btn-primary:hover{filter:brightness(1.08); box-shadow:0 8px 20px -4px rgba(255,107,74,.55); transform:translateY(-1px);}
.btn-ghost{background:transparent; color:var(--text-dim); border:1.5px solid var(--hairline);}
.btn-ghost:hover{border-color:var(--caso); color:var(--caso); background:var(--caso-soft);}
.btn-dark{background:var(--panel-2); color:var(--text); border:1px solid var(--hairline);}
.btn-dark:hover{border-color:var(--caso); color:var(--caso);}
.btn-sm{padding:8px 13px; font-size:12px;}
.login-error{background:var(--danger-soft); color:var(--danger); border-radius:var(--radius-s); padding:9px 12px; font-size:12px; margin-bottom:14px; display:none;}
.login-foot{margin-top:18px; text-align:center; font-size:10.5px; color:var(--text-faint);}

/* SHELL */
#app{display:flex; min-height:100vh;}
.sidebar{width:var(--sidebar-w); flex-shrink:0; background:var(--panel); border-right:1px solid var(--hairline); color:var(--text); display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; z-index:25;}
.brand{display:flex; align-items:center; gap:9px; padding:6px 8px 18px;}
.brand .dot{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--caso),#C2431F);flex-shrink:0;}
.brand strong{font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; letter-spacing:-.01em; display:block; color:var(--text);}
.brand small{display:block; font-size:8.8px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase;}
.nav-item{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; color:var(--text-dim); font-size:12.5px; font-weight:550; margin-bottom:2px; transition:background .16s,color .16s; width:100%; text-align:left; background:none; border:none; position:relative;}
.nav-item .material-symbols-outlined{font-size:18px; flex-shrink:0;}
.nav-item:hover{background:var(--panel-2); color:var(--text);}
.nav-item.active{background:var(--caso-soft); color:var(--caso);}
.nav-item .badge-count{margin-left:auto; background:var(--caso); color:#fff; font-size:9.5px; padding:1px 6px; border-radius:20px; font-weight:700;}
.nav-item.active .badge-count{background:var(--caso);}
.sidebar-foot{margin-top:auto; border-top:1px solid var(--hairline); padding-top:12px;}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:9px; cursor:pointer;}
.user-chip:hover{background:var(--panel-2);}
.avatar{width:27px; height:27px; border-radius:50%; background:linear-gradient(135deg, var(--caso), #C2431F); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex-shrink:0;}
.user-chip .name{font-size:12px; font-weight:650; color:var(--text);}
.user-chip .role{font-size:10px; color:var(--text-faint);}

.main{flex:1; min-width:0;}
.topbar{height:var(--topbar-h); border-bottom:1px solid var(--hairline); background:var(--bg); display:flex; align-items:center; padding:0 24px; gap:14px; position:sticky; top:0; z-index:20;}
.topbar h1{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--text);}
.topbar .sub{font-size:11.5px; color:var(--text-faint);}
.content{padding:22px 26px 60px;}
.page-title{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; letter-spacing:-.01em; color:var(--text);}
.page-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:11px; margin-bottom:18px;}
.kpi-card{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:15px 15px 13px; box-shadow:var(--shadow-1);}
.kpi-num{font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:600;}
.kpi-label{font-size:11px; color:var(--text-faint); margin-top:4px;}

.panel{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); box-shadow:var(--shadow-1); margin-bottom:16px;}
.panel-head{padding:13px 17px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-size:12.5px; font-weight:700; color:var(--text);}
.panel-body{padding:6px 0;}

.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:13px;}
.filter-bar select, .filter-bar input{padding:8px 11px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); font-size:12px; background:var(--panel); color:var(--text);}
.filter-bar input::placeholder{color:var(--text-faint);}

table.tbl{width:100%; border-collapse:collapse; font-size:12.3px;}
table.tbl th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:10px 16px; border-bottom:1px solid var(--hairline); font-weight:700;}
table.tbl td{padding:11px 16px; border-bottom:1px solid var(--hairline); color:var(--text-dim);}
table.tbl tr{cursor:pointer;}
table.tbl tr:hover td{background:var(--panel-2);}

.pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.3px; font-weight:700;}
.pill-nuevo{background:var(--caso-soft); color:var(--caso);}
.pill-analisis{background:var(--warn-soft); color:var(--warn);}
.pill-esperando{background:var(--purple-soft); color:var(--purple);}
.pill-derivado{background:var(--pending-soft); color:var(--text-dim);}
.pill-resuelto{background:var(--ok-soft); color:var(--ok);}
.pill-cerrado{background:var(--pending-soft); color:var(--text-faint);}
.prio{font-weight:700; font-size:11px;}
.prio-Alta{color:var(--danger);}
.prio-Media{color:var(--warn);}
.prio-Baja{color:var(--text-faint);}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:12.5px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--hairline); color:var(--text); padding:11px 18px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-2); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* Detalle de caso */
.detail-header{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:17px 19px; margin-bottom:15px; box-shadow:var(--shadow-1);}
.dh-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
.dh-id{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--caso); font-weight:700;}
.dh-title{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; margin-top:2px; color:var(--text);}
.info-strip{display:flex; gap:22px; flex-wrap:wrap; border-top:1px solid var(--hairline); padding-top:12px;}
.info-item{font-size:11.5px;}
.info-item span{display:block; color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
.info-item b{font-size:12.5px; color:var(--text); font-weight:600;}
.action-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.action-row select{background:var(--panel-2); color:var(--text); border:1.5px solid var(--hairline);}

.detail-grid{display:grid; grid-template-columns:1.7fr 1fr; gap:15px;}
@media(max-width:900px){ .detail-grid{grid-template-columns:1fr;} }

.timeline{padding:4px 17px 14px;}
.t-item{display:grid; grid-template-columns:16px 96px 1fr; gap:12px; padding:9px 0; align-items:start; position:relative;}
.t-item::before{content:""; position:absolute; left:7px; top:22px; bottom:-9px; width:1.5px; background:var(--hairline);}
.t-item:last-child::before{display:none;}
.t-dot{width:9px; height:9px; border-radius:50%; background:var(--text-faint); margin-top:4px;}
.t-dot.sistema{background:var(--text-faint);}
.t-dot.comentario{background:var(--caso);}
.t-dot.cambio_estado{background:var(--warn);}
.t-dot.asignacion{background:var(--purple);}
.t-dot.cambio_prioridad{background:var(--danger);}
.t-when{font-size:10px; color:var(--text-faint); padding-top:1px;}
.t-what{font-size:12px; color:var(--text);}
.t-who{font-size:10px; color:var(--text-faint); margin-top:2px;}

.side-block{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:15px; margin-bottom:13px; box-shadow:var(--shadow-1);}
.side-block h4{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin-bottom:10px;}
.comment-box textarea{width:100%; min-height:68px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); padding:9px 11px; font-size:12px; font-family:inherit; resize:vertical; background:var(--panel-2); color:var(--text);}
.checkbox-row{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:11px; color:var(--text-dim);}

.alert-box{display:flex; gap:12px; background:var(--warn-soft); border:1px solid rgba(232,178,61,.35); border-radius:var(--radius-m); padding:13px 15px; margin-bottom:15px; font-size:12px; color:var(--warn);}
.alert-box.purple{background:var(--purple-soft); border-color:rgba(139,124,246,.35); color:var(--purple);}
.alert-box a{color:inherit;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:700px){ .form-grid{grid-template-columns:1fr;} }

.overlay{position:fixed; inset:0; background:rgba(6,7,10,.6); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .18s; z-index:70;}
.overlay.show{opacity:1; pointer-events:auto;}
.modal{position:fixed; top:50%; left:50%; transform:translate(-50%,-48%); width:min(600px,92vw); max-height:82vh; overflow-y:auto; background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-l); box-shadow:var(--shadow-2); z-index:76; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;}
.modal.show{opacity:1; transform:translate(-50%,-50%); pointer-events:auto;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--hairline);}
.modal-head h3{font-size:14px; font-weight:700; color:var(--text);}
.modal-head .close{background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; padding:4px;}
.modal-head .close:hover{color:var(--text);}
.modal-body{padding:6px 0;}

@media print{ .sidebar,.topbar,.action-row,.comment-box{display:none !important;} }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-mark"><div class="dot"></div><div><span>Gestión de Casos</span><small>Grupo París · Calidad</small></div></div>
    <h1>Ingresar</h1>
    <p class="sub">Accedé con tu usuario del equipo de Calidad.</p>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>Usuario</label><input id="loginUsuario" type="text" placeholder="tu.usuario" onkeydown="if(event.key==='Enter')intentarLogin()"></div>
    <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')intentarLogin()"></div>
    <button class="btn btn-primary" onclick="intentarLogin()" id="btnLogin">Ingresar</button>
    <div class="login-foot">Sistema interno — Grupo París</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar">
    <div class="brand"><div class="dot"></div><div><strong>Gestión de Casos</strong><small>Grupo París</small></div></div>
    <button class="nav-item active" id="navDashboard" onclick="setView('dashboard')"><span class="material-symbols-outlined">dashboard</span>Dashboard</button>
    <button class="nav-item" id="navBandeja" onclick="setView('bandeja')"><span class="material-symbols-outlined">inbox</span>Bandeja de entrada<span class="badge-count hidden" id="badgeBandeja">0</span></button>
    <button class="nav-item" id="navCasos" onclick="setView('casos')"><span class="material-symbols-outlined">folder_open</span>Casos</button>
    <button class="nav-item" id="navBuscar" onclick="setView('buscar')"><span class="material-symbols-outlined">search</span>Buscar cliente / VIN</button>
    <button class="nav-item" id="navReportar" onclick="setView('reportar')"><span class="material-symbols-outlined">add_circle</span>Reportar un caso</button>
    <button class="nav-item" id="navReportes" onclick="setView('reportes')"><span class="material-symbols-outlined">bar_chart</span>Reportes</button>
    <button class="nav-item" id="navDefensa" onclick="setView('defensa')"><span class="material-symbols-outlined">balance</span>Defensa del Consumidor</button>
    <button class="nav-item" id="navActas" onclick="setView('actas')"><span class="material-symbols-outlined">description</span>Actas de reunión</button>
    <button class="nav-item" id="navEquipo" onclick="setView('equipo')"><span class="material-symbols-outlined">group</span>Equipo</button>
    <button class="nav-item" id="navConfig" onclick="setView('config')"><span class="material-symbols-outlined">settings</span>Configuración</button>
    <div class="sidebar-foot">
      <button class="nav-item" id="themeToggleBtn" onclick="toggleTheme()"><span class="material-symbols-outlined">light_mode</span>Modo claro</button>
      <div class="user-chip" onclick="cerrarSesion()" title="Cerrar sesión">
        <div class="avatar" id="userAvatar">—</div>
        <div><div class="name" id="userNombre">—</div><div class="role" id="userRol">—</div></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div><h1 id="topbarTitulo">Dashboard</h1><div class="sub" id="topbarSub">Estado general de los casos</div></div>
      <button class="btn btn-ghost btn-sm" style="width:auto;margin-left:auto;" onclick="refrescarVistaActual_()" title="Volver a traer los datos"><span class="material-symbols-outlined" style="font-size:15px;vertical-align:-3px;">refresh</span> Actualizar</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" onclick="cerrarModalListaFiltrada_()"></div>
<div class="modal" id="modalListaFiltrada">
  <div class="modal-head"><h3 id="listaFiltradaTitulo">Casos</h3><button class="close" onclick="cerrarModalListaFiltrada_()">✕</button></div>
  <div class="modal-body" id="listaFiltradaBody"></div>
</div>

<script>
// ============================================================
// CONEXIÓN CON EL BACKEND — mismo patrón que Planning de Entregas:
// la URL de Apps Script se lee de una variable de entorno de Vercel
// (VITE_API_URL) a través de /api/config, nunca se pide ni se guarda
// hardcodeada acá. Ver api/config.js.
// ============================================================
var API_URL = null;

function cargarConfigBackend(){
  return fetch('/api/config').then(function(r){
    if(!r.ok) throw new Error('config no disponible');
    return r.json();
  }).then(function(cfg){
    if(!cfg || !cfg.apiUrl) throw new Error('API_URL no configurada');
    API_URL = cfg.apiUrl;
    return API_URL;
  });
}
function gasGet(action, params){
  params = params || {};
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function(k){ if(params[k]!==undefined && params[k]!==null) url += '&'+k+'='+encodeURIComponent(params[k]); });
  return fetch(url).then(function(r){ return r.json(); });
}
function gasPost(action, params){
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:action, params:params||{}})
  }).then(function(r){ return r.json(); });
}

// ============================================================
// SESIÓN
// ============================================================
function sesionActual(){
  try{ return JSON.parse(localStorage.getItem('gc_sesion')||'null'); }catch(e){ return null; }
}
function guardarSesion(s){ localStorage.setItem('gc_sesion', JSON.stringify(s)); }
function cerrarSesion(){ localStorage.removeItem('gc_sesion'); location.reload(); }
function aplicarTema(modo){
  document.body.classList.toggle('light-mode', modo==='claro');
  var btn = document.getElementById('themeToggleBtn');
  if(btn) btn.innerHTML = '<span class="material-symbols-outlined">'+(modo==='claro'?'dark_mode':'light_mode')+'</span>'+(modo==='claro' ? 'Modo oscuro' : 'Modo claro');
  localStorage.setItem('gc_tema', modo);
}
function toggleTheme(){
  var actual = localStorage.getItem('gc_tema')==='claro' ? 'claro' : 'oscuro';
  aplicarTema(actual==='claro' ? 'oscuro' : 'claro');
}
function _passwordSesionActual_(){
  var s = sesionActual();
  if(s && s.password) return s.password;
  showToast('Cerrá sesión y volvé a entrar una vez para poder usar Equipo.');
  return null;
}

function intentarLogin(){
  var usuario = document.getElementById('loginUsuario').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('btnLogin');
  errEl.style.display = 'none';
  if(!usuario || !password){ errEl.textContent='Completá usuario y contraseña.'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  cargarConfigBackend().then(function(){
    return gasPost('login', {usuario:usuario, password:password});
  }).then(function(res){
    btn.disabled = false; btn.textContent = 'Ingresar';
    if(!res.ok){ errEl.textContent = res.error||'No se pudo ingresar.'; errEl.style.display='block'; return; }
    // Guardamos la contraseña junto con la sesión (mismo criterio que ya usa
    // Planning) porque las acciones de Equipo (crear/editar/desactivar
    // usuarios) requieren re-confirmar credenciales de Calidad en cada
    // llamada al backend, y no queremos pedírsela de nuevo a cada rato.
    res.password = password;
    guardarSesion(res);
    iniciarApp();
  }).catch(function(err){
    btn.disabled = false; btn.textContent = 'Ingresar';
    errEl.textContent = 'No se pudo conectar con el backend. ('+err.message+')';
    errEl.style.display = 'block';
  });
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ============================================================
// ARRANQUE
// ============================================================
window.addEventListener('DOMContentLoaded', function(){
  aplicarTema(localStorage.getItem('gc_tema')==='claro' ? 'claro' : 'oscuro');
  var s = sesionActual();
  if(s){ iniciarApp(); }
});

function iniciarApp(){
  var s = sesionActual();
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userNombre').textContent = s.nombre;
  document.getElementById('userRol').textContent = etiquetaRol_(s.rol);
  document.getElementById('userAvatar').textContent = (s.nombre||'?').charAt(0).toUpperCase();
  document.getElementById('navEquipo').style.display = (s.rol==='calidad') ? '' : 'none';
  document.getElementById('navConfig').style.display = (s.rol==='calidad') ? '' : 'none';
  cargarConfigBackend().then(function(){
    setView('dashboard');
    actualizarBadgeBandeja_();
  }).catch(function(err){
    document.getElementById('content').innerHTML = '<div class="empty-state">No se pudo conectar con el backend.<br>'+err.message+'</div>';
  });
}
function etiquetaRol_(r){
  var mapa = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  return mapa[r] || r;
}

var VISTAS = ['dashboard','bandeja','casos','buscar','reportar','reportes','defensa','actas','equipo','config','detalle'];
var TITULOS = {
  dashboard:['Dashboard','Estado general de los casos'],
  bandeja:['Bandeja de entrada','Eventos esperando revisión antes de convertirse en caso'],
  casos:['Casos','Todos los casos registrados'],
  buscar:['Buscar cliente / VIN','Historial completo de un cliente o vehículo'],
  reportar:['Reportar un caso','Carga manual — queda igual que cualquier otro caso'],
  reportes:['Reportes','Cuánto se resuelve, de dónde viene y qué se repite'],
  defensa:['Defensa del Consumidor','Seguimiento diferenciado, sin mezclarse con el resto'],
  actas:['Actas de reunión','Minutas de las reuniones del equipo'],
  equipo:['Equipo','Quiénes pueden gestionar y seguir casos'],
  config:['Configuración','Catálogos y parámetros del sistema'],
  detalle:['Detalle del caso','']
};

function setView(v, param){
  window._vistaActual = v; window._vistaActualParam = param;
  VISTAS.forEach(function(x){
    var nav = document.getElementById('nav'+x.charAt(0).toUpperCase()+x.slice(1));
    if(nav) nav.classList.toggle('active', x===v);
  });
  document.getElementById('topbarTitulo').textContent = TITULOS[v][0];
  document.getElementById('topbarSub').textContent = TITULOS[v][1];
  var render = {
    dashboard: renderDashboard,
    bandeja: renderBandeja,
    casos: renderCasos,
    buscar: renderBuscar,
    reportar: renderReportar,
    reportes: renderReportes,
    defensa: renderDefensaConsumidor,
    actas: renderActas,
    equipo: renderEquipo,
    config: renderConfig,
    detalle: function(){ renderDetalle(param); }
  }[v];
  document.getElementById('content').innerHTML = '<div class="empty-state">Cargando…</div>';
  if(render) render();
}
function refrescarVistaActual_(){
  if(!window._vistaActual) return;
  if(window._vistaActual==='casos') window._casosCache = null;
  setView(window._vistaActual, window._vistaActualParam);
  actualizarBadgeBandeja_();
  showToast('Actualizado');
}

function actualizarBadgeBandeja_(){
  gasGet('dashboard').then(function(res){
    if(!res.ok) return;
    var badge = document.getElementById('badgeBandeja');
    var n = res.eventosPendientesRevision||0;
    if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  });
}

function renderDashboard(){
  gasGet('dashboard').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var html = '<div class="kpi-grid">'+
      kpiCardClick_(res.urgentes,'Casos urgentes','var(--danger)', "verListaFiltrada_('Casos urgentes',{prioridad:'Alta',soloAbiertos:true})")+
      kpiCardClick_(res.abiertos,'Casos abiertos','var(--text)', "verListaFiltrada_('Casos abiertos',{soloAbiertos:true})")+
      kpiCardClick_(res.vencidos,'Vencidos (SLA)','var(--danger)', "verListaFiltrada_('Casos vencidos (SLA)',{soloVencidos:true})")+
      kpiCardClick_(res.nuevosSinAsignar,'Nuevos sin asignar','var(--caso)', "verListaFiltrada_('Nuevos sin asignar',{estado:'nuevo',soloSinAsignar:true})")+
      kpiCardClick_(res.resueltosSemana,'Resueltos esta semana','var(--ok)', "verListaFiltrada_('Resueltos / cerrados',{soloResueltos:true})")+
      kpiCardClick_(res.eventosPendientesRevision,'En bandeja de entrada','var(--purple)', "setView('bandeja')")+
    '</div>';
    if(res.eventosPendientesRevision>0){
      html += '<div class="alert-box purple"><span class="material-symbols-outlined">inbox</span><div>Hay <b>'+res.eventosPendientesRevision+' evento(s)</b> esperando revisión en la <a href="#" onclick="setView(\'bandeja\');return false;" style="color:var(--purple);font-weight:700;text-decoration:underline;">Bandeja de entrada</a> antes de convertirse en caso.</div></div>';
    }
    document.getElementById('content').innerHTML = html;
  });
}
function kpiCard_(num, label, color){
  return '<div class="kpi-card"><div class="kpi-num" style="color:'+color+';">'+(num!==undefined?num:'—')+'</div><div class="kpi-label">'+label+'</div></div>';
}
function kpiCardClick_(num, label, color, onclickJs){
  return '<div class="kpi-card" style="cursor:pointer;transition:transform .12s,box-shadow .15s;" onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'var(--shadow-2)\';" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\';" onclick="'+onclickJs.replace(/"/g,'&quot;')+'"><div class="kpi-num" style="color:'+color+';">'+(num!==undefined?num:'—')+'</div><div class="kpi-label">'+label+'</div></div>';
}
// Modal genérico: lista de casos que cumplen ciertos filtros — usado por
// los KPIs clickeables del Dashboard y de Reportes ("apretar y ver la lista").
function verListaFiltrada_(titulo, filtros){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modalListaFiltrada').classList.add('show');
  document.getElementById('listaFiltradaTitulo').textContent = titulo;
  document.getElementById('listaFiltradaBody').innerHTML = '<div class="empty-state">Cargando…</div>';
  gasGet('casos', filtros).then(function(res){
    var body = document.getElementById('listaFiltradaBody');
    if(!res.ok){ body.innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos||[];
    if(casos.length===0){ body.innerHTML = '<div class="empty-state">No hay casos en esta categoría.</div>'; return; }
    body.innerHTML = '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Estado</th><th>Prioridad</th><th>Responsable</th></tr></thead><tbody>'+
      casos.map(function(c){
        return '<tr onclick="cerrarModalListaFiltrada_();setView(\'detalle\',\''+c.id+'\')">'+
          '<td class="mono" style="color:var(--caso);font-weight:700;">'+c.id+'</td>'+
          '<td>'+(c.cliente||'—')+'</td><td>'+(c.marca||'—')+'</td>'+
          '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
          '<td><span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span></td>'+
          '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
        '</tr>';
      }).join('')+
    '</tbody></table>';
  });
}
function cerrarModalListaFiltrada_(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalListaFiltrada').classList.remove('show');
}

function renderBandeja(){
  gasGet('eventosPendientes').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var eventos = res.eventos||[];
    if(eventos.length===0){
      document.getElementById('content').innerHTML = '<div class="panel"><div class="empty-state">✓ No hay eventos esperando revisión.</div></div>';
      return;
    }
    var filas = eventos.map(function(e){
      var d = e.datosNormalizados||{};
      return '<tr>'+
        '<td class="mono" style="color:var(--text-faint);">'+e.id+'</td>'+
        '<td>'+(d.cliente||'—')+'</td>'+
        '<td>'+(d.marca||'—')+' '+(d.modelo||'')+'</td>'+
        '<td>'+(d.vin||'—')+'</td>'+
        '<td><span class="pill pill-nuevo">'+(e.fuente||'Manual')+'</span></td>'+
        '<td>'+(d.motivo||'—')+'</td>'+
        '<td style="white-space:nowrap;">'+e.fechaRecepcion+'</td>'+
        '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" style="width:auto;" onclick="confirmarEvento_(\''+e.id+'\', event)">Convertir en caso</button> '+
          '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="descartarEvento_(\''+e.id+'\', event)">Descartar</button></td>'+
      '</tr>';
    }).join('');
    document.getElementById('content').innerHTML =
      '<div class="panel"><table class="tbl"><thead><tr><th>Evento</th><th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Fuente</th><th>Motivo</th><th>Recibido</th><th></th></tr></thead><tbody>'+filas+'</tbody></table></div>';
  });
}
function confirmarEvento_(id, ev){
  ev.stopPropagation();
  var s = sesionActual();
  gasPost('confirmarEventoComoCaso', {idEvento:id, usuario:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Caso creado: '+res.codigo);
    renderBandeja(); actualizarBadgeBandeja_();
  });
}
function descartarEvento_(id, ev){
  ev.stopPropagation();
  if(!confirm('¿Descartar este evento? No se va a crear un caso.')) return;
  gasPost('descartarEvento', {idEvento:id, motivo:'Descartado desde la Bandeja de entrada.'}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Evento descartado');
    renderBandeja(); actualizarBadgeBandeja_();
  });
}

var filtroCasos_ = {};
function renderCasos(){
  var html = '<div class="filter-bar">'+
    '<select id="fEstado" onchange="aplicarFiltrosCasos_()"><option value="">Todos los estados</option>'+
      ['nuevo','analisis','esperando','derivado','resuelto','cerrado'].map(function(e){return '<option value="'+e+'">'+e+'</option>';}).join('')+
    '</select>'+
    '<select id="fPrioridad" onchange="aplicarFiltrosCasos_()"><option value="">Toda prioridad</option><option>Alta</option><option>Media</option><option>Baja</option></select>'+
    '<select id="fFuente" onchange="aplicarFiltrosCasos_()"><option value="">Toda fuente</option></select>'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);"><input type="checkbox" id="fDefensa" onchange="aplicarFiltrosCasos_()"> ⚖️ Solo Defensa del Consumidor</label>'+
    '<input id="fBusqueda" type="text" placeholder="Buscar por cliente, VIN..." oninput="aplicarFiltrosCasos_()">'+
  '</div><div class="panel"><div id="tablaCasos"><div class="empty-state">Cargando…</div></div></div>';
  document.getElementById('content').innerHTML = html;
  cargarYPintarCasos_();
}
function cargarYPintarCasos_(){
  gasGet('casos').then(function(res){
    if(!res.ok){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    window._casosCache = res.casos || res || [];
    var selFuente = document.getElementById('fFuente');
    var fuentes = Array.from(new Set(window._casosCache.map(function(c){return c.fuente;}).filter(Boolean)));
    fuentes.forEach(function(f){ var opt=document.createElement('option'); opt.value=f; opt.textContent=f; selFuente.appendChild(opt); });
    pintarTablaCasos_();
  });
}
function aplicarFiltrosCasos_(){ pintarTablaCasos_(); }
function pintarTablaCasos_(){
  var estado = document.getElementById('fEstado').value;
  var prioridad = document.getElementById('fPrioridad').value;
  var fuente = document.getElementById('fFuente').value;
  var soloDefensa = document.getElementById('fDefensa').checked;
  var q = document.getElementById('fBusqueda').value.toLowerCase();
  var casos = (window._casosCache||[]).filter(function(c){
    if(estado && c.estado!==estado) return false;
    if(prioridad && c.prioridad!==prioridad) return false;
    if(fuente && c.fuente!==fuente) return false;
    if(soloDefensa && !(String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true)) return false;
    if(q){
      var texto = ((c.cliente||'')+' '+(c.dominio||'')+' '+(c.motivo||'')+' '+(c.id||'')).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  if(casos.length===0){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">No hay casos que coincidan.</div>'; return; }
  var filas = casos.map(function(c){
    var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
    return '<tr onclick="setView(\'detalle\',\''+c.id+'\')">'+
      '<td class="mono" style="color:var(--caso);font-weight:700;">'+c.id+(esDefensa?' ⚖️':'')+'</td>'+
      '<td>'+(c.cliente||'—')+'</td>'+
      '<td>'+(c.marca||'—')+'</td>'+
      '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
      '<td><span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span></td>'+
      '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
      '<td style="white-space:nowrap;">'+(c.fechaCreacion||'—')+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaCasos').innerHTML =
    '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Estado</th><th>Prioridad</th><th>Responsable</th><th>Creado</th></tr></thead><tbody>'+filas+'</tbody></table>';
}

      '</div>'+

      html += '<div class="panel"><div class="panel-head"><h3>Historial del vehículo (todos los casos)</h3></div><div class="timeline">'+
        c.timelineVin.map(function(t){ return '<div class="t-item"><div class="t-dot sistema"></div><div class="t-when">'+t.fecha+'</div><div><div class="t-what">'+t.tipoEvento+' — '+t.descripcion+'</div><div class="t-who">'+t.casoRelacionado+' · '+t.fuente+'</div></div></div>'; }).join('')+

function toggleAnalisisCausaRaiz_(casoId){
  var panel = document.getElementById('panelAnalisisCausaRaiz');
  var abierto = !panel.classList.contains('hidden');
  if(abierto){ panel.classList.add('hidden'); document.getElementById('btnToggleAnalisis').textContent = 'Ver / completar'; return; }
  panel.classList.remove('hidden');
  document.getElementById('btnToggleAnalisis').textContent = 'Ocultar';
  panel.innerHTML = '<div class="empty-state">Cargando…</div>';
  gasGet('analisisCausaRaiz', {casoId:casoId}).then(function(res){
    var a = (res.ok && res.analisis) || {};
    panel.innerHTML =

function panelChart_(canvasId, titulo, lista){

var _chartsGC_ = {};
function coloresGrafico_(){
  var css = getComputedStyle(document.body);
  return {
    caso: css.getPropertyValue('--caso').trim(), grid: css.getPropertyValue('--hairline').trim(),
    texto: css.getPropertyValue('--text-dim').trim()
  };
}
function dibujarBarras_(canvasId, lista){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'bar',
    data: { labels: lista.map(function(x){return x.valor;}), datasets: [{ data: lista.map(function(x){return x.cantidad;}), backgroundColor: c.caso, borderRadius: 5, maxBarThickness: 22 }] },
    options: {
      indexAxis: 'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ beginAtZero:true, ticks:{color:c.texto, precision:0}, grid:{color:c.grid} },
        y:{ ticks:{color:c.texto, font:{size:11}}, grid:{display:false} }
      }
    }
  });
}
function dibujarDonut_(canvasId, labels, datos, colores){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: datos, backgroundColor: colores, borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{color:c.texto, font:{size:11.5}, boxWidth:11, padding:14}}} }
  });
}

        '<div style="padding:14px 17px;font-size:12.5px;color:var(--text-dim);">'+
          (a.temas ? '<div style="margin-bottom:8px;"><b style="color:var(--text);">Temas:</b> '+a.temas+'</div>' : '')+
          (a.proximosPasos ? '<div style="margin-bottom:8px;"><b style="color:var(--text);">Próximos pasos:</b> '+a.proximosPasos+'</div>' : '')+
          (a.casosVinculados && a.casosVinculados.length ? '<div>'+a.casosVinculados.map(function(cid){ return '<span class="pill" style="background:var(--caso-soft);color:var(--caso);margin-right:6px;cursor:pointer;" onclick="setView(\'detalle\',\''+cid+'\')">'+cid+'</span>'; }).join('')+'</div>' : '')+
        '</div>'+
      '</div>';
    }).join('');
  });
}
function guardarActaUI_(){
  var s = sesionActual();
  var titulo = document.getElementById('actaTitulo').value.trim();
  if(!titulo){ showToast('Falta el título'); return; }
  gasPost('crearActa', {
    titulo: titulo,
    fecha: document.getElementById('actaFecha').value,
    asistentes: document.getElementById('actaAsistentes').value.trim(),
    temas: document.getElementById('actaTemas').value.trim(),
    proximosPasos: document.getElementById('actaProximosPasos').value.trim(),
    casosVinculados: document.getElementById('actaCasosVinculados').value.trim(),
    autor: s?s.nombre:''
  }).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Acta guardada'); document.getElementById('panelFormActa').classList.add('hidden');
    cargarYPintarActas_();
  });
}

function renderEquipo(){
  var s = sesionActual();
  if(!s || s.rol!=='calidad'){
    document.getElementById('content').innerHTML = '<div class="panel"><div class="empty-state">Esta pantalla es solo para el rol Calidad.</div></div>';
    return;
  }
  document.getElementById('content').innerHTML =
    '<div class="page-title" style="margin-bottom:2px;">Equipo</div>'+
    '<div class="page-sub" style="margin-bottom:16px;">Creá usuarios para poder asignarles o derivarles casos.</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:14px;">'+
      '<button class="btn btn-primary" style="width:auto;" onclick="abrirFormUsuario_()">+ Nuevo usuario</button>'+
      '<button class="btn btn-ghost" style="width:auto;" onclick="abrirFormImportar_()">Importar lista de nombres</button>'+
    '</div>'+
    '<div class="panel"><div id="tablaEquipo"><div class="empty-state">Cargando…</div></div></div>'+
    '<div class="panel hidden" id="panelFormUsuario"><div style="padding:18px;">'+
      '<h3 style="font-size:13px;margin-bottom:14px;" id="formUsuarioTitulo">Nuevo usuario</h3>'+
      '<div class="form-grid">'+
        campo_('Nombre completo','equNombre','text')+
        campo_('Usuario (para ingresar)','equUsuario','text')+
        campo_('Contraseña inicial','equPassword','password')+
        campoSelect_('Rol','equRol', '<option value="calidad">Calidad — acceso total</option><option value="sector">Sector — solo sus casos</option><option value="referente">Referente — solo ver, de su sector</option>')+
        campo_('Sector (ej: PDA, Postventa, Ventas)','equSector','text')+
        campo_('Email (opcional)','equEmail','email')+
      '</div>'+
      '<div style="display:flex;gap:8px;margin-top:14px;">'+
        '<button class="btn btn-primary" style="width:auto;" onclick="guardarUsuarioUI_()">Guardar</button>'+
        '<button class="btn btn-ghost" style="width:auto;" onclick="cerrarFormUsuario_()">Cancelar</button>'+
      '</div>'+
    '</div></div>'+
    '<div class="panel hidden" id="panelFormImportar"><div style="padding:18px;">'+
      '<h3 style="font-size:13px;margin-bottom:6px;">Importar lista de nombres</h3>'+
      '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:12px;">Un nombre por línea (opcional: "Nombre, Sector"). Se crean <b>sin acceso todavía</b> — sin contraseña utilizable — hasta que decidas activarlos y resetearles la contraseña desde la tabla de abajo. No se conecta en vivo con Planning ni ningún otro sistema: es solo para no tipear cada nombre a mano.</div>'+
      '<textarea id="importarNombres" placeholder="Juan Pérez, Ventas'+String.fromCharCode(10)+'María Gómez, PDA'+String.fromCharCode(10)+'Diego Suárez" style="width:100%;min-height:120px;padding:10px 12px;border:1.5px solid var(--hairline);border-radius:9px;font-size:12.5px;background:var(--panel-2);color:var(--text);font-family:inherit;resize:vertical;"></textarea>'+
      '<div style="display:flex;gap:8px;margin-top:14px;">'+
        '<button class="btn btn-primary" style="width:auto;" onclick="importarUsuariosUI_()">Importar</button>'+
        '<button class="btn btn-ghost" style="width:auto;" onclick="document.getElementById(\'panelFormImportar\').classList.add(\'hidden\')">Cancelar</button>'+
      '</div>'+
    '</div></div>';
  cargarYPintarEquipo_();
}
function cargarYPintarEquipo_(){
  var s = sesionActual();
  var pass = _passwordSesionActual_();
  if(!pass) return;
  gasPost('listarUsuarios', {actorUsuario:s.usuario, actorPassword:pass}).then(function(res){
    if(!res.ok){ document.getElementById('tablaEquipo').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    pintarTablaEquipo_(res.usuarios||[]);
  });
}
function abrirFormUsuario_(usuarioExistente){
  document.getElementById('panelFormImportar').classList.add('hidden');
  document.getElementById('panelFormUsuario').classList.remove('hidden');
  document.getElementById('formUsuarioTitulo').textContent = usuarioExistente ? 'Editar usuario' : 'Nuevo usuario';
  document.getElementById('equNombre').value = usuarioExistente ? usuarioExistente.nombre : '';
  document.getElementById('equUsuario').value = usuarioExistente ? usuarioExistente.usuario : '';
  document.getElementById('equUsuario').disabled = !!usuarioExistente;
  document.getElementById('equPassword').value = '';
  document.getElementById('equPassword').placeholder = usuarioExistente ? '(dejar vacío para no cambiarla — próximamente)' : '';
  document.getElementById('equRol').value = usuarioExistente ? usuarioExistente.rol : 'sector';
  document.getElementById('equSector').value = usuarioExistente ? (usuarioExistente.sector||'') : '';
  document.getElementById('equEmail').value = usuarioExistente ? (usuarioExistente.email||'') : '';
  window._equipoEditando = usuarioExistente ? usuarioExistente.usuario : null;
}
function cerrarFormUsuario_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
}
function abrirFormImportar_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
  document.getElementById('panelFormImportar').classList.remove('hidden');
  document.getElementById('importarNombres').value = '';
}
function importarUsuariosUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  if(!actorPassword) return;
  var texto = document.getElementById('importarNombres').value.trim();
  if(!texto){ showToast('Pegá al menos un nombre'); return; }
  var lineas = texto.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  gasPost('importarUsuarios', {actorUsuario:s.usuario, actorPassword:actorPassword, nombres:lineas}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    var creados = res.creados||[], omitidos = res.omitidos||[];
    showToast(creados.length+' usuario(s) importado(s), sin acceso todavía'+(omitidos.length?' — '+omitidos.length+' omitido(s)':''));
    document.getElementById('panelFormImportar').classList.add('hidden');
    renderEquipo();
  });
}
function guardarUsuarioUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  var nombre = document.getElementById('equNombre').value.trim();
  var usuario = document.getElementById('equUsuario').value.trim();
  var rol = document.getElementById('equRol').value;
  var sector = document.getElementById('equSector').value.trim();
  var email = document.getElementById('equEmail').value.trim();
  if(!nombre || !usuario){ showToast('Falta nombre o usuario'); return; }

  if(window._equipoEditando){
    gasPost('editarUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, usuarioObjetivo:window._equipoEditando, nombre:nombre, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      showToast('Usuario actualizado'); cerrarFormUsuario_(); renderEquipo();
    });
  } else {
    var password = document.getElementById('equPassword').value;
    if(!password || password.length<4){ showToast('La contraseña tiene que tener al menos 4 caracteres'); return; }
    gasPost('crearUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, nombre:nombre, usuario:usuario, password:password, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      showToast('Usuario creado'); cerrarFormUsuario_(); renderEquipo();
    });
  }
}
function cambiarActivoUsuarioUI_(usuario, activo){
  var s = sesionActual();
  gasPost('desactivarUsuario', {actorUsuario:s.usuario, actorPassword:_passwordSesionActual_(), usuarioObjetivo:usuario, activo:activo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast(activo?'Usuario activado':'Usuario desactivado'); renderEquipo();
  });
}
function pintarTablaEquipo_(usuarios){
  var etiquetasRol = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  var filas = usuarios.map(function(u){
    return '<tr style="cursor:default;">'+
      '<td>'+u.nombre+'</td>'+
      '<td class="mono">'+u.usuario+'</td>'+
      '<td>'+(etiquetasRol[u.rol]||u.rol)+'</td>'+
      '<td>'+(u.sector||'—')+'</td>'+
      '<td>'+(u.email||'—')+'</td>'+
      '<td>'+(u.activo ? '<span class="pill pill-resuelto">Activo</span>' : '<span class="pill pill-cerrado">Inactivo</span>')+'</td>'+
      '<td style="white-space:nowrap;">'+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick=\'abrirFormUsuario_('+JSON.stringify(u)+')\'>Editar</button> '+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="cambiarActivoUsuarioUI_(\''+u.usuario+'\','+(!u.activo)+')">'+(u.activo?'Desactivar':'Activar')+'</button>'+
      '</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaEquipo').innerHTML = usuarios.length ?
    '<table class="tbl"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Sector</th><th>Email</th><th>Estado</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>' :
    '<div class="empty-state">No hay usuarios cargados.</div>';
}

var CONFIG_EDITABLES_ = {
  SLA_HORAS_ALTA: {label:'SLA — Prioridad Alta (horas)', tipo:'number'},
  SLA_HORAS_MEDIA: {label:'SLA — Prioridad Media (horas)', tipo:'number'},
  SLA_HORAS_BAJA: {label:'SLA — Prioridad Baja (horas)', tipo:'number'},
  NOTIFICAR_EMAIL_CASO_NUEVO: {label:'Email para avisos de casos nuevos', tipo:'email'}
};
var CONFIG_SOLO_LECTURA_ = ['CONTADOR_CASOS','CONTADOR_EVENTOS','CONTADOR_SEGUIMIENTOS','CONTADOR_TIMELINE'];

function renderConfig(){
  gasGet('config').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    window._configCache = res.config||{};
    window._catalogosCache = res.catalogos||{};
    pintarConfig_();
  });
}
function pintarConfig_(){
  var cat = window._catalogosCache||{};
  var conf = window._configCache||{};
  var tabActiva = window._configTabActiva || 'catalogos';

  var html = '<div class="filter-bar" style="margin-bottom:16px;">'+
    tabBtn_('catalogos','Catálogos',tabActiva)+
    tabBtn_('parametros','Parámetros y SLA',tabActiva)+
    tabBtn_('automatizacion','Automatización',tabActiva)+
  '</div>';

  if(tabActiva==='catalogos'){
    html += '<div class="panel"><div class="panel-head"><h3>Catálogos — listas desplegables del sistema</h3></div><div style="padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;">';
    Object.keys(cat).forEach(function(nombre){
      html += '<div>'+
        '<div style="font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:8px;">'+nombre+'</div>'+
        cat[nombre].map(function(v){
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding:4px 0;">'+
            '<span>'+v+'</span>'+
            '<button onclick="eliminarCatalogoItemUI_(\''+nombre+'\',\''+String(v).replace(/'/g,"\\'")+'\')" title="Quitar" style="background:none;border:none;color:var(--text-faint);cursor:pointer;padding:2px;"><span class="material-symbols-outlined" style="font-size:14px;">close</span></button>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;gap:6px;margin-top:8px;">'+
          '<input type="text" id="nuevoItem_'+nombre+'" placeholder="Agregar..." style="flex:1;min-width:0;padding:6px 8px;border:1.5px solid var(--hairline);border-radius:7px;font-size:11.5px;background:var(--panel-2);color:var(--text);" onkeydown="if(event.key===\'Enter\')agregarCatalogoItemUI_(\''+nombre+'\')">'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;padding:6px 10px;" onclick="agregarCatalogoItemUI_(\''+nombre+'\')">+</button>'+
        '</div>'+
      '</div>';
    });
    html += '</div></div>';
  }

  if(tabActiva==='parametros'){
    html += '<div class="panel"><div class="panel-head"><h3>SLA por prioridad y avisos</h3></div><div style="padding:16px 18px;">'+
      '<div class="form-grid">'+
      Object.keys(CONFIG_EDITABLES_).map(function(k){
        var def = CONFIG_EDITABLES_[k];
        return '<div class="field"><label>'+def.label+'</label>'+
          '<div style="display:flex;gap:6px;">'+
          '<input type="'+def.tipo+'" id="conf_'+k+'" value="'+(conf[k]!==undefined?conf[k]:'')+'" style="flex:1;">'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="guardarConfigParamUI_(\''+k+'\')">Guardar</button>'+
          '</div></div>';
      }).join('')+
      '</div>'+
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);font-size:11px;color:var(--text-faint);">'+
        'Contadores internos (no editables): '+CONFIG_SOLO_LECTURA_.map(function(k){ return k+' = '+(conf[k]!==undefined?conf[k]:0); }).join(' · ')+
      '</div>'+
    '</div></div>';
  }

  if(tabActiva==='automatizacion'){
    html += '<div class="panel"><div class="panel-head"><h3>Motor de Eventos</h3></div><div style="padding:16px 18px;">'+
      '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px;">Creación automática de casos desde eventos (Etapa 2) — hoy está <b style="color:'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true'?'var(--ok)':'var(--warn)')+';">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true'?'ACTIVADA':'APAGADA')+'</b>.</div>'+
      '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px;">Apagada = todo pasa por la Bandeja de entrada para confirmar a mano antes de crear el caso. Activada = el caso se crea solo apenas llega el evento.</div>'+
      '<button class="btn btn-dark btn-sm" style="width:auto;" onclick="toggleCreacionAutomaticaUI_()">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true' ? 'Apagar creación automática' : 'Activar creación automática')+'</button>'+
    '</div></div>';
  }

  document.getElementById('content').innerHTML = html;
}
function tabBtn_(id, label, activa){
  var esActiva = id===activa;
  return '<button class="btn '+(esActiva?'btn-dark':'btn-ghost')+' btn-sm" style="width:auto;'+(esActiva?'border-color:var(--caso);color:var(--caso);':'')+'" onclick="window._configTabActiva=\''+id+'\';pintarConfig_();">'+label+'</button>';
}
function agregarCatalogoItemUI_(nombre){
  var input = document.getElementById('nuevoItem_'+nombre);
  var valor = input.value.trim();
  if(!valor) return;
  gasPost('agregarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    if(!window._catalogosCache[nombre]) window._catalogosCache[nombre]=[];
    window._catalogosCache[nombre].push(valor);
    pintarConfig_();
    showToast('Agregado a '+nombre);
  });
}
function eliminarCatalogoItemUI_(nombre, valor){
  if(!confirm('¿Quitar "'+valor+'" de '+nombre+'?')) return;
  gasPost('eliminarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._catalogosCache[nombre] = window._catalogosCache[nombre].filter(function(v){return v!==valor;});
    pintarConfig_();
    showToast('Quitado de '+nombre);
  });
}
function guardarConfigParamUI_(clave){
  var valor = document.getElementById('conf_'+clave).value;
  gasPost('actualizarConfig', {clave:clave, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache[clave] = valor;
    showToast('Guardado');
  });
}
function toggleCreacionAutomaticaUI_(){
  var actual = String(window._configCache.CREAR_CASOS_AUTOMATICO)==='true';
  var nuevo = !actual;
  var msg = nuevo
    ? '¿Activar la creación automática de casos? A partir de ahora, los eventos van a crear el caso solos, sin pasar por la Bandeja de entrada.'
    : '¿Apagar la creación automática? Los eventos van a volver a esperar confirmación manual en la Bandeja de entrada.';
  if(!confirm(msg)) return;
  gasPost('actualizarConfig', {clave:'CREAR_CASOS_AUTOMATICO', valor:nuevo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache.CREAR_CASOS_AUTOMATICO = nuevo;
    pintarConfig_();
    showToast(nuevo ? 'Creación automática activada' : 'Creación automática apagada');
  });
}
</script>
</body>
</html>
