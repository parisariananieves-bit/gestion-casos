<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestión de Casos · Grupo París</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  /* Paleta exacta del prototipo aprobado (paris-calidad-gestion-casos) —
     mismos NOMBRES de variable que ya usa todo el JS de acá (--bg, --panel,
     --caso, etc.), pero con los valores de ese diseño en vez de los
     nuestros. Así no hace falta tocar ni una línea de la lógica/render. */
  --ink:#0C0D10; --ink-soft:#15171C;
  --bg:#FAFAFB; --panel:#FFFFFF; --panel-2:#FAFAFB; --hairline:#E1E3EA;
  --text:#0C0D10; --text-dim:#4E515D; --text-faint:#9DA0AC;
  --ok:#0F9D58; --ok-soft:#E8F7EF;
  --warn:#D97706; --warn-soft:#FDF3E3;
  --danger:#DC2626; --danger-soft:#FDECEC;
  --pending:#9DA0AC; --pending-soft:#F3F4F7;
  --purple:#7C3AED; --purple-soft:#F2ECFE;
  --caso:#2563EB; --caso-soft:#EFF4FF; --caso-deep:#1D4ED8; --caso-bright:#3B82F6;
  --accent: var(--caso); --accent-soft: var(--caso-soft);
  --radius-s:9px; --radius-m:14px; --radius-l:22px;
  --shadow-1:0 1px 2px rgba(15,17,22,.05), 0 1px 1px rgba(15,17,22,.04);
  --shadow-2:0 14px 32px -8px rgba(15,17,22,.16), 0 4px 10px -4px rgba(15,17,22,.08);
  --sidebar-w:196px; --topbar-h:60px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.45;}
.mono{font-family:'JetBrains Mono',monospace;}
.hidden{display:none !important;}
.view:not(.hidden){animation:viewIn .28s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--caso); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
::selection{background:var(--caso-soft); color:var(--text);}

/* LOGIN — igual al prototipo: fondo oscuro con halo, tarjeta blanca centrada */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(1200px 800px at 15% 100%, #16181D 0%, var(--ink) 55%); position:relative; overflow:hidden;}
#login-screen::before{content:""; position:absolute; inset:0; background:radial-gradient(700px 500px at 82% 18%, rgba(37,99,235,.32), transparent 60%), radial-gradient(500px 400px at 8% 85%, rgba(124,58,237,.14), transparent 60%);}
.login-card{position:relative; z-index:2; width:380px; background:#fff; border-radius:var(--radius-l); padding:40px 36px 32px; box-shadow:0 40px 90px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);}
.login-mark{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
.login-mark .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--caso-bright),var(--caso-deep));flex-shrink:0;}
.login-mark span{font-weight:800; letter-spacing:-.02em; font-size:16px; display:block; color:var(--text);}
.login-mark small{display:block; font-size:10.5px; color:var(--text-faint); letter-spacing:.06em; text-transform:uppercase; margin-top:1px;}
.login-card h1{font-size:19px; font-weight:700; margin-bottom:4px; color:var(--text);}
.login-card p.sub{color:var(--text-faint); font-size:12.8px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); font-size:13.5px; font-family:inherit; background:var(--panel-2); color:var(--text); transition:border-color .15s, box-shadow .15s;}
.field input::placeholder, .field textarea::placeholder{color:var(--text-faint);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--caso); box-shadow:0 0 0 3px var(--caso-soft); background:#fff; outline:none;}
.field textarea{resize:vertical; min-height:80px;}
.btn{border:none; border-radius:var(--radius-s); font-weight:650; font-size:13.5px; padding:11px 16px; transition:transform .14s, box-shadow .18s, filter .15s; display:inline-flex; align-items:center; justify-content:center; gap:7px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg, var(--caso-bright), var(--caso-deep)); color:#fff; width:100%; box-shadow:0 4px 12px -3px rgba(37,99,235,.45);}
.btn-primary:hover{filter:brightness(1.07); box-shadow:0 10px 24px -6px rgba(37,99,235,.4); transform:translateY(-1px);}
.btn-ghost{background:transparent; color:var(--text-dim); border:1.5px solid var(--hairline);}
.btn-ghost:hover{border-color:var(--caso); color:var(--caso-deep); background:var(--caso-soft);}
.btn-dark{background:linear-gradient(135deg, #24262C, var(--ink)); color:#fff; box-shadow:0 4px 12px -4px rgba(12,13,16,.4);}
.btn-dark:hover{filter:brightness(1.25); transform:translateY(-1px);}
.btn-sm{padding:8px 13px; font-size:12.5px;}
.login-error{background:var(--danger-soft); color:var(--danger); border-radius:var(--radius-s); padding:9px 12px; font-size:12.5px; margin-bottom:14px; display:none;}
.login-foot{margin-top:18px; text-align:center; font-size:11px; color:var(--text-faint);}

/* SHELL — sidebar oscuro fijo, contenido claro (mismo criterio que el prototipo) */
#app{display:flex; min-height:100vh;}
.sidebar{width:var(--sidebar-w); flex-shrink:0; background:linear-gradient(180deg, var(--ink-soft) 0%, var(--ink) 100%); color:#fff; display:flex; flex-direction:column; padding:14px 10px; position:sticky; top:0; height:100vh; box-shadow:4px 0 24px rgba(0,0,0,.18); z-index:25; transition:transform .22s ease;}
.brand{display:flex; align-items:center; gap:8px; padding:4px 6px 14px;}
.brand .dot{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--caso-bright),var(--caso-deep));flex-shrink:0;}
.brand strong{font-size:13px; font-weight:800; letter-spacing:-.015em; display:block;}
.brand small{display:block; font-size:8.7px; color:#8E92A0; letter-spacing:.08em; text-transform:uppercase;}
.nav-item{display:flex; align-items:center; gap:9px; padding:7.5px 9px; border-radius:8px; color:#B8BAC5; font-size:12.4px; font-weight:550; margin-bottom:1px; transition:background .16s,color .16s; width:100%; text-align:left; background:none; border:none; position:relative;}
.nav-item .material-symbols-outlined{font-size:15.5px; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(135deg, var(--caso) 0%, var(--caso-deep) 100%); color:#fff; box-shadow:0 6px 16px -4px rgba(37,99,235,.55);}
.nav-item .badge-count{margin-left:auto; background:rgba(255,255,255,.12); color:#fff; font-size:9.5px; padding:1px 6px; border-radius:20px; font-weight:650;}
.nav-item.active .badge-count{background:rgba(255,255,255,.25);}
.sidebar-foot{margin-top:auto; border-top:1px solid rgba(255,255,255,.08); padding-top:9px;}
.user-chip{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px; cursor:pointer;}
.user-chip:hover{background:rgba(255,255,255,.06);}
.avatar{width:25px; height:25px; border-radius:50%; background:linear-gradient(135deg, var(--caso-bright), var(--caso-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:10.5px; flex-shrink:0;}
.user-chip .name{font-size:11.8px; font-weight:600; color:#fff;}
.user-chip .role{font-size:9.6px; color:#8E92A0;}
.sidebar-scroll{overflow-y:auto; flex:1; min-height:0;}
.sidebar-overlay{display:none;}

.main{flex:1; min-width:0;}
.topbar{height:var(--topbar-h); border-bottom:1px solid var(--hairline); background:rgba(255,255,255,.86); backdrop-filter:blur(10px); display:flex; align-items:center; padding:0 22px; gap:14px; position:sticky; top:0; z-index:20; box-shadow:0 1px 0 rgba(15,17,22,.03);}
.topbar h1{font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--text);}
.topbar .sub{font-size:11.5px; color:var(--text-faint); font-weight:600;}
.menu-toggle{display:none; background:none; border:none; color:var(--text); padding:4px; margin-right:2px; border-radius:8px; cursor:pointer;}
.menu-toggle .material-symbols-outlined{font-size:22px;}
.topbar-search{position:relative; flex:1; max-width:420px;}
.topbar-search .material-symbols-outlined{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-faint); pointer-events:none;}
.topbar-search input{width:100%; padding:8px 12px 8px 34px; border:1.5px solid var(--hairline); border-radius:20px; font-size:12.6px; background:var(--panel-2); color:var(--text); transition:border-color .15s, box-shadow .15s, background .15s;}
.topbar-search input:focus{border-color:var(--caso); box-shadow:0 0 0 3px var(--caso-soft); background:#fff; outline:none;}
.live-dot{width:6px; height:6px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; opacity:0; transition:opacity .2s;}
.live-dot.show{opacity:1; animation:pulseDot 1s ease infinite;}
@keyframes pulseDot{0%,100%{opacity:.4;} 50%{opacity:1;}}
.content{padding:20px 24px 60px; max-width:1320px;}

/* RESPONSIVE — sidebar se convierte en panel deslizable en pantallas chicas */
@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); z-index:60; width:220px;}
  .sidebar.open{transform:translateX(0); box-shadow:12px 0 40px rgba(0,0,0,.35);}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(12,13,16,.45); z-index:50;}
  .sidebar-overlay.show{display:block;}
  .menu-toggle{display:inline-flex; align-items:center; justify-content:center;}
  .topbar{padding:0 14px; gap:10px;}
  .topbar-search{max-width:none;}
  .content{padding:14px 12px 50px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr) !important;}
  .filter-bar{gap:6px;}
  .filter-bar select, .filter-bar input{flex:1 1 46%; font-size:12.5px;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.tbl{min-width:640px;}
  .info-strip{gap:12px 18px;}
}
@media (max-width:520px){
  .kpi-grid{grid-template-columns:1fr 1fr !important; gap:9px;}
  .topbar h1{font-size:13.5px;}
  .topbar .sub{display:none;}
}
.page-title{font-size:22px; font-weight:800; letter-spacing:-.02em; color:var(--text);}
.page-sub{font-size:13px; color:var(--text-faint); margin-top:3px;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:14px; margin-bottom:22px;}
.kpi-card{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:18px 18px 16px; box-shadow:var(--shadow-1); transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s;}
.kpi-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-2);}
.kpi-num{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:800; letter-spacing:-.02em;}
.kpi-label{font-size:11.6px; color:var(--text-faint); font-weight:600; margin-top:3px;}

.panel{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); box-shadow:var(--shadow-1); margin-bottom:16px; overflow:hidden;}
.panel-head{padding:15px 18px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-size:13.5px; font-weight:700; color:var(--text); letter-spacing:-.005em;}
.panel-body{padding:16px 18px;}

.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:13px; align-items:center;}
.filter-bar select, .filter-bar input{padding:8px 11px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); font-size:12px; background:var(--panel); color:var(--text);}
.filter-bar input::placeholder{color:var(--text-faint);}
.filter-bar .flabel{font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-right:-4px;}
.filter-bar .fclear{margin-left:auto; font-size:11.5px; color:var(--caso); font-weight:650; background:none; border:none; cursor:pointer; padding:6px 4px;}
.table-wrap{overflow-x:auto;}
.vin-group{border:1px solid var(--hairline); border-radius:var(--radius-m); margin-bottom:14px; overflow:hidden; background:var(--panel);}
.vin-group-head{display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--panel-2); cursor:pointer;}
.vin-group-head:hover{background:var(--caso-soft);}
.vin-group-head .vgh-main{flex:1; min-width:0;}
.vin-group-head .vgh-vin{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; color:var(--caso-deep);}
.vin-group-head .vgh-cliente{font-size:12.5px; color:var(--text-dim); margin-top:1px;}
.vin-group-count{background:var(--caso-soft); color:var(--caso-deep); font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; flex-shrink:0;}
.vin-group-body{border-top:1px solid var(--hairline);}
.vin-case-row{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--hairline); cursor:pointer;}
.vin-case-row:last-child{border-bottom:none;}
.vin-case-row:hover{background:var(--panel-2);}
.vin-case-row .vc-id{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--caso); font-size:12px; width:88px; flex-shrink:0;}
.vin-case-row .vc-motivo{flex:1; min-width:0; font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.vin-case-row .vc-fecha{font-size:11px; color:var(--text-faint); flex-shrink:0; white-space:nowrap;}
.updating-pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-faint); font-weight:650; margin-bottom:10px; opacity:0; transition:opacity .2s;}
.updating-pill.show{opacity:1;}
.updating-pill .spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--hairline);border-top-color:var(--caso);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

table.tbl{width:100%; border-collapse:collapse; font-size:12.4px; background:var(--panel);}
table.tbl th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:11px 15px; background:var(--panel-2); border-bottom:1px solid var(--hairline); font-weight:700;}
table.tbl td{padding:11px 15px; border-bottom:1px solid var(--hairline); color:var(--text-dim);}
table.tbl tr{cursor:pointer;}
table.tbl tr:hover td{background:var(--panel-2);}

/* PILLS — mismos colores que el prototipo (pill-new/pending/progress/resolved) */
.pill{display:inline-flex; align-items:center; gap:5px; padding:4.5px 11px; border-radius:20px; font-size:11px; font-weight:650; letter-spacing:-.005em;}
.pill::before{content:""; width:6px; height:6px; border-radius:50%;}
.pill-nuevo{background:var(--caso-soft); color:var(--caso-deep);} .pill-nuevo::before{background:var(--caso);}
.pill-analisis{background:#EEF2FF; color:#4338CA;} .pill-analisis::before{background:#6366F1;}
.pill-esperando{background:var(--warn-soft); color:#8A5A05;} .pill-esperando::before{background:var(--warn);}
.pill-derivado{background:var(--purple-soft); color:#6D28D9;} .pill-derivado::before{background:var(--purple);}
.pill-resuelto{background:var(--ok-soft); color:#0B7A44;} .pill-resuelto::before{background:var(--ok);}
.pill-cerrado{background:var(--pending-soft); color:var(--text-dim);} .pill-cerrado::before{background:var(--text-faint);}
.prio{font-size:10.6px; font-weight:700; padding:3px 9px; border-radius:6px;}
.prio-Alta{background:var(--danger-soft); color:var(--danger);}
.prio-Media{background:var(--warn-soft); color:var(--warn);}
.prio-Baja{background:var(--pending-soft); color:var(--text-dim);}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:12.5px;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:12.3px; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.3); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

/* Detalle de caso */
.detail-header{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-l); padding:20px 22px; margin-bottom:14px; box-shadow:var(--shadow-1);}
.dh-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
.dh-id{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-faint); font-weight:650;}
.dh-title{font-size:18px; font-weight:800; letter-spacing:-.01em; margin-top:2px; color:var(--text);}
.info-strip{display:flex; gap:22px; flex-wrap:wrap; border-top:1px solid var(--hairline); padding-top:12px;}
.info-item{font-size:12.2px;}
.info-item span{display:block; color:var(--text-faint); font-size:10.3px; text-transform:uppercase; letter-spacing:.05em; font-weight:650; margin-bottom:3px;}
.info-item b{font-size:12.6px; color:var(--text); font-weight:650;}
.action-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.action-row select{background:var(--panel-2); color:var(--text); border:1.5px solid var(--hairline);}

.detail-grid{display:grid; grid-template-columns:1fr 300px; gap:16px;}
@media(max-width:900px){ .detail-grid{grid-template-columns:1fr;} }

.timeline{padding:14px 18px 14px 30px; position:relative;}
.timeline::before{content:""; position:absolute; left:26px; top:18px; bottom:14px; width:2px; background:var(--hairline);}
.t-item{display:grid; grid-template-columns:16px 96px 1fr; gap:12px; padding:9px 0; align-items:start; position:relative;}
.t-dot{width:11px; height:11px; border-radius:50%; background:#fff; border:2.2px solid var(--caso); margin-top:2px; z-index:1;}
.t-dot.sistema{border-color:var(--text-faint);}
.t-dot.comentario{background:var(--caso); border-color:var(--caso);}
.t-dot.cambio_estado{background:var(--warn); border-color:var(--warn);}
.t-dot.asignacion{background:var(--purple); border-color:var(--purple);}
.t-dot.cambio_prioridad{background:var(--danger); border-color:var(--danger);}
.t-when{font-size:10.5px; color:var(--text-faint); font-weight:600; padding-top:1px;}
.t-what{font-size:12.4px; font-weight:600; color:var(--text);}
.t-who{font-size:11.2px; color:var(--text-faint); margin-top:1px;}

.side-block{background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-m); padding:15px 17px; margin-bottom:12px; box-shadow:var(--shadow-1);}
.side-block h4{font-size:11.6px; font-weight:700; margin-bottom:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);}
.comment-box textarea{width:100%; min-height:56px; border:1.5px solid var(--hairline); border-radius:var(--radius-s); padding:9px 11px; font-size:12.2px; font-family:inherit; resize:vertical; background:var(--panel-2); color:var(--text);}
.checkbox-row{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:11.5px; color:var(--text-dim);}

.alert-box{display:flex; gap:11px; align-items:flex-start; background:var(--caso-soft); border:1.5px solid #BFD3FE; border-radius:var(--radius-m); padding:13px 15px; margin-bottom:18px; font-size:11.8px; color:var(--caso-deep);}
.alert-box.purple{background:var(--purple-soft); border-color:#DDCBFB; color:#4C1D95;}
.alert-box a{color:inherit;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:15px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:700px){ .form-grid{grid-template-columns:1fr;} }

.overlay{position:fixed; inset:0; background:rgba(17,17,17,.55); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .18s; z-index:70;}
.overlay.show{opacity:1; pointer-events:auto;}
.modal{position:fixed; top:50%; left:50%; transform:translateY(10px) translate(-50%,-50%) scale(.98); width:min(600px,92vw); max-height:88vh; overflow-y:auto; background:#fff; border-radius:var(--radius-l); box-shadow:0 30px 80px rgba(0,0,0,.35); z-index:76; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;}

<script>
// ============================================================
// CONEXIÓN CON EL BACKEND — mismo patrón que Planning de Entregas:
// la URL de Apps Script se lee de una variable de entorno de Vercel
// (VITE_API_URL) a través de /api/config, nunca se pide ni se guarda
// hardcodeada acá. Ver api/config.js.
// ============================================================
var API_URL = null;

function cargarConfigBackend(){
  return fetch('/api/config').then(function(r){
    if(!r.ok) throw new Error('config no disponible');
    return r.json();
  }).then(function(cfg){
    if(!cfg || !cfg.apiUrl) throw new Error('API_URL no configurada');
    API_URL = cfg.apiUrl;
    return API_URL;
  });
}
function gasGet(action, params){
  params = params || {};
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function(k){ if(params[k]!==undefined && params[k]!==null) url += '&'+k+'='+encodeURIComponent(params[k]); });
  return fetch(url).then(function(r){ return r.json(); });
}
function gasPost(action, params){
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:action, params:params||{}})
  }).then(function(r){ return r.json(); });
}

// ============================================================
// SESIÓN
// ============================================================
function sesionActual(){
  try{ return JSON.parse(localStorage.getItem('gc_sesion')||'null'); }catch(e){ return null; }
}
function guardarSesion(s){ localStorage.setItem('gc_sesion', JSON.stringify(s)); }
function cerrarSesion(){ localStorage.removeItem('gc_sesion'); location.reload(); }
function _passwordSesionActual_(){
  var s = sesionActual();
  if(s && s.password) return s.password;
  showToast('Cerrá sesión y volvé a entrar una vez para poder usar Equipo.');
  return null;
}

function intentarLogin(){
  var usuario = document.getElementById('loginUsuario').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('btnLogin');
  errEl.style.display = 'none';
  if(!usuario || !password){ errEl.textContent='Completá usuario y contraseña.'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  cargarConfigBackend().then(function(){
    return gasPost('login', {usuario:usuario, password:password});
  }).then(function(res){
    btn.disabled = false; btn.textContent = 'Ingresar';
    if(!res.ok){ errEl.textContent = res.error||'No se pudo ingresar.'; errEl.style.display='block'; return; }
    // Guardamos la contraseña junto con la sesión (mismo criterio que ya usa
    // Planning) porque las acciones de Equipo (crear/editar/desactivar
    // usuarios) requieren re-confirmar credenciales de Calidad en cada
    // llamada al backend, y no queremos pedírsela de nuevo a cada rato.
    res.password = password;
    guardarSesion(res);
    iniciarApp();
  }).catch(function(err){
    btn.disabled = false; btn.textContent = 'Ingresar';
    errEl.textContent = 'No se pudo conectar con el backend. ('+err.message+')';
    errEl.style.display = 'block';
  });
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ============================================================
// ARRANQUE
// ============================================================
window.addEventListener('DOMContentLoaded', function(){
  var s = sesionActual();
  if(s){ iniciarApp(); }
});

function iniciarApp(){
  var s = sesionActual();
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userNombre').textContent = s.nombre;
  document.getElementById('userRol').textContent = etiquetaRol_(s.rol);
  document.getElementById('userAvatar').textContent = (s.nombre||'?').charAt(0).toUpperCase();
  document.getElementById('navEquipo').style.display = (s.rol==='calidad') ? '' : 'none';
  document.getElementById('navConfig').style.display = (s.rol==='calidad') ? '' : 'none';
  cargarConfigBackend().then(function(){
    setView('dashboard'); // renderDashboard ya actualiza el contador de la Bandeja con el mismo pedido — no hace falta pedirlo dos veces.
  }).catch(function(err){
    document.getElementById('content').innerHTML = '<div class="empty-state">No se pudo conectar con el backend.<br>'+err.message+'</div>';
  });
}
function etiquetaRol_(r){
  var mapa = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  return mapa[r] || r;
}

// ============================================================
// SIDEBAR MÓVIL + BÚSQUEDA GLOBAL (arriba de todo, en el topbar)
// ============================================================
function toggleSidebar_(force){
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebarOverlay');
  var open = (force!==undefined) ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}
function ejecutarBusquedaGlobal_(){
  var q = document.getElementById('topSearch').value.trim();
  if(!q) return;
  window._pendingSearchQuery = q;
  setView('buscar');
  toggleSidebar_(false);
}
function marcarLive_(on){
  var dot = document.getElementById('liveDot');
  if(dot) dot.classList.toggle('show', !!on);
}

// ============================================================
// NAVEGACIÓN
// ============================================================
var VISTAS = ['dashboard','bandeja','casos','buscar','reportar','reportes','defensa','actas','equipo','config','detalle'];
var TITULOS = {
  dashboard:['Dashboard','Estado general de los casos'],
  bandeja:['Bandeja de entrada','Eventos esperando revisión antes de convertirse en caso'],
  casos:['Casos','Todos los casos registrados'],
  buscar:['Buscar cliente / VIN','Historial completo de un cliente o vehículo'],
  reportar:['Reportar un caso','Carga manual — queda igual que cualquier otro caso'],
  reportes:['Reportes','Cuánto se resuelve, de dónde viene y qué se repite'],
  defensa:['Defensa del Consumidor','Seguimiento diferenciado, sin mezclarse con el resto'],
  actas:['Actas de reunión','Minutas de las reuniones del equipo'],
  equipo:['Equipo','Quiénes pueden gestionar y seguir casos'],
  config:['Configuración','Catálogos y parámetros del sistema'],
  detalle:['Detalle del caso','']
};

function setView(v, param){
  window._vistaActual = v; window._vistaActualParam = param;
  VISTAS.forEach(function(x){
    var nav = document.getElementById('nav'+x.charAt(0).toUpperCase()+x.slice(1));
    if(nav) nav.classList.toggle('active', x===v);
  });
  document.getElementById('topbarTitulo').textContent = TITULOS[v][0];
  document.getElementById('topbarSub').textContent = TITULOS[v][1];
  var render = {
    dashboard: renderDashboard,
    bandeja: renderBandeja,
    casos: renderCasos,
    buscar: renderBuscar,
    reportar: renderReportar,
    reportes: renderReportes,
    defensa: renderDefensaConsumidor,
    actas: renderActas,
    equipo: renderEquipo,
    config: renderConfig,
    detalle: function(){ renderDetalle(param); }
  }[v];
  document.getElementById('content').innerHTML = '<div class="empty-state">Cargando…</div>';
  if(render) render();
}
function refrescarVistaActual_(){
  if(!window._vistaActual) return;
  ['dashboard','casos','eventosPendientes'].forEach(function(k){ guardarCache_(k, null); });
  window._casosCache = null; window._eventosCache = null;
  setView(window._vistaActual, window._vistaActualParam);
  // Si estamos en el dashboard, ese mismo pedido ya trae y pinta el contador
  // de la Bandeja — pedirlo de nuevo acá sería la misma llamada al backend
  // dos veces (justo lo que hacía sentir lenta la app).
  if(window._vistaActual!=='dashboard') actualizarBadgeBandeja_();
  showToast('Actualizado');
}
// Refresco silencioso automático en segundo plano — cada 60s, sin spinner
// ni "Cargando…", para que dashboard/bandeja/casos se mantengan al día
// mientras el usuario los tiene abiertos (mismo criterio que Planning).
setInterval(function(){
  if(!window._vistaActual || document.hidden) return;
  if(window._vistaActual==='dashboard') renderDashboard();
  else if(window._vistaActual==='casos') cargarYPintarCasos_();
  else if(window._vistaActual==='bandeja'){
    gasGet('eventosPendientes').then(function(res){
      if(!res.ok || window._vistaActual!=='bandeja') return;
      guardarCache_('eventosPendientes', res.eventos||[]);
      window._eventosCache = res.eventos||[];
      poblarSelectsBandeja_(window._eventosCache);
      pintarTablaBandeja_();
    });
  }
}, 60000);

function pintarBadgeBandeja_(n){
  var badge = document.getElementById('badgeBandeja');
  if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}
function actualizarBadgeBandeja_(){
  gasGet('dashboard').then(function(res){
    if(!res.ok) return;
    pintarBadgeBandeja_(res.eventosPendientesRevision||0);
  });
}

// ============================================================
// CACHÉ EN MEMORIA (pintar al toque con lo último que había, refrescar
// en silencio detrás — mismo criterio que ya usamos en Planning para que
// las pantallas no se sientan lentas ni parpadeen en "Cargando…").
// ============================================================
function leerCache_(name){ try{ return JSON.parse(sessionStorage.getItem('gc_cache_'+name)||'null'); }catch(e){ return null; } }
function guardarCache_(name,data){ try{ sessionStorage.setItem('gc_cache_'+name, JSON.stringify(data)); }catch(e){} }

// ============================================================
// DASHBOARD
// ============================================================
function pintarDashboard_(res){
  pintarBadgeBandeja_(res.eventosPendientesRevision||0);
  var html = '<div class="kpi-grid">'+
    kpiCardClick_(res.urgentes,'Casos urgentes','var(--danger)', "verListaFiltrada_('Casos urgentes',{prioridad:'Alta',soloAbiertos:true})")+
    kpiCardClick_(res.abiertos,'Casos abiertos','var(--text)', "verListaFiltrada_('Casos abiertos',{soloAbiertos:true})")+
    kpiCardClick_(res.vencidos,'Vencidos (SLA)','var(--danger)', "verListaFiltrada_('Casos vencidos (SLA)',{soloVencidos:true})")+
    kpiCardClick_(res.nuevosSinAsignar,'Nuevos sin asignar','var(--caso)', "verListaFiltrada_('Nuevos sin asignar',{estado:'nuevo',soloSinAsignar:true})")+
    kpiCardClick_(res.resueltosSemana,'Resueltos esta semana','var(--ok)', "verListaFiltrada_('Resueltos / cerrados',{soloResueltos:true})")+
    kpiCardClick_(res.eventosPendientesRevision,'En bandeja de entrada','var(--purple)', "setView('bandeja')")+
  '</div>';
  if(res.eventosPendientesRevision>0){
    html += '<div class="alert-box purple"><span class="material-symbols-outlined">inbox</span><div>Hay <b>'+res.eventosPendientesRevision+' evento(s)</b> esperando revisión en la <a href="#" onclick="setView(\'bandeja\');return false;" style="color:var(--purple);font-weight:700;text-decoration:underline;">Bandeja de entrada</a> antes de convertirse en caso.</div></div>';
  }
  document.getElementById('content').innerHTML = html;
}
function renderDashboard(){
  var cache = leerCache_('dashboard');
  if(cache){ pintarDashboard_(cache); } else { document.getElementById('content').innerHTML = '<div class="empty-state">Cargando…</div>'; }
  marcarLive_(!!cache);
  gasGet('dashboard').then(function(res){
    marcarLive_(false);
    if(!res.ok){ if(!cache) document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    guardarCache_('dashboard', res);
    if(window._vistaActual==='dashboard') pintarDashboard_(res);
  }).catch(function(){ marcarLive_(false); });
}
function kpiCard_(num, label, color){
  return '<div class="kpi-card"><div class="kpi-num" style="color:'+color+';">'+(num!==undefined?num:'—')+'</div><div class="kpi-label">'+label+'</div></div>';
}
function kpiCardClick_(num, label, color, onclickJs){
  return '<div class="kpi-card" style="cursor:pointer;transition:transform .12s,box-shadow .15s;" onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'var(--shadow-2)\';" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\';" onclick="'+onclickJs.replace(/"/g,'&quot;')+'"><div class="kpi-num" style="color:'+color+';">'+(num!==undefined?num:'—')+'</div><div class="kpi-label">'+label+'</div></div>';
}
// Modal genérico: lista de casos que cumplen ciertos filtros — usado por
// los KPIs clickeables del Dashboard y de Reportes ("apretar y ver la lista").
function verListaFiltrada_(titulo, filtros){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modalListaFiltrada').classList.add('show');
  document.getElementById('listaFiltradaTitulo').textContent = titulo;
  document.getElementById('listaFiltradaBody').innerHTML = '<div class="empty-state">Cargando…</div>';
  gasGet('casos', filtros).then(function(res){
    var body = document.getElementById('listaFiltradaBody');
    if(!res.ok){ body.innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos||[];
    if(casos.length===0){ body.innerHTML = '<div class="empty-state">No hay casos en esta categoría.</div>'; return; }
    body.innerHTML = '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Estado</th><th>Prioridad</th><th>Responsable</th></tr></thead><tbody>'+
      casos.map(function(c){
        return '<tr onclick="cerrarModalListaFiltrada_();setView(\'detalle\',\''+c.id+'\')">'+
          '<td class="mono" style="color:var(--caso);font-weight:700;">'+c.id+'</td>'+
          '<td>'+(c.cliente||'—')+'</td><td>'+(c.marca||'—')+'</td>'+
          '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
          '<td><span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span></td>'+
          '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
        '</tr>';
      }).join('')+
    '</tbody></table>';
  });
}
function cerrarModalListaFiltrada_(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalListaFiltrada').classList.remove('show');
}

// ============================================================
// BANDEJA DE ENTRADA — con filtros (fuente, marca, sucursal, fecha) y
// caché instantánea + refresco silencioso, mismo criterio que Casos.
// ============================================================
function parseFechaGC_(str){
  if(!str) return null;
  var partes = String(str).split(' ');
  var f = (partes[0]||'').split('/');
  var h = (partes[1]||'0:0').split(':');
  if(f.length!==3) return null;
  return new Date(Number(f[2]), Number(f[1])-1, Number(f[0]), Number(h[0]||0), Number(h[1]||0));
}
function renderBandeja(){
  var html = '<div class="filter-bar">'+
    '<select id="bfFuente" onchange="pintarTablaBandeja_()"><option value="">Toda fuente</option></select>'+
    '<select id="bfMarca" onchange="pintarTablaBandeja_()"><option value="">Toda marca</option></select>'+
    '<select id="bfSucursal" onchange="pintarTablaBandeja_()"><option value="">Toda sucursal</option></select>'+
    '<span class="flabel">Desde</span><input id="bfDesde" type="date" onchange="pintarTablaBandeja_()">'+
    '<span class="flabel">Hasta</span><input id="bfHasta" type="date" onchange="pintarTablaBandeja_()">'+
    '<input id="bfBusqueda" type="text" placeholder="Buscar cliente, VIN, motivo..." style="min-width:200px;" oninput="pintarTablaBandeja_()">'+
    '<button class="fclear" onclick="limpiarFiltrosBandeja_()">Limpiar filtros</button>'+
  '</div><div class="updating-pill" id="bandejaUpdating"><span class="spin"></span>Actualizando…</div>'+
  '<div class="panel"><div class="table-wrap" id="tablaBandeja"><div class="empty-state">Cargando…</div></div></div>';
  document.getElementById('content').innerHTML = html;
  var cache = leerCache_('eventosPendientes');
  if(cache){ window._eventosCache = cache; poblarSelectsBandeja_(cache); pintarTablaBandeja_(); }
  document.getElementById('bandejaUpdating').classList.toggle('show', !!cache);
  gasGet('eventosPendientes').then(function(res){
    if(!res.ok){ if(!cache) document.getElementById('tablaBandeja').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var eventos = res.eventos||[];
    guardarCache_('eventosPendientes', eventos);
    if(window._vistaActual!=='bandeja') return;
    window._eventosCache = eventos;
    document.getElementById('bandejaUpdating').classList.remove('show');
    poblarSelectsBandeja_(eventos);
    pintarTablaBandeja_();
  });
}
function poblarSelectsBandeja_(eventos){
  var opts = function(id, valores){
    var sel = document.getElementById(id);
    var actual = sel.value;
    sel.innerHTML = sel.options[0].outerHTML;
    Array.from(new Set(valores.filter(Boolean))).sort().forEach(function(v){
      var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
    });
    sel.value = actual;
  };
  opts('bfFuente', eventos.map(function(e){return e.fuente;}));
  opts('bfMarca', eventos.map(function(e){return (e.datosNormalizados||{}).marca;}));
  opts('bfSucursal', eventos.map(function(e){return (e.datosNormalizados||{}).sucursal;}));
}
function limpiarFiltrosBandeja_(){
  ['bfFuente','bfMarca','bfSucursal','bfDesde','bfHasta','bfBusqueda'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  pintarTablaBandeja_();
}
function pintarTablaBandeja_(){
  var eventos = window._eventosCache || [];
  var fuente = document.getElementById('bfFuente').value;
  var marca = document.getElementById('bfMarca').value;
  var sucursal = document.getElementById('bfSucursal').value;
  var desde = document.getElementById('bfDesde').value ? new Date(document.getElementById('bfDesde').value+'T00:00:00') : null;
  var hasta = document.getElementById('bfHasta').value ? new Date(document.getElementById('bfHasta').value+'T23:59:59') : null;
  var q = (document.getElementById('bfBusqueda').value||'').toLowerCase();
  var filtrados = eventos.filter(function(e){
    var d = e.datosNormalizados||{};
    if(fuente && e.fuente!==fuente) return false;
    if(marca && d.marca!==marca) return false;
    if(sucursal && d.sucursal!==sucursal) return false;
    var fecha = parseFechaGC_(e.fechaRecepcion);
    if(desde && fecha && fecha<desde) return false;
    if(hasta && fecha && fecha>hasta) return false;
    if(q){
      var texto = ((d.cliente||'')+' '+(d.vin||'')+' '+(d.motivo||'')+' '+e.id).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  // Más reciente primero — igual criterio que Planning.
  filtrados.sort(function(a,b){ return (parseFechaGC_(b.fechaRecepcion)||0) - (parseFechaGC_(a.fechaRecepcion)||0); });
  var cont = document.getElementById('tablaBandeja');
  if(filtrados.length===0){ cont.innerHTML = '<div class="empty-state">'+(eventos.length===0?'✓ No hay eventos esperando revisión.':'No hay eventos que coincidan con los filtros.')+'</div>'; return; }
  var filas = filtrados.map(function(e){
    var d = e.datosNormalizados||{};
    return '<tr>'+
      '<td class="mono" style="color:var(--text-faint);">'+e.id+'</td>'+
      '<td>'+(d.cliente||'—')+'</td>'+
      '<td>'+(d.marca||'—')+' '+(d.modelo||'')+'</td>'+
      '<td>'+(d.vin||'—')+'</td>'+
      '<td>'+(d.sucursal||'—')+'</td>'+
      '<td><span class="pill pill-nuevo">'+(e.fuente||'Manual')+'</span></td>'+
      '<td>'+(d.motivo||'—')+'</td>'+
      '<td style="white-space:nowrap;">'+e.fechaRecepcion+'</td>'+
      '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" style="width:auto;" onclick="confirmarEvento_(\''+e.id+'\', event)">Convertir en caso</button> '+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="descartarEvento_(\''+e.id+'\', event)">Descartar</button></td>'+
    '</tr>';
  }).join('');
  cont.innerHTML = '<table class="tbl"><thead><tr><th>Evento</th><th>Cliente</th><th>Vehículo</th><th>VIN</th><th>Sucursal</th><th>Fuente</th><th>Motivo</th><th>Recibido</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>';
}
function confirmarEvento_(id, ev){
  ev.stopPropagation();
  var s = sesionActual();
  gasPost('confirmarEventoComoCaso', {idEvento:id, usuario:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Caso creado: '+res.codigo);

function descartarEvento_(id, ev){

  if(cache){ window._casosCache = cache; poblarSelectsCasos_(cache); pintarTablaCasos_(); }
  document.getElementById('casosUpdating').classList.toggle('show', !!cache);
  cargarYPintarCasos_();
}
function cargarYPintarCasos_(){
  gasGet('casos').then(function(res){
    if(!res.ok){ if(!window._casosCache) document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos || res || [];
    guardarCache_('casos', casos);
    if(window._vistaActual!=='casos') return;
    window._casosCache = casos;
    document.getElementById('casosUpdating').classList.remove('show');
    poblarSelectsCasos_(casos);
    pintarTablaCasos_();
  });
}
function poblarSelectsCasos_(casos){
  var opts = function(id, valores){
    var sel = document.getElementById(id);
    var actual = sel.value;
    sel.innerHTML = sel.options[0].outerHTML;
    Array.from(new Set(valores.filter(Boolean))).sort().forEach(function(v){
      var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
    });
    sel.value = actual;
  };
  opts('fFuente', casos.map(function(c){return c.fuente;}));
  opts('fMarca', casos.map(function(c){return c.marca;}));
  opts('fSucursal', casos.map(function(c){return c.sucursal;}));
}
function limpiarFiltrosCasos_(){
  ['fEstado','fPrioridad','fFuente','fMarca','fSucursal','fDesde','fHasta','fBusqueda'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('fDefensa').checked = false;
  pintarTablaCasos_();
}
function aplicarFiltrosCasos_(){ pintarTablaCasos_(); }
function pintarTablaCasos_(){
  var estado = document.getElementById('fEstado').value;
  var prioridad = document.getElementById('fPrioridad').value;
  var fuente = document.getElementById('fFuente').value;
  var marca = document.getElementById('fMarca').value;
  var sucursal = document.getElementById('fSucursal').value;
  var desde = document.getElementById('fDesde').value ? new Date(document.getElementById('fDesde').value+'T00:00:00') : null;
  var hasta = document.getElementById('fHasta').value ? new Date(document.getElementById('fHasta').value+'T23:59:59') : null;
  var soloDefensa = document.getElementById('fDefensa').checked;
  var q = document.getElementById('fBusqueda').value.toLowerCase();
  var casos = (window._casosCache||[]).filter(function(c){
    if(estado && c.estado!==estado) return false;
    if(prioridad && c.prioridad!==prioridad) return false;
    if(fuente && c.fuente!==fuente) return false;
    if(marca && c.marca!==marca) return false;
    if(sucursal && c.sucursal!==sucursal) return false;
    if(soloDefensa && !(String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true)) return false;
    var fecha = parseFechaGC_(c.fechaCreacion);
    if(desde && fecha && fecha<desde) return false;
    if(hasta && fecha && fecha>hasta) return false;
    if(q){
      var texto = ((c.cliente||'')+' '+(c.dominio||'')+' '+(c.motivo||'')+' '+(c.id||'')).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  if(casos.length===0){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">No hay casos que coincidan.</div>'; return; }
  var filas = casos.map(function(c){
    var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
    return '<tr onclick="setView(\'detalle\',\''+c.id+'\')">'+
      '<td class="mono" style="color:var(--caso);font-weight:700;">'+c.id+(esDefensa?' ⚖️':'')+'</td>'+
      '<td>'+(c.cliente||'—')+'</td>'+
      '<td>'+(c.marca||'—')+'</td>'+
      '<td>'+(c.sucursal||'—')+'</td>'+
      '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
      '<td><span class="prio prio-'+c.prioridad+'">'+c.prioridad+'</span></td>'+
      '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
      '<td style="white-space:nowrap;">'+(c.fechaCreacion||'—')+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaCasos').innerHTML =
    '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Sucursal</th><th>Estado</th><th>Prioridad</th><th>Responsable</th><th>Creado</th></tr></thead><tbody>'+filas+'</tbody></table>';
}

// Cacheado en memoria durante la sesión — no cambia tan seguido como para

function usuariosActivosCacheados_(){
  if(window._usuariosActivosCache) return Promise.resolve(window._usuariosActivosCache);
  return gasGet('usuariosActivos').then(function(res){

// BUSCAR CLIENTE / VIN — agrupa por VIN: un mismo vehículo con varios
// casos aparece como UN solo historial expandible, en vez de filas
// sueltas repetidas. Sin VIN, se agrupa por cliente.
// ============================================================
function renderBuscar(){
  var qInicial = window._pendingSearchQuery || '';
  window._pendingSearchQuery = null;
  document.getElementById('content').innerHTML =
    '<div class="panel"><div style="padding:18px;">'+
      '<div style="display:flex;gap:8px;"><input id="buscarQuery" type="text" placeholder="DNI, VIN/dominio o nombre del cliente..." value="'+qInicial.replace(/"/g,'&quot;')+'" style="flex:1;padding:10px 12px;border:1.5px solid var(--hairline);border-radius:9px;font-size:13px;background:var(--panel-2);color:var(--text);" onkeydown="if(event.key===\'Enter\')ejecutarBusqueda_()">'+
      '<button class="btn btn-primary" style="width:auto;" onclick="ejecutarBusqueda_()">Buscar</button></div>'+
    '</div></div><div id="resultadoBusqueda"></div>';
  if(qInicial) ejecutarBusqueda_();
}
function agruparPorVin_(casos){
  var grupos = [], mapa = {};
  casos.forEach(function(c){
    var clave = (c.dominio && String(c.dominio).trim()) ? 'VIN:'+c.dominio.trim().toUpperCase() : 'CLIENTE:'+(c.cliente||'—');
    if(!mapa[clave]){
      mapa[clave] = {vin: c.dominio||'', cliente:c.cliente, marca:c.marca, modelo:c.modelo, casos:[]};
      grupos.push(mapa[clave]);
    }
    mapa[clave].casos.push(c);
  });
  grupos.forEach(function(g){ g.casos.sort(function(a,b){ return (parseFechaGC_(b.fechaCreacion)||0) - (parseFechaGC_(a.fechaCreacion)||0); }); });
  grupos.sort(function(a,b){ return b.casos.length - a.casos.length; });
  return grupos;
}
function ejecutarBusqueda_(){
  var q = document.getElementById('buscarQuery').value.trim();
  if(!q) return;
  document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">Buscando…</div>';
  gasGet('buscarCliente', {query:q}).then(function(res){
    if(!res.ok){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos||[];
    if(casos.length===0){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="panel"><div class="empty-state">No se encontraron casos con ese dato.</div></div>'; return; }
    var grupos = agruparPorVin_(casos);
    var totalCasos = casos.length;
    var html = '<div class="panel"><div class="panel-head"><h3>'+grupos.length+' vehículo/cliente encontrado(s) · '+totalCasos+' caso(s) en total</h3></div></div>';
    html += grupos.map(function(g, gi){
      var abierto = grupos.length===1; // si hay un solo grupo, lo dejamos ya desplegado
      var ultimo = g.casos[0];
      return '<div class="vin-group">'+
        '<div class="vin-group-head" onclick="toggleVinGroup_('+gi+')">'+
          '<div class="vgh-main">'+
            '<div class="vgh-vin">'+(g.vin ? g.vin : (g.cliente||'Sin VIN'))+'</div>'+
            '<div class="vgh-cliente">'+(g.cliente||'—')+(g.marca?' · '+g.marca+' '+(g.modelo||''):'')+' — último: '+(ultimo.motivo||ultimo.tipoCaso||'—')+'</div>'+
          '</div>'+
          '<span class="vin-group-count">'+g.casos.length+' caso'+(g.casos.length>1?'s':'')+'</span>'+
          '<span class="material-symbols-outlined" id="vgIcon'+gi+'" style="color:var(--text-faint);">'+(abierto?'expand_less':'expand_more')+'</span>'+
        '</div>'+
        '<div class="vin-group-body'+(abierto?'':' hidden')+'" id="vgBody'+gi+'">'+
          g.casos.map(function(c){
            var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
            return '<div class="vin-case-row" onclick="setView(\'detalle\',\''+c.id+'\')">'+
              '<span class="vc-id">'+c.id+(esDefensa?' ⚖️':'')+'</span>'+
              '<span class="pill pill-'+c.estado+'">'+c.estado+'</span>'+
              '<span class="vc-motivo">'+(c.motivo||c.tipoCaso||'—')+'</span>'+
              '<span class="vc-fecha">'+(c.fechaCreacion||'—')+'</span>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>';
    }).join('');
    document.getElementById('resultadoBusqueda').innerHTML = html;
  });
}
function toggleVinGroup_(gi){
  var body = document.getElementById('vgBody'+gi);
  var icon = document.getElementById('vgIcon'+gi);
  var abierto = !body.classList.contains('hidden');
  body.classList.toggle('hidden', abierto);
  icon.textContent = abierto ? 'expand_more' : 'expand_less';
}

var _chartsGC_ = {};
function coloresGrafico_(){
  var css = getComputedStyle(document.body);
  return {
    caso: css.getPropertyValue('--caso').trim(), grid: css.getPropertyValue('--hairline').trim(),
    texto: css.getPropertyValue('--text-dim').trim()
  };

function dibujarBarras_(canvasId, lista){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'bar',
    data: { labels: lista.map(function(x){return x.valor;}), datasets: [{ data: lista.map(function(x){return x.cantidad;}), backgroundColor: c.caso, borderRadius: 5, maxBarThickness: 22 }] },
    options: {
      indexAxis: 'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ beginAtZero:true, ticks:{color:c.texto, precision:0}, grid:{color:c.grid} },
        y:{ ticks:{color:c.texto, font:{size:11}}, grid:{display:false} }
      }
    }
  });
}
function dibujarDonut_(canvasId, labels, datos, colores){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: datos, backgroundColor: colores, borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{color:c.texto, font:{size:11.5}, boxWidth:11, padding:14}}} }
  });
}

        '<button class="btn btn-ghost" style="width:auto;" onclick="cerrarFormUsuario_()">Cancelar</button>'+
      '</div>'+
    '</div></div>'+
    '<div class="panel hidden" id="panelFormImportar"><div style="padding:18px;">'+
      '<h3 style="font-size:13px;margin-bottom:6px;">Importar lista de nombres</h3>'+
      '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:12px;">Un nombre por línea (opcional: "Nombre, Sector"). Se crean <b>sin acceso todavía</b> — sin contraseña utilizable — hasta que decidas activarlos y resetearles la contraseña desde la tabla de abajo. No se conecta en vivo con Planning ni ningún otro sistema: es solo para no tipear cada nombre a mano.</div>'+
      '<textarea id="importarNombres" placeholder="Juan Pérez, Ventas'+String.fromCharCode(10)+'María Gómez, PDA'+String.fromCharCode(10)+'Diego Suárez" style="width:100%;min-height:120px;padding:10px 12px;border:1.5px solid var(--hairline);border-radius:9px;font-size:12.5px;background:var(--panel-2);color:var(--text);font-family:inherit;resize:vertical;"></textarea>'+
      '<div style="display:flex;gap:8px;margin-top:14px;">'+
        '<button class="btn btn-primary" style="width:auto;" onclick="importarUsuariosUI_()">Importar</button>'+
        '<button class="btn btn-ghost" style="width:auto;" onclick="document.getElementById(\'panelFormImportar\').classList.add(\'hidden\')">Cancelar</button>'+
      '</div>'+
    '</div></div>';
  cargarYPintarEquipo_();
}
function cargarYPintarEquipo_(){
  var s = sesionActual();
  var pass = _passwordSesionActual_();
  if(!pass) return;
  gasPost('listarUsuarios', {actorUsuario:s.usuario, actorPassword:pass}).then(function(res){
    if(!res.ok){ document.getElementById('tablaEquipo').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    pintarTablaEquipo_(res.usuarios||[]);
  });
}
function abrirFormUsuario_(usuarioExistente){
  document.getElementById('panelFormImportar').classList.add('hidden');
  document.getElementById('panelFormUsuario').classList.remove('hidden');
  document.getElementById('formUsuarioTitulo').textContent = usuarioExistente ? 'Editar usuario' : 'Nuevo usuario';
  document.getElementById('equNombre').value = usuarioExistente ? usuarioExistente.nombre : '';
  document.getElementById('equUsuario').value = usuarioExistente ? usuarioExistente.usuario : '';
  document.getElementById('equUsuario').disabled = !!usuarioExistente;
  document.getElementById('equPassword').value = '';
  document.getElementById('equPassword').placeholder = usuarioExistente ? '(dejar vacío para no cambiarla — próximamente)' : '';
  document.getElementById('equRol').value = usuarioExistente ? usuarioExistente.rol : 'sector';
  document.getElementById('equSector').value = usuarioExistente ? (usuarioExistente.sector||'') : '';
  document.getElementById('equEmail').value = usuarioExistente ? (usuarioExistente.email||'') : '';
  window._equipoEditando = usuarioExistente ? usuarioExistente.usuario : null;
}
function cerrarFormUsuario_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
}
function abrirFormImportar_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
  document.getElementById('panelFormImportar').classList.remove('hidden');
  document.getElementById('importarNombres').value = '';
}
function importarUsuariosUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  if(!actorPassword) return;
  var texto = document.getElementById('importarNombres').value.trim();
  if(!texto){ showToast('Pegá al menos un nombre'); return; }
  var lineas = texto.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  gasPost('importarUsuarios', {actorUsuario:s.usuario, actorPassword:actorPassword, nombres:lineas}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    var creados = res.creados||[], omitidos = res.omitidos||[];
    window._usuariosActivosCache = null;
    showToast(creados.length+' usuario(s) importado(s), sin acceso todavía'+(omitidos.length?' — '+omitidos.length+' omitido(s)':''));
    document.getElementById('panelFormImportar').classList.add('hidden');
    renderEquipo();
  });
}
function guardarUsuarioUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  var nombre = document.getElementById('equNombre').value.trim();
  var usuario = document.getElementById('equUsuario').value.trim();
  var rol = document.getElementById('equRol').value;
  var sector = document.getElementById('equSector').value.trim();
  var email = document.getElementById('equEmail').value.trim();
  if(!nombre || !usuario){ showToast('Falta nombre o usuario'); return; }

  if(window._equipoEditando){
    gasPost('editarUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, usuarioObjetivo:window._equipoEditando, nombre:nombre, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      window._usuariosActivosCache = null;
      showToast('Usuario actualizado'); cerrarFormUsuario_(); renderEquipo();
    });
  } else {
    var password = document.getElementById('equPassword').value;
    if(!password || password.length<4){ showToast('La contraseña tiene que tener al menos 4 caracteres'); return; }
    gasPost('crearUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, nombre:nombre, usuario:usuario, password:password, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      window._usuariosActivosCache = null;
      showToast('Usuario creado'); cerrarFormUsuario_(); renderEquipo();
    });
  }
}
function cambiarActivoUsuarioUI_(usuario, activo){
  var s = sesionActual();
  gasPost('desactivarUsuario', {actorUsuario:s.usuario, actorPassword:_passwordSesionActual_(), usuarioObjetivo:usuario, activo:activo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._usuariosActivosCache = null;
    showToast(activo?'Usuario activado':'Usuario desactivado'); renderEquipo();
  });
}
function pintarTablaEquipo_(usuarios){
  var etiquetasRol = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  var filas = usuarios.map(function(u){
    return '<tr style="cursor:default;">'+
      '<td>'+u.nombre+'</td>'+
      '<td class="mono">'+u.usuario+'</td>'+
      '<td>'+(etiquetasRol[u.rol]||u.rol)+'</td>'+
      '<td>'+(u.sector||'—')+'</td>'+
      '<td>'+(u.email||'—')+'</td>'+
      '<td>'+(u.activo ? '<span class="pill pill-resuelto">Activo</span>' : '<span class="pill pill-cerrado">Inactivo</span>')+'</td>'+
      '<td style="white-space:nowrap;">'+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick=\'abrirFormUsuario_('+JSON.stringify(u)+')\'>Editar</button> '+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="cambiarActivoUsuarioUI_(\''+u.usuario+'\','+(!u.activo)+')">'+(u.activo?'Desactivar':'Activar')+'</button>'+
      '</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaEquipo').innerHTML = usuarios.length ?
    '<table class="tbl"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Sector</th><th>Email</th><th>Estado</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>' :
    '<div class="empty-state">No hay usuarios cargados.</div>';
}

var CONFIG_EDITABLES_ = {
  SLA_HORAS_ALTA: {label:'SLA — Prioridad Alta (horas)', tipo:'number'},
  SLA_HORAS_MEDIA: {label:'SLA — Prioridad Media (horas)', tipo:'number'},
  SLA_HORAS_BAJA: {label:'SLA — Prioridad Baja (horas)', tipo:'number'},
  NOTIFICAR_EMAIL_CASO_NUEVO: {label:'Email para avisos de casos nuevos', tipo:'email'}
};
var CONFIG_SOLO_LECTURA_ = ['CONTADOR_CASOS','CONTADOR_EVENTOS','CONTADOR_SEGUIMIENTOS','CONTADOR_TIMELINE'];

function renderConfig(){
  gasGet('config').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    window._configCache = res.config||{};
    window._catalogosCache = res.catalogos||{};
    window._configGlobalCache = res; // mismo caché que usa Reportar, así queda al día sin pedirlo de nuevo
    pintarConfig_();
  });
}
function pintarConfig_(){
  var cat = window._catalogosCache||{};
  var conf = window._configCache||{};
  var tabActiva = window._configTabActiva || 'catalogos';

  var html = '<div class="filter-bar" style="margin-bottom:16px;">'+
    tabBtn_('catalogos','Catálogos',tabActiva)+
    tabBtn_('parametros','Parámetros y SLA',tabActiva)+
    tabBtn_('automatizacion','Automatización',tabActiva)+
  '</div>';

  if(tabActiva==='catalogos'){
    html += '<div class="panel"><div class="panel-head"><h3>Catálogos — listas desplegables del sistema</h3></div><div style="padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;">';
    Object.keys(cat).forEach(function(nombre){
      html += '<div>'+
        '<div style="font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:8px;">'+nombre+'</div>'+
        cat[nombre].map(function(v){
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding:4px 0;">'+
            '<span>'+v+'</span>'+
            '<button onclick="eliminarCatalogoItemUI_(\''+nombre+'\',\''+String(v).replace(/'/g,"\\'")+'\')" title="Quitar" style="background:none;border:none;color:var(--text-faint);cursor:pointer;padding:2px;"><span class="material-symbols-outlined" style="font-size:14px;">close</span></button>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;gap:6px;margin-top:8px;">'+
          '<input type="text" id="nuevoItem_'+nombre+'" placeholder="Agregar..." style="flex:1;min-width:0;padding:6px 8px;border:1.5px solid var(--hairline);border-radius:7px;font-size:11.5px;background:var(--panel-2);color:var(--text);" onkeydown="if(event.key===\'Enter\')agregarCatalogoItemUI_(\''+nombre+'\')">'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;padding:6px 10px;" onclick="agregarCatalogoItemUI_(\''+nombre+'\')">+</button>'+
        '</div>'+
      '</div>';
    });
    html += '</div></div>';
  }

  if(tabActiva==='parametros'){
    html += '<div class="panel"><div class="panel-head"><h3>SLA por prioridad y avisos</h3></div><div style="padding:16px 18px;">'+
      '<div class="form-grid">'+
      Object.keys(CONFIG_EDITABLES_).map(function(k){
        var def = CONFIG_EDITABLES_[k];
        return '<div class="field"><label>'+def.label+'</label>'+
          '<div style="display:flex;gap:6px;">'+
          '<input type="'+def.tipo+'" id="conf_'+k+'" value="'+(conf[k]!==undefined?conf[k]:'')+'" style="flex:1;">'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="guardarConfigParamUI_(\''+k+'\')">Guardar</button>'+
          '</div></div>';
      }).join('')+
      '</div>'+
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);font-size:11px;color:var(--text-faint);">'+
        'Contadores internos (no editables): '+CONFIG_SOLO_LECTURA_.map(function(k){ return k+' = '+(conf[k]!==undefined?conf[k]:0); }).join(' · ')+
      '</div>'+
    '</div></div>';
  }

  if(tabActiva==='automatizacion'){
    html += '<div class="panel"><div class="panel-head"><h3>Motor de Eventos</h3></div><div style="padding:16px 18px;">'+
      '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px;">Creación automática de casos desde eventos (Etapa 2) — hoy está <b style="color:'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true'?'var(--ok)':'var(--warn)')+';">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true'?'ACTIVADA':'APAGADA')+'</b>.</div>'+
      '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px;">Apagada = todo pasa por la Bandeja de entrada para confirmar a mano antes de crear el caso. Activada = el caso se crea solo apenas llega el evento.</div>'+
      '<button class="btn btn-dark btn-sm" style="width:auto;" onclick="toggleCreacionAutomaticaUI_()">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true' ? 'Apagar creación automática' : 'Activar creación automática')+'</button>'+
    '</div></div>';
  }

  document.getElementById('content').innerHTML = html;
}
function tabBtn_(id, label, activa){
  var esActiva = id===activa;
  return '<button class="btn '+(esActiva?'btn-dark':'btn-ghost')+' btn-sm" style="width:auto;'+(esActiva?'border-color:var(--caso);color:var(--caso);':'')+'" onclick="window._configTabActiva=\''+id+'\';pintarConfig_();">'+label+'</button>';
}
function agregarCatalogoItemUI_(nombre){
  var input = document.getElementById('nuevoItem_'+nombre);
  var valor = input.value.trim();
  if(!valor) return;
  gasPost('agregarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    if(!window._catalogosCache[nombre]) window._catalogosCache[nombre]=[];
    window._catalogosCache[nombre].push(valor);
    pintarConfig_();
    showToast('Agregado a '+nombre);
  });
}
function eliminarCatalogoItemUI_(nombre, valor){
  if(!confirm('¿Quitar "'+valor+'" de '+nombre+'?')) return;
  gasPost('eliminarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._catalogosCache[nombre] = window._catalogosCache[nombre].filter(function(v){return v!==valor;});
    pintarConfig_();
    showToast('Quitado de '+nombre);
  });
}
function guardarConfigParamUI_(clave){
  var valor = document.getElementById('conf_'+clave).value;
  gasPost('actualizarConfig', {clave:clave, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache[clave] = valor;
    showToast('Guardado');
  });
}
function toggleCreacionAutomaticaUI_(){
  var actual = String(window._configCache.CREAR_CASOS_AUTOMATICO)==='true';
  var nuevo = !actual;
  var msg = nuevo
    ? '¿Activar la creación automática de casos? A partir de ahora, los eventos van a crear el caso solos, sin pasar por la Bandeja de entrada.'
    : '¿Apagar la creación automática? Los eventos van a volver a esperar confirmación manual en la Bandeja de entrada.';
  if(!confirm(msg)) return;
  gasPost('actualizarConfig', {clave:'CREAR_CASOS_AUTOMATICO', valor:nuevo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache.CREAR_CASOS_AUTOMATICO = nuevo;
    pintarConfig_();
    showToast(nuevo ? 'Creación automática activada' : 'Creación automática apagada');
  });
}
</script>
</body>
</html>
