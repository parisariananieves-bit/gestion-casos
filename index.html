function pintarTablaBandeja_(){
  var eventos = window._eventosCache || [];
  var sel = window._bjSel = window._bjSel || {};
  var fuente = document.getElementById('bfFuente').value;
  var marca = document.getElementById('bfMarca').value;
  var sucursal = document.getElementById('bfSucursal').value;
  var desde = document.getElementById('bfDesde').value ? new Date(document.getElementById('bfDesde').value+'T00:00:00') : null;
  var hasta = document.getElementById('bfHasta').value ? new Date(document.getElementById('bfHasta').value+'T23:59:59') : null;
  var q = (document.getElementById('bfBusqueda').value||'').toLowerCase();
  var nf = [fuente,marca,sucursal,document.getElementById('bfDesde').value,document.getElementById('bfHasta').value].filter(Boolean).length;
  var nEl = document.getElementById('nFiltrosB'); if(nEl){ nEl.textContent = nf; nEl.classList.toggle('hidden', !nf); document.getElementById('btnFiltrosB').classList.toggle('on', nf>0); }
  var filtrados = eventos.filter(function(e){
    var d = e.datosNormalizados||{};
    if(fuente && e.fuente!==fuente) return false;
    if(marca && d.marca!==marca) return false;
    if(sucursal && d.sucursal!==sucursal) return false;
    var fecha = parseFechaGC_(e.fechaRecepcion);
    if(desde && fecha && fecha<desde) return false;
    if(hasta && fecha && fecha>hasta) return false;
    if(q){
      var texto = ((d.cliente||'')+' '+(d.vin||'')+' '+(d.motivo||'')+' '+e.id).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  // Más reciente primero — igual criterio que Planning.
  filtrados.sort(function(a,b){ return (parseFechaGC_(b.fechaRecepcion)||0) - (parseFechaGC_(a.fechaRecepcion)||0); });
  window._bjVisibles = filtrados.map(function(e){ return e.id; });
  var cont = document.getElementById('tablaBandeja');
  pintarBarraBandeja_();
  if(filtrados.length===0){ cont.innerHTML = '<div class="empty-state">'+(eventos.length===0?'✓ No hay eventos esperando revisión.':'No hay eventos que coincidan con los filtros.')+'</div>'; return; }
  var conteo = {}; eventos.forEach(function(e){ var k = claveRepetido_(e); if(k) conteo[k] = (conteo[k]||0)+1; });
  var abiertos = casosAbiertosPorVin_();
  var todosMarcados = filtrados.every(function(e){ return sel[e.id]; });
  var filas = filtrados.map(function(e){
    var d = e.datosNormalizados||{};
    var fRecepcion = parseFechaGC_(e.fechaRecepcion);
    var horasEsperando = fRecepcion ? (Date.now()-fRecepcion.getTime())/(1000*60*60) : 0;
    var esNueva = horasEsperando < 2; // recién llegó, todavía nadie la vio
    var k = claveRepetido_(e), n = k ? conteo[k] : 1;
    var vinK = String(d.vin||'').replace(/\s+/g,'').toUpperCase();
    var chips = '';
    if(n>1) chips += '<span class="rep-chip" title="Hay '+n+' eventos de este '+(k.charAt(0)==='v'?'vehículo':'cliente')+' en la Bandeja">×'+n+' repetido</span>';
    if(abiertos[vinK]) chips += '<span class="rep-chip abierto" title="Este vehículo ya tiene un caso abierto. Al convertir, se suma ahí en vez de abrir otro.">ya tiene caso '+abiertos[vinK]+'</span>';
    return '<tr class="'+claseFilaPrioridad_(d.prioridadSugerida, esNueva)+'">'+
      '<td style="width:30px;"><input type="checkbox" class="bj-chk" '+(sel[e.id]?'checked ':'')+'onchange="bjMarcar_(\''+e.id+'\',this.checked)"></td>'+
      '<td class="mono" style="color:var(--text-faint);">'+e.id+'</td>'+
      '<td>'+(d.cliente||'—')+chips+'</td>'+
      '<td>'+(d.marca||'—')+' '+(d.modelo||'')+'</td>'+
      '<td>'+(d.vin||'—')+'</td>'+
      '<td>'+(d.sucursal||'—')+'</td>'+
      '<td><span class="pill pill-nuevo">'+(e.fuente||'Manual')+'</span></td>'+
      '<td>'+(d.motivo||'—')+'</td>'+
      '<td style="white-space:nowrap;">'+(horasEsperando>24?'<span class="venc-chip" title="Esperando revisión hace más de 24 h"><span class="material-symbols-outlined">schedule</span>'+fmtFechaGC_(e.fechaRecepcion)+'</span>':fmtFechaGC_(e.fechaRecepcion))+'</td>'+
      '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" style="width:auto;" onclick="confirmarEvento_(\''+e.id+'\', event)">Convertir en caso</button> '+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="descartarEvento_(\''+e.id+'\', event)">Descartar</button></td>'+
    '</tr>';
  }).join('');

// Procesa de a lotes chicos: cada evento escribe varias filas y Apps Script
// corta a los 6 minutos, así que no mandamos todo junto.
function bjProcesar_(accion){
  var ids = bjIds_(); if(!ids.length) return;
  if(accion==='descartar' && !confirm('¿Descartar '+ids.length+' evento(s)? No se van a crear casos.')) return;
  if(accion==='convertir' && ids.length>1 && !confirm('Se van a procesar '+ids.length+' eventos. Si un vehículo ya tiene un caso abierto, el evento se suma a ese caso en vez de crear uno nuevo. ¿Seguimos?')) return;
  var s = sesionActual(), LOTE = 15, total = ids.length, hechos = 0, creados = 0, fusionados = 0, errores = [];
  var prog = document.getElementById('bjProg');
  document.querySelectorAll('#bjBar .btn').forEach(function(b){ b.disabled = true; });
  function paso(){
    if(!ids.length) return fin();
    var lote = ids.splice(0, LOTE);
    var req = accion==='convertir'
      ? gasPost('confirmarEventosLote', {idEventos:lote, usuario:s?s.nombre:''})
      : gasPost('descartarEventosLote', {idEventos:lote, motivo:'Descartado en lote desde la Bandeja de entrada.'});
    req.then(function(res){
      if(!res.ok){ errores.push(res.error||'Error'); } else {
        creados += res.creados||0; fusionados += res.fusionados||0;
        (res.errores||[]).forEach(function(x){ errores.push(x); });
      }
      hechos += lote.length;
      if(prog) prog.textContent = hechos+' de '+total+'…';
      paso();
    }).catch(function(){ errores.push('Se cortó la conexión'); fin(); });
  }
  function fin(){
    guardarCache_('eventosPendientes', null); guardarCache_('casos', null);
    window._bjSel = {};
    var msg = accion==='convertir'
      ? (creados+' caso(s) creado(s)'+(fusionados?', '+fusionados+' sumado(s) a casos abiertos':''))
      : (total-errores.length)+' evento(s) descartado(s)';
    if(errores.length) msg += ' · '+errores.length+' con error';
    showToast(msg);
    renderBandeja(); actualizarBadgeBandeja_();
  }
  paso();
}
function confirmarEvento_(id, ev){
  ev.stopPropagation();
  var s = sesionActual();
  gasPost('confirmarEventoComoCaso', {idEvento:id, usuario:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Caso creado: '+res.codigo);
    guardarCache_('eventosPendientes', null); guardarCache_('casos', null);
    renderBandeja(); actualizarBadgeBandeja_();
  });
}
function descartarEvento_(id, ev){
  ev.stopPropagation();
  if(!confirm('¿Descartar este evento? No se va a crear un caso.')) return;
  gasPost('descartarEvento', {idEvento:id, motivo:'Descartado desde la Bandeja de entrada.'}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Evento descartado');
    guardarCache_('eventosPendientes', null);
    renderBandeja(); actualizarBadgeBandeja_();
  });
}

  try{ var v = Number(localStorage.getItem('gc_umbral_estancado')); if(v>0) return v; }catch(e){}

function proximoPasoVencido_(c){
  if(!c.proximoPasoFecha || !estaAbierto_(c)) return false;
  var f = parseFechaGC_(c.proximoPasoFecha); if(!f) return false;
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  return f < hoy;
}
function proximoPasoChip_(c){
  if(!c.proximoPasoTexto && !c.proximoPasoFecha) return '';

  var venc = proximoPasoVencido_(c);
  return '<div class="pp-chip'+(venc?' venc':'')+'" title="Próximo paso'+(venc?' (vencido)':'')+': '+String(c.proximoPasoTexto||'').replace(/"/g,'&quot;')+'"><span class="material-symbols-outlined">'+(venc?'event_busy':'event_upcoming')+'</span>'+(fTxt?fTxt+' · ':'')+String(c.proximoPasoTexto||'Próximo paso').slice(0,38)+'</div>';

function ppFechaISO_(v){

function guardarProximoPaso_(id){

  if(texto && !fecha){ showToast('Poné una fecha para el próximo paso'); return; }

    if(!res.ok){ showToast(res.error); return; }

    if(c){ c.proximoPasoTexto = texto; c.proximoPasoFecha = fecha ? fecha.split('-').reverse().join('/') : ''; guardarCache_('casos', window._casosCache); }

function estaAbierto_(c){ return c.estado!=='resuelto' && c.estado!=='cerrado'; }
function diasAbierto_(c){
  var f = parseFechaGC_(c.fechaCreacion);
  return f ? Math.max(0, Math.floor((Date.now()-f.getTime())/86400000)) : 0;
}
function esEstancado_(c){ return estaAbierto_(c) && diasAbierto_(c) >= umbralEstancado_(); }

}

function pintarTablaCasos_(){
  var estado = document.getElementById('fEstado').value;
  var prioridad = document.getElementById('fPrioridad').value;
  var fuente = document.getElementById('fFuente').value;
  var marca = document.getElementById('fMarca').value;
  var sucursal = document.getElementById('fSucursal').value;
  var unidad = document.getElementById('fUnidad').value;
  var desde = document.getElementById('fDesde').value ? new Date(document.getElementById('fDesde').value+'T00:00:00') : null;
  var hasta = document.getElementById('fHasta').value ? new Date(document.getElementById('fHasta').value+'T23:59:59') : null;
  var soloDefensa = document.getElementById('fDefensa').checked;
  var q = document.getElementById('fBusqueda').value.toLowerCase();
  var quickView = QUICK_VIEWS_CASOS_.find(function(qv){ return qv.id===(window._quickViewActiva||'todos'); }) || QUICK_VIEWS_CASOS_[0];
  var casos = (window._casosCache||[]).filter(function(c){
    if(!quickView.test(c)) return false;
    if(estado && c.estado!==estado) return false;
    if(prioridad && c.prioridad!==prioridad) return false;
    if(fuente && c.fuente!==fuente) return false;
    if(marca && c.marca!==marca) return false;
    if(sucursal && c.sucursal!==sucursal) return false;
    if(unidad && c.unidad!==unidad) return false;
    if(soloDefensa && !(String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true)) return false;
    var fecha = parseFechaGC_(c.fechaCreacion);
    if(desde && fecha && fecha<desde) return false;
    if(hasta && fecha && fecha>hasta) return false;
    if(q){
      var texto = ((c.cliente||'')+' '+(c.dominio||'')+' '+(c.motivo||'')+' '+(c.id||'')+' '+(c.responsable||'')+' '+(c.vin||'')).toLowerCase();
      if(texto.indexOf(q)===-1) return false;
    }
    return true;
  });
  actualizarChipsFiltros_();
  var modoTablero = window._modoCasos==='tablero';
  document.querySelectorAll('#segModoCasos button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-m')===(modoTablero?'tablero':'lista')); });
  var panelTabla = document.getElementById('panelTablaCasos');
  if(panelTabla) panelTabla.classList.toggle('plano', modoTablero);
  if(modoTablero){ pintarKanban_(casos); return; }
  if(casos.length===0){ document.getElementById('tablaCasos').innerHTML = '<div class="empty-state">No hay casos que coincidan.</div>'; return; }
  // Los estancados van primero: es lo que hay que mirar antes que nada.
  casos = casos.slice().sort(function(a,b){ return (esEstancado_(b)?1:0) - (esEstancado_(a)?1:0); });
  var filas = casos.map(function(c){
    var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
    var prioColor = {Alta:'var(--danger)',Media:'var(--warn)',Baja:'var(--text-faint)'}[c.prioridad]||'var(--text-faint)';
    return '<tr class="'+claseFilaPrioridad_(prioridadEfectiva_(c), c.estado==='nuevo')+'" onclick="setView(\'detalle\',\''+c.id+'\')">'+
      '<td class="mono" style="color:var(--caso);font-weight:700;white-space:nowrap;">'+c.id+(esDefensa?' ⚖️':'')+'</td>'+
      '<td><div style="font-weight:650;color:var(--text);">'+(c.cliente||'—')+'</div>'+
        '<div style="font-size:10.5px;color:var(--text-faint);margin-top:1px;">'+(c.dominio?('<span class="mono">'+c.dominio+'</span> · '):'')+(c.motivo||c.tipoCaso||'')+'</div>'+proximoPasoChip_(c)+'</td>'+
      '<td><div>'+marcaConLogo_(c.marca,15)+'</div>'+(c.modelo?'<div style="font-size:10.5px;color:var(--text-faint);">'+c.modelo+'</div>':'')+'</td>'+
      '<td>'+(c.sucursal||'—')+'</td>'+
      '<td style="font-size:11.5px;color:var(--text-dim);">'+(c.unidad||'<span style="color:var(--text-faint);">—</span>')+'</td>'+
      '<td><span class="pill pill-'+c.estado+'">'+c.estado+'</span></td>'+
      '<td><span class="prio prio-'+c.prioridad+'" style="display:inline-flex;align-items:center;gap:5px;"><i style="width:6px;height:6px;border-radius:50%;background:'+prioColor+';display:inline-block;"></i>'+c.prioridad+'</span></td>'+
      '<td>'+(c.responsable||'<span style="color:var(--text-faint);">Sin asignar</span>')+'</td>'+
      '<td style="white-space:nowrap;font-size:11.5px;color:var(--text-dim);">'+fmtFechaGC_(c.fechaCreacion)+'</td>'+
      '<td style="font-size:11.5px;color:var(--text-dim);">'+antiguedadConSLA_(c)+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaCasos').innerHTML =
    '<table class="tbl"><thead><tr><th>Caso</th><th>Cliente</th><th>Marca</th><th>Sucursal</th><th>Operación</th><th>Estado</th><th>Prioridad</th><th>Responsable</th><th>Creado</th><th>Antigüedad</th></tr></thead><tbody>'+filas+'</tbody></table>';
}

  {id:'analisis', t:'En análisis', c:'var(--info)'},
  {id:'esperando', t:'Esperando respuesta', c:'var(--warn)'},
  {id:'derivado', t:'Derivados', c:'var(--purple)'},
  {id:'resuelto', t:'Resueltos', c:'var(--ok)'},
  {id:'cerrado', t:'Cerrados', c:'var(--pending)'}
];
function inicialesDe_(nombre){
  var p = String(nombre||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '·';
  return (p[0][0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
}
function pintarKanban_(casos){
  var porEstado = {};
  KB_COLUMNAS_.forEach(function(col){ porEstado[col.id] = []; });
  casos.forEach(function(c){ (porEstado[c.estado] || (porEstado[c.estado]=[])).push(c); });
  var LIM = 12;
  var cg = cargaPorPersona_();
  var carga = Object.keys(cg).sort(function(a,b){ return cg[b].n-cg[a].n; }).map(function(n){
    return '<div class="cg" title="Ver los casos de '+n+'" onclick="irACasosDe_(\''+n.replace(/'/g,"\\'")+'\')"><span class="kb-av">'+inicialesDe_(n)+'</span><span>'+n.split(' ')[0]+'</span><span class="n">'+cg[n].n+'</span>'+(cg[n].rojo?'<span class="r">'+cg[n].rojo+' ⚠</span>':'')+'</div>';
  }).join('');
  var html = (carga ? '<div class="kb-carga" title="Casos abiertos por persona">'+carga+'</div>' : '')+'<div class="kb-hint">Arrastrá una tarjeta a otra columna para cambiar su estado. Si la soltás en <b>Derivados</b>, te pide a quién.</div><div class="kb-board">' +
    KB_COLUMNAS_.map(function(col){
      var lista = (porEstado[col.id]||[]).slice();
      lista.sort(function(a,b){
        var ea = esEstancado_(a)?1:0, eb = esEstancado_(b)?1:0;
        if(ea!==eb) return eb-ea;
        var pa = {Alta:0,Media:1,Baja:2}[prioridadEfectiva_(a)]; var pb = {Alta:0,Media:1,Baja:2}[prioridadEfectiva_(b)];
        if(pa!==pb) return (pa==null?3:pa)-(pb==null?3:pb);
        return (parseFechaGC_(b.fechaCreacion)||0) - (parseFechaGC_(a.fechaCreacion)||0);
      });
      var cerrada = col.id==='resuelto' || col.id==='cerrado';
      var visibles = cerrada ? lista.slice(0, LIM) : lista;
      return '<div class="kb-col" style="--kb-c:'+col.c+';" data-estado="'+col.id+'" ondragover="kbOver_(event,this)" ondragleave="kbLeave_(this)" ondrop="kbDrop_(event,\''+col.id+'\',this)">'+
        '<div class="kb-col-head"><h4>'+col.t+'</h4><span class="cant">'+lista.length+'</span></div>'+
        '<div class="kb-col-body">'+
          (visibles.length ? visibles.map(kbCard_).join('') : '<div class="kb-vacio">Sin casos</div>')+
          (lista.length>visibles.length ? '<div class="kb-mas">+'+(lista.length-visibles.length)+' más — verlos en la vista Lista</div>' : '')+
        '</div></div>';
    }).join('') + '</div>';
  document.getElementById('tablaCasos').innerHTML = html;
}
function kbCard_(c){
  var est = esEstancado_(c);
  var pe = prioridadEfectiva_(c);
  var esDefensa = String(c.defensaConsumidor)==='true'||c.defensaConsumidor===true;
  var dias = diasAbierto_(c);
  var meta = [];
  if(c.marca) meta.push(marcaConLogo_(c.marca,13));
  if(c.sucursal) meta.push(c.sucursal);
  meta.push(est ? '<span class="venc-chip"><span class="material-symbols-outlined">hourglass_top</span>'+dias+' días sin resolver</span>' : (slaVencido_(c) ? '<span class="venc-chip"><span class="material-symbols-outlined">warning</span>SLA vencido</span>' : antiguedadTexto_(c.fechaCreacion)));
  var estadosOpt = KB_COLUMNAS_.map(function(k){ return '<option value="'+k.id+'"'+(k.id===c.estado?' selected':'')+'>'+k.t+'</option>'; }).join('');
  return '<div class="kb-card '+claseFilaPrioridad_(pe,false)+(est?' estancado':'')+'" draggable="true" data-id="'+c.id+'" ondragstart="kbDragStart_(event,\''+c.id+'\')" ondragend="kbDragEnd_(this)">'+
    '<div class="kb-top"><span class="kb-id" onclick="setView(\'detalle\',\''+c.id+'\')">'+c.id+(esDefensa?' ⚖️':'')+'</span><span class="prio prio-'+pe+'">'+pe+(est && c.prioridad!=='Alta'?' ↑':'')+'</span></div>'+
    '<div class="kb-cli">'+(c.cliente||'—')+'</div>'+
    '<div class="kb-sub">'+(c.dominio?c.dominio+' · ':'')+(c.motivo||c.tipoCaso||'')+'</div>'+
    '<div class="kb-meta">'+meta.join('<span>·</span>')+'</div>'+proximoPasoChip_(c)+
    '<div class="kb-foot">'+
      '<div class="kb-resp"><span class="kb-av'+(c.responsable?'':' vacio')+'">'+inicialesDe_(c.responsable)+'</span><span class="nm">'+(c.responsable||'Sin asignar')+'</span></div>'+
      '<button class="kb-act" title="Asignar o derivar a una persona" onclick="abrirDerivar_(\''+c.id+'\')"><span class="material-symbols-outlined">person_add</span>Derivar</button>'+
      '<select class="kb-mover" title="Mover a otro estado" onchange="moverCasoEstado_(\''+c.id+'\',this.value)">'+estadosOpt+'</select>'+
    '</div></div>';
}
function irACasosDe_(nombre){
  var b = document.getElementById('fBusqueda');
  if(b){ b.value = nombre; pintarTablaCasos_(); }
}
function kbDragStart_(ev, id){
  ev.dataTransfer.setData('text/plain', id);
  ev.dataTransfer.effectAllowed = 'move';
  ev.currentTarget.classList.add('dragging');
}
function kbDragEnd_(el){ el.classList.remove('dragging'); document.querySelectorAll('.kb-col.over').forEach(function(c){ c.classList.remove('over'); }); }
function kbOver_(ev, col){ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; col.classList.add('over'); }
function kbLeave_(col){ col.classList.remove('over'); }
function kbDrop_(ev, estado, col){
  ev.preventDefault(); col.classList.remove('over');
  var id = ev.dataTransfer.getData('text/plain');
  if(id) moverCasoEstado_(id, estado);
}
function casoEnCache_(id){ return (window._casosCache||[]).find(function(c){ return c.id===id; }); }
function moverCasoEstado_(id, estado){
  var c = casoEnCache_(id); if(!c || c.estado===estado) { pintarTablaCasos_(); return; }
  if(estado==='derivado'){ abrirDerivar_(id); pintarTablaCasos_(); return; }
  var anterior = c.estado, s = sesionActual();
  c.estado = estado; guardarCache_('casos', window._casosCache);
  pintarQuickViews_(window._casosCache); pintarTablaCasos_();
  gasPost('cambiarEstadoCaso', {id:id, estado:estado, autor:s?s.nombre:''}).then(function(res){
    if(!res.ok){ c.estado = anterior; guardarCache_('casos', window._casosCache); pintarQuickViews_(window._casosCache); pintarTablaCasos_(); showToast(res.error||'No se pudo mover el caso'); return; }
    showToast(id+' → '+estado);
  });
}

// Selector de persona: asignar (el responsable lo trabaja) o derivar
// (queda "derivado", seguimiento conjunto con Calidad). Mismas acciones del
// backend que ya usa el detalle del caso.
// Casos abiertos por persona (con cuántos están estancados/vencidos)
function cargaPorPersona_(){
  var m = {};
  (window._casosCache||[]).forEach(function(c){
    if(!c.responsable || !estaAbierto_(c)) return;
    var r = m[c.responsable] = m[c.responsable] || {n:0, rojo:0};
    r.n++; if(esEstancado_(c) || slaVencido_(c) || proximoPasoVencido_(c)) r.rojo++;
  });
  return m;
}
function abrirDerivar_(id){
  var c = casoEnCache_(id);
  usuariosActivosCacheados_().then(function(usuarios){
    window._derivarSel = c && c.responsable ? c.responsable : '';
    var carga = cargaPorPersona_(), nums = usuarios.map(function(u){ return (carga[u.nombre]||{n:0}).n; });
    var maxN = Math.max.apply(null, nums.concat([0])), minN = Math.min.apply(null, nums.concat([0]));
    usuarios = usuarios.slice().sort(function(a,b){ return ((carga[a.nombre]||{n:0}).n) - ((carga[b.nombre]||{n:0}).n); });
    var back = document.createElement('div'); back.className = 'kb-modal-back'; back.id = 'modalDerivar';
    back.onclick = function(e){ if(e.target===back) cerrarDerivar_(); };
    back.innerHTML = '<div class="kb-modal"><h3>Derivar '+id+'</h3><div class="sub">'+(c?(c.cliente||'')+' · '+(c.motivo||c.tipoCaso||''):'')+'<br>Elegí quién lo trata.</div>'+
      '<div class="lista">'+(usuarios.length ? usuarios.map(function(u,i){
        return '<div class="kb-persona'+(u.nombre===window._derivarSel?' sel':'')+'" data-n="'+i+'" onclick="elegirPersonaDerivar_('+i+')"><span class="kb-av">'+inicialesDe_(u.nombre)+'</span><div><div class="nm">'+u.nombre+'</div><div class="sc">'+(u.sector||u.rol||'')+'</div></div>'+
          (function(){ var r = carga[u.nombre]||{n:0,rojo:0}; var cl = r.n>=maxN && maxN>2 ? ' alta' : (r.n===minN ? ' baja' : ''); return '<div class="carga'+cl+'"><b>'+r.n+'</b> abiertos'+(r.rojo?'<br><span style="color:var(--danger);">'+r.rojo+' con atraso</span>':'')+'</div>'; })()+'</div>';
      }).join('') : '<div class="empty-state">Todavía no hay usuarios activos. Creálos en Equipo.</div>')+'</div>'+
      '<div class="pie"><button class="btn btn-ghost btn-sm" onclick="cerrarDerivar_()">Cancelar</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="confirmarDerivar_(\''+id+'\',false)">Solo asignar</button>'+
      '<button class="btn btn-primary btn-sm" style="width:auto;" onclick="confirmarDerivar_(\''+id+'\',true)">Derivar</button></div></div>';
    document.body.appendChild(back);
    window._derivarUsuarios = usuarios;
  });
}
function elegirPersonaDerivar_(i){
  window._derivarSel = (window._derivarUsuarios[i]||{}).nombre || '';
  document.querySelectorAll('#modalDerivar .kb-persona').forEach(function(el){ el.classList.toggle('sel', Number(el.getAttribute('data-n'))===i); });
}
function cerrarDerivar_(){ var m = document.getElementById('modalDerivar'); if(m) m.remove(); }
function confirmarDerivar_(id, derivar){
  var resp = window._derivarSel;
  if(!resp){ showToast('Elegí a quién'); return; }
  var s = sesionActual();
  gasPost(derivar ? 'derivarCaso' : 'asignarCaso', {id:id, responsable:resp, autor:s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    var c = casoEnCache_(id);
    if(c){ c.responsable = resp; if(derivar) c.estado = 'derivado'; guardarCache_('casos', window._casosCache); }
    cerrarDerivar_();
    showToast(derivar ? 'Caso derivado a '+resp : 'Caso asignado a '+resp);
    if(window._vistaActual==='casos'){ pintarQuickViews_(window._casosCache||[]); pintarTablaCasos_(); }
  });
}

function irAEstancados_(){
  window._quickViewActiva = 'estancados';
  setView('casos');
}
function cambiarUmbralEstancado_(){
  var v = prompt('¿Después de cuántos días sin resolver un caso se marca como estancado?', String(umbralEstancado_()));
  var n = Number(v);
  if(!v || !(n>0)) return;
  try{ localStorage.setItem('gc_umbral_estancado', String(Math.round(n))); }catch(e){}
  pintarAlertaEstancados_();
  showToast('Umbral: '+Math.round(n)+' días');
}
function escalarEstancados_(){
  var pend = casosEstancados_().filter(function(c){ return c.prioridad!=='Alta'; });
  if(!pend.length) return;
  if(!confirm('¿Subir '+pend.length+' caso(s) estancado(s) a prioridad Alta? Queda registrado en cada caso.')) return;
  var s = sesionActual(), hechos = 0;
  var seguir = function(i){
    if(i>=pend.length){ guardarCache_('casos', window._casosCache); pintarAlertaEstancados_(); showToast('Listo: '+hechos+' caso(s) en prioridad Alta'); return; }
    var c = pend[i];
    gasPost('cambiarPrioridadCaso', {id:c.id, prioridad:'Alta', autor:s?s.nombre:''}).then(function(res){
      if(res.ok){ c.prioridad = 'Alta'; hechos++; }
      seguir(i+1);
    });
  };
  showToast('Subiendo prioridades…');
  seguir(0);
}

// ============================================================
// CHEQUEO RÁPIDO — pegar (o subir) nombre, VIN, patente o DNI y ver si
// ese cliente/vehículo ya tiene casos. Una línea = un cliente. Se compara
// contra todos los casos cargados, sin ir a buscar de a uno.
// ============================================================
function normChk_(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }
function palabrasChk_(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(function(w){ return w.length>=2; }); }
function parsearLineaChk_(linea){
  var resto = ' '+linea+' ', vins = [], pats = [], dnis = [];
  resto = resto.replace(/\b[A-HJ-NPR-Z0-9]{17}\b/gi, function(m){ vins.push(m.toUpperCase()); return ' '; });
  resto = resto.replace(/\b([A-Z]{2}\s?\d{3}\s?[A-Z]{2}|[A-Z]{3}\s?\d{3})\b/gi, function(m){ pats.push(m.replace(/\s/g,'').toUpperCase()); return ' '; });
  resto = resto.replace(/\b\d{1,2}\.?\d{3}\.?\d{3}\b/g, function(m){ dnis.push(m.replace(/\./g,'')); return ' '; });
  var nombre = resto.replace(/[,;|\t]+/g,' ').replace(/\b(dni|vin|patente|dominio|cliente|nombre)\b\s*:?/gi,' ').replace(/\s+/g,' ').trim();
  if(nombre.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g,'').length<3) nombre = '';
  return {linea:linea.trim(), dominios:vins.concat(pats), dnis:dnis, nombre:nombre};
}
function buscarCasosChk_(q, casos){
  var halladas = {};
  var marcar = function(c, motivo){ (halladas[c.id] = halladas[c.id] || {caso:c, motivos:[]}).motivos.push(motivo); };
  casos.forEach(function(c){
    var dom = normChk_(c.dominio), dni = String(c.dni||'').replace(/\D/g,'');
    q.dominios.forEach(function(d){ if(dom && dom===normChk_(d)) marcar(c, 'mismo vehículo ('+d+')'); });
    q.dnis.forEach(function(d){ if(dni && dni===d) marcar(c, 'mismo DNI'); });
    if(q.nombre){
      var pq = palabrasChk_(q.nombre), pc = palabrasChk_(c.cliente);
      if(pq.length && pc.length){
        var todas = pq.every(function(w){ return pc.indexOf(w)>-1; });
        if(todas && (pq.length>=2 || pc.length===1)) marcar(c, 'mismo nombre');
      }
    }
  });
  return Object.keys(halladas).map(function(k){ return halladas[k]; });
}
function casosParaChequeo_(){
  if(window._casosCache) return Promise.resolve(window._casosCache);
  return gasGet('casos').then(function(res){
    window._casosCache = (res.ok && (res.casos||res)) || [];
    return window._casosCache;
  });
}
// Detecta la fila de encabezados de una tabla (la que trae columnas tipo
// Cliente / DNI / Dominio…) y arma una consulta por fila. Si no hay
// encabezados, cada línea se interpreta suelta como antes.
function colChk_(h){
  var n = normChk_(h);
  if(!n) return '';
  if(/^(cliente|nombre|nombreycliente|apellidoynombre|nombreyapellido|titular|razonsocial)$/.test(n)) return 'cliente';
  if(/^(dni|documento|nrodocumento|numerodocumento|dnicuit|cuit)$/.test(n)) return 'dni';
  if(/^(dominio|patente|vin|chasis|dominiovin|vinchasis|dominiopatente)$/.test(n)) return 'dominio';
  if(/^(marca)$/.test(n)) return 'marca';
  if(/^(modelo|vehiculo|unidad)$/.test(n)) return 'modelo';
  if(/alerta|contacto|nps|fabrica|encuesta/.test(n)) return 'encuesta';
  return '';
}
function consultasDesdeTabla_(matriz){
  var hi = -1, cols = {};
  for(var i=0; i<Math.min(matriz.length, 8); i++){
    var m = {}, hallo = 0;
    matriz[i].forEach(function(h, j){ var c = colChk_(h); if(c){ (m[c] = m[c] || []).push(j); hallo++; } });
    if(hallo>=1 && (m.cliente || m.dni || m.dominio)){ hi = i; cols = m; break; }
  }
  if(hi<0){
    return matriz.map(function(f){ var q = parsearLineaChk_(f.join(' ')); q.extras = []; return q; });
  }
  var get = function(f, c){ return (cols[c]||[]).map(function(j){ return String(f[j]==null?'':f[j]).trim(); }).filter(Boolean); };
  return matriz.slice(hi+1).filter(function(f){ return f.some(function(x){ return String(x||'').trim(); }); }).map(function(f){
    var nombre = (get(f,'cliente')[0]||'').replace(/\s+/g,' ');
    var dominios = get(f,'dominio').map(function(d){ return d.replace(/\s/g,'').toUpperCase(); }).filter(function(d){ return d.length>=5; });
    var dnis = get(f,'dni').map(function(d){ return d.replace(/\D/g,''); }).filter(function(d){ return d.length>=7 && d.length<=8; });
    var extras = [];
    (cols.encuesta||[]).forEach(function(j){ var v = String(f[j]==null?'':f[j]).trim(); if(v && !/^n\/?a$/i.test(v)) extras.push({k:String(matriz[hi][j]).trim(), v:v}); });
    var det = [get(f,'marca')[0], get(f,'modelo')[0], dominios[0]].filter(Boolean).join(' · ');
    return {linea: (nombre||dnis[0]||dominios[0]||'') + (det ? '  ('+det+')' : ''), dominios:dominios, dnis:dnis, nombre:nombre, extras:extras};
  });
}
function encuestaPendiente_(q){ return (q.extras||[]).some(function(e){ return /pendiente|sin respuesta|no respond|^no$/i.test(e.v); }); }
function ejecutarChequeo_(){
  var txt = document.getElementById('chkTexto').value;
  var lineas = txt.split(/\r?\n/).filter(function(l){ return l.trim(); });
  var out = document.getElementById('resultadoChequeo');
  if(!lineas.length){ out.innerHTML = '<div class="panel"><div class="empty-state">Pegá al menos una línea, o subí el Excel exportado.</div></div>'; return; }
  out.innerHTML = '<div class="empty-state">Revisando…</div>';
  var sep = lineas.some(function(l){ return l.indexOf('\t')>-1; }) ? '\t' : (/;.*;/.test(lineas[0]) ? ';' : null);
  var matriz = lineas.map(function(l){ return sep ? l.split(sep) : [l]; });
  var consultas = consultasDesdeTabla_(matriz);
  casosParaChequeo_().then(function(casos){
    var filas = consultas.map(function(q){
      var sinDatos = !q.dominios.length && !q.dnis.length && !q.nombre;
      return {q:q, sinDatos:sinDatos, res: sinDatos ? [] : buscarCasosChk_(q, casos)};
    });
    // Primero lo que hay que atender: caso abierto + encuesta pendiente, después caso abierto, después el resto.
    var peso = function(f){ var ab = f.res.some(function(r){ return estaAbierto_(r.caso); }); return ab ? (encuestaPendiente_(f.q)?0:1) : (f.res.length?2:3); };
    filas.sort(function(a,b){ return peso(a)-peso(b); });
    window._chequeoUltimo = filas; window._chequeoSoloCasos = false;
    pintarChequeo_();
  });
}
function pintarChequeo_(){

  var conPrevios = filas.filter(function(f){ return f.res.length && !abierto(f); }).length;

      : f.res.length ? 'Tuvo '+f.res.length+' caso'+(f.res.length>1?'s':'')+', todos cerrados'
      : '✓ Sin casos';
    var extras = (f.q.extras||[]).map(function(e){ var pend = /pendiente|sin respuesta|no respond|^no$/i.test(e.v); return '<span class="pill '+(pend?'pill-esperando':'pill-resuelto')+'" style="padding:2px 9px;font-size:10px;margin-right:5px;">'+String(e.k).replace(/</g,'&lt;')+': '+String(e.v).replace(/</g,'&lt;')+'</span>'; }).join('');
    return '<div class="chk-res '+clase+'"><div style="flex:1;min-width:0;"><div class="chk-linea">'+f.q.linea.replace(/</g,'&lt;')+'</div>'+
      (extras ? '<div style="margin-top:5px;">'+extras+'</div>' : '')+
      (f.res.length ? '<div class="chk-casos">'+f.res.map(function(r){
        return '<a onclick="setView(\'detalle\',\''+r.caso.id+'\')" title="'+r.motivos.join(' · ')+'"><b>'+r.caso.id+'</b><span class="pill pill-'+r.caso.estado+'" style="padding:2px 8px;font-size:10px;">'+r.caso.estado+'</span>'+(r.caso.motivo||r.caso.tipoCaso||'')+' <span style="color:var(--text-faint);">· '+r.motivos[0]+'</span></a>';
      }).join('')+'</div>' : '')+'</div><div class="estado">'+estado+'</div></div>';

function descargarChequeo_(){
  var filas = window._chequeoUltimo||[];
  var csv = '﻿Consulta;Resultado;Encuesta;Casos\n' + filas.map(function(f){
    var ab = f.res.filter(function(r){ return estaAbierto_(r.caso); }).length;
    var r = f.sinDatos ? 'sin datos' : ab ? 'caso abierto' : f.res.length ? 'casos anteriores' : 'sin casos';
    var enc = (f.q.extras||[]).map(function(e){ return e.k+': '+e.v; }).join(' | ');
    return '"'+f.q.linea.replace(/"/g,'""')+'";'+r+';"'+enc.replace(/"/g,'""')+'";"'+f.res.map(function(x){ return x.caso.id+' ('+x.caso.estado+')'; }).join(', ')+'"';
  }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'chequeo-casos.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function cargarXLSX_(){
  if(window.XLSX) return Promise.resolve();
  return new Promise(function(ok, ko){
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = function(){ ko(new Error('No se pudo cargar el lector de Excel. Revisá la conexión o pegá las filas a mano.')); };
    document.head.appendChild(sc);
  });
}
// Excel (.xlsx/.xls) o CSV/TXT. En un Excel con varias hojas se usa la que
// tenga columnas de Cliente / DNI / Dominio (la más larga si hay varias).
function cargarArchivoChequeo_(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  var out = document.getElementById('resultadoChequeo');
  var esTexto = /\.(txt)$/i.test(f.name);
  inp.value = '';
  var r = new FileReader();
  r.onerror = function(){ out.innerHTML = '<div class="empty-state">No pude leer el archivo.</div>'; };
  if(esTexto){
    r.onload = function(){ document.getElementById('chkTexto').value = String(r.result||'').trim(); ejecutarChequeo_(); };
    r.readAsText(f); return;
  }
  out.innerHTML = '<div class="empty-state">Leyendo '+f.name.replace(/</g,'&lt;')+'…</div>';
  cargarXLSX_().then(function(){
    r.onload = function(){
      try{
        var libro = /\.csv$/i.test(f.name) ? XLSX.read(String(r.result), {type:'string'}) : XLSX.read(r.result, {type:'array'});
        var mejor = null;
        libro.SheetNames.forEach(function(nm){
          var m = XLSX.utils.sheet_to_json(libro.Sheets[nm], {header:1, defval:'', raw:false});
          var tiene = m.slice(0,8).some(function(fila){ return fila.some(function(h){ var c = colChk_(h); return c==='cliente'||c==='dni'||c==='dominio'; }); });
          if(tiene && (!mejor || m.length>mejor.length)) mejor = m;
          if(!mejor && !tiene && libro.SheetNames.length===1) mejor = m;
        });
        if(!mejor){ out.innerHTML = '<div class="empty-state">No encontré una hoja con columnas de Cliente, DNI o Dominio/Patente. Pegá las filas a mano o revisá los encabezados.</div>'; return; }
        document.getElementById('chkTexto').value = mejor.map(function(fila){ return fila.map(function(x){ return String(x).replace(/[\t\r\n]+/g,' '); }).join('\t'); }).join('\n');
        ejecutarChequeo_();
      }catch(e){ out.innerHTML = '<div class="empty-state">No pude abrir el archivo: '+String(e.message||e).replace(/</g,'&lt;')+'</div>'; }
    };
    if(/\.csv$/i.test(f.name)) r.readAsText(f); else r.readAsArrayBuffer(f);
  }).catch(function(e){ out.innerHTML = '<div class="empty-state">'+e.message+'</div>'; });
}

function pintarCalendario_(){
  var wrap = document.getElementById('calGridWrap');
  if(!wrap) return; // ya no estamos en esta vista
  document.getElementById('calMesLabel').textContent = MESES_ES_[window._calMes]+' '+window._calAnio;
  Array.from(document.getElementById('calToggleTipo').children).forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-v')===window._calTipo); });

  var marca = document.getElementById('cfMarca').value;
  var sucursal = document.getElementById('cfSucursal').value;
  var nfc = (marca?1:0)+(sucursal?1:0), nc = document.getElementById('nFiltrosC');
  if(nc){ nc.textContent = nfc; nc.classList.toggle('hidden', !nfc); document.getElementById('btnFiltrosC').classList.toggle('on', nfc>0); }
  var casos = (window._casosCache||[]).filter(function(c){
    if(marca && c.marca!==marca) return false;
    if(sucursal && c.sucursal!==sucursal) return false;
    return true;
  });

  // Agrupamos por fecha (clave YYYY-M-D) según el tipo elegido.
  var porFecha = {};
  casos.forEach(function(c){
    var campo = window._calTipo==='sla' ? c.slaVencimiento : (window._calTipo==='pp' ? c.proximoPasoFecha : c.fechaCreacion);
    var f = parseFechaGC_(campo);
    if(!f) return;
    var clave = f.getFullYear()+'-'+f.getMonth()+'-'+f.getDate();
    (porFecha[clave] = porFecha[clave]||[]).push(c);
  });

  var primerDia = new Date(window._calAnio, window._calMes, 1);
  var offsetLunes = (primerDia.getDay()+6)%7; // que la semana arranque en lunes
  var inicioGrilla = new Date(window._calAnio, window._calMes, 1-offsetLunes);
  var hoy = new Date();

  var html = DIAS_ES_.map(function(d){ return '<div class="cal-weekday">'+d+'</div>'; }).join('');

    var esHoy = d.toDateString()===hoy.toDateString();
    var clave = d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    var casosDia = (porFecha[clave]||[]).slice().sort(function(a,b){ return ({Alta:0,Media:1,Baja:2}[a.prioridad]||3) - ({Alta:0,Media:1,Baja:2}[b.prioridad]||3); });

      '<div class="cal-daynum">'+d.getDate()+'</div>'+
      visibles.map(function(c){
        return '<div class="cal-case-chip prio-'+c.prioridad+'" title="'+c.id+' — '+(c.cliente||'')+' — '+(c.motivo||c.tipoCaso||'')+'" onclick="setView(\'detalle\',\''+c.id+'\')">'+c.id+' · '+(c.cliente||'—')+'</div>';
      }).join('')+
      (resto>0 ? '<div class="cal-mas" onclick="verDiaCalendario_(\''+clave+'\')">+'+resto+' más</div>' : '')+
    '</div>';
  }

// Link del formulario público de reclamos — la misma página estática

function copiarLinkFormularioPublico_(){
  var link = window.location.origin + '/reclamo';
  var hacerCopia = function(){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(link);
    var ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); return Promise.resolve();
  };
  hacerCopia().then(function(){ showToast('Link del formulario copiado — pegalo en WhatsApp o donde lo necesites.'); })
    .catch(function(){ prompt('Copiá este link del formulario de reclamos:', link); });
}
function copiarLinkSeguimiento_(idCaso, token){
  var base = window.location.origin + '/seguimiento';
  var link = base + '?id=' + encodeURIComponent(idCaso) + '&token=' + encodeURIComponent(token);
  var hacerCopia = function(){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(link);
    var ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); return Promise.resolve();
  };
  hacerCopia().then(function(){ showToast('Link de seguimiento copiado — pegalo en WhatsApp o mail para el cliente.'); })
    .catch(function(){ prompt('Copiá este link para compartir con el cliente:', link); });
}

function agruparPorVin_(casos){
  var grupos = [], mapa = {};
  casos.forEach(function(c){
    var clave = (c.dominio && String(c.dominio).trim()) ? 'VIN:'+c.dominio.trim().toUpperCase() : 'CLIENTE:'+(c.cliente||'—');
    if(!mapa[clave]){
      mapa[clave] = {vin: c.dominio||'', cliente:c.cliente, marca:c.marca, modelo:c.modelo, casos:[]};
      grupos.push(mapa[clave]);
    }
    mapa[clave].casos.push(c);
  });
  grupos.forEach(function(g){ g.casos.sort(function(a,b){ return (parseFechaGC_(b.fechaCreacion)||0) - (parseFechaGC_(a.fechaCreacion)||0); }); });
  grupos.sort(function(a,b){ return b.casos.length - a.casos.length; });
  return grupos;
}
function ejecutarBusqueda_(){
  var q = document.getElementById('buscarQuery').value.trim();
  if(!q) return;
  document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">Buscando…</div>';
  gasGet('buscarCliente', {query:q}).then(function(res){
    if(!res.ok){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    var casos = res.casos||[];
    if(casos.length===0){ document.getElementById('resultadoBusqueda').innerHTML = '<div class="panel"><div class="empty-state">No se encontraron casos con ese dato.</div></div>'; return; }
    var grupos = agruparPorVin_(casos);
    var totalCasos = casos.length;
    var html = '<div class="panel"><div class="panel-head"><h3>'+grupos.length+' vehículo/cliente encontrado(s) · '+totalCasos+' caso(s) en total</h3></div></div>';
    html += grupos.map(function(g, gi){
      var abierto = grupos.length===1; // si hay un solo grupo, lo dejamos ya desplegado
      var ultimo = g.casos[0];
      return '<div class="vin-group">'+
        '<div class="vin-group-head" onclick="toggleVinGroup_('+gi+')">'+

function toggleVinGroup_(gi){

function pintarGraficosReportes_(res){
  var c = coloresGrafico_();
  if(document.getElementById('chartResueltos')) dibujarDonut_('chartResueltos', ['Resueltos/cerrados','Abiertos'], [res.resueltos, res.abiertos], [c.ok, c.caso]);
  if(document.getElementById('chartFuente')) dibujarBarras_('chartFuente', res.porFuente);
  if(document.getElementById('chartSector')) dibujarBarras_('chartSector', res.porSector);
  if(document.getElementById('chartMarca')) dibujarBarras_('chartMarca', res.porMarca);
  if(document.getElementById('chartSucursal')) dibujarBarras_('chartSucursal', res.porSucursal);
  if(document.getElementById('chartTipo')) dibujarBarras_('chartTipo', res.porTipoCaso);
  if(res.reclamos && document.getElementById('chartReclamosMarca')) dibujarBarras_('chartReclamosMarca', res.reclamos.porMarca);
}
function panelChart_(canvasId, titulo, lista){
  if(!lista || lista.length===0) return '';
  return '<div class="panel"><div class="panel-head"><h3>'+titulo+'</h3></div><div style="padding:14px 17px;height:'+Math.max(140, lista.length*34)+'px;"><canvas id="'+canvasId+'"></canvas></div></div>';
}
var _chartsGC_ = {};
function coloresGrafico_(){
  var css = getComputedStyle(document.body);
  return {
    caso: css.getPropertyValue('--caso').trim(), grid: css.getPropertyValue('--hairline').trim(),
    texto: css.getPropertyValue('--text-dim').trim(), ok: css.getPropertyValue('--ok').trim()
  };
}
function dibujarBarras_(canvasId, lista){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'bar',
    data: { labels: lista.map(function(x){return x.valor;}), datasets: [{ data: lista.map(function(x){return x.cantidad;}), backgroundColor: c.caso, borderRadius: 5, maxBarThickness: 22 }] },
    options: {
      indexAxis: 'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ beginAtZero:true, ticks:{color:c.texto, precision:0}, grid:{color:c.grid} },
        y:{ ticks:{color:c.texto, font:{size:11}}, grid:{display:false} }
      }
    }
  });
}
function dibujarDonut_(canvasId, labels, datos, colores){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: datos, backgroundColor: colores, borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{color:c.texto, font:{size:11.5}, boxWidth:11, padding:14}}} }
  });
}
// Línea — usada por "Evolución mensual de casos" (Etapa 4).
function dibujarLinea_(canvasId, labels, datos){
  var el = document.getElementById(canvasId);
  if(!el || !window.Chart) return;
  if(_chartsGC_[canvasId]) _chartsGC_[canvasId].destroy();
  var c = coloresGrafico_();
  _chartsGC_[canvasId] = new Chart(el, {
    type: 'line',
    data: { labels: labels, datasets: [{ data: datos, borderColor: c.caso, backgroundColor: c.caso+'33', fill:true, tension:.35, pointRadius:3, pointBackgroundColor:c.caso }] },
    options: {
      responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{ ticks:{color:c.texto, font:{size:10.5}}, grid:{display:false} }, y:{ beginAtZero:true, ticks:{color:c.texto, precision:0}, grid:{color:c.grid} } }
    }
  });
}

  '</div>';
}

function filtrarCasosParaMinutaBusqueda_(){
  var q = (document.getElementById('minutaBuscarCaso').value||'').trim().toLowerCase();
  var box = document.getElementById('minutaResultadosCasos');
  if(!q){ box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:11.5px;">Escribí para buscar un caso.</div>'; return; }
  var casos = (window._casosCache||[]).filter(function(c){
    var hay = (c.id+' '+(c.cliente||'')+' '+(c.dominio||'')+' '+(c.marca||'')+' '+(c.responsable||'')).toLowerCase();
    return hay.indexOf(q)>-1;
  }).slice(0,30);
  if(!casos.length){ box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:11.5px;">Sin resultados.</div>'; return; }
  box.innerHTML = casos.map(function(c){
    var sel = !!window._minutaSeleccion[c.id];
    return '<div class="caso-pick-item'+(sel?' selected':'')+'" onclick="toggleCasoEnMinuta_(\''+c.id+'\')">'+
      '<input type="checkbox" '+(sel?'checked':'')+' onclick="event.stopPropagation();toggleCasoEnMinuta_(\''+c.id+'\')">'+
      '<span class="cpi-id">'+c.id+'</span><span style="flex:1;">'+(c.cliente||'—')+' · '+(c.marca||'—')+'</span>'+
      '<span class="pill pill-'+c.estado+'" style="font-size:10px;">'+c.estado+'</span>'+
    '</div>';
  }).join('');
}
function toggleCasoEnMinuta_(casoId){
  if(window._minutaSeleccion[casoId]){
    delete window._minutaSeleccion[casoId];
  }else{
    var caso = (window._casosCache||[]).find(function(c){ return c.id===casoId; });
    window._minutaSeleccion[casoId] = {
      caso: caso || {id:casoId}, soloMencionado:false,
      resumen:'', problema:'', analisis:'', decision:'', accion:'',
      responsableCompromiso:'', fechaLimite:'', observaciones:''
    };
  }
  filtrarCasosParaMinutaBusqueda_();
  pintarCasosSeleccionadosMinuta_();
}
function marcarSoloMencionadoMinuta_(casoId, checked){
  if(window._minutaSeleccion[casoId]) window._minutaSeleccion[casoId].soloMencionado = checked;
  pintarCasosSeleccionadosMinuta_();
}
function actualizarCampoCompromisoMinuta_(casoId, campo, valor){
  if(window._minutaSeleccion[casoId]) window._minutaSeleccion[casoId][campo] = valor;
}
function campoMinutaCompromiso_(label, casoId, campo, valor, full, tipo){
  tipo = tipo||'text';
  var id = 'mc_'+campo+'_'+casoId;
  if(full){
    return '<div class="field full"><label>'+label+'</label><textarea id="'+id+'" style="min-height:42px;" oninput="actualizarCampoCompromisoMinuta_(\''+casoId+'\',\''+campo+'\',this.value)">'+(valor||'')+'</textarea></div>';
  }
  return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+tipo+'" value="'+(valor||'')+'" oninput="actualizarCampoCompromisoMinuta_(\''+casoId+'\',\''+campo+'\',this.value)"></div>';
}
function pintarCasosSeleccionadosMinuta_(){
  var cont = document.getElementById('minutaCasosSeleccionados');
  var ids = Object.keys(window._minutaSeleccion);
  if(!ids.length){ cont.innerHTML = '<div class="empty-state" style="padding:14px;font-size:11.5px;">Todavía no seleccionaste ningún caso.</div>'; return; }
  cont.innerHTML = ids.map(function(cid){
    var sel = window._minutaSeleccion[cid];
    var c = sel.caso||{};
    return '<div class="compromiso-card">'+
      '<div class="cc-head"><span class="cc-caso">'+cid+(c.cliente?' — '+c.cliente:'')+'</span>'+
        '<div style="display:flex;gap:12px;align-items:center;">'+
          '<label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" '+(sel.soloMencionado?'checked':'')+' onchange="marcarSoloMencionadoMinuta_(\''+cid+'\',this.checked)"> Solo mencionado (sin compromiso)</label>'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;padding:4px 10px;" onclick="toggleCasoEnMinuta_(\''+cid+'\')">Quitar</button>'+
        '</div>'+
      '</div>'+
      (sel.soloMencionado ? '' :
        '<div class="form-grid">'+
          campoMinutaCompromiso_('Resumen de la situación', cid, 'resumen', sel.resumen, true)+
          campoMinutaCompromiso_('Problema identificado', cid, 'problema', sel.problema, true)+
          campoMinutaCompromiso_('Análisis realizado', cid, 'analisis', sel.analisis, true)+
          campoMinutaCompromiso_('Decisión tomada', cid, 'decision', sel.decision, true)+
          campoMinutaCompromiso_('Acción acordada', cid, 'accion', sel.accion, true)+
          campoMinutaCompromiso_('Responsable del compromiso', cid, 'responsableCompromiso', sel.responsableCompromiso)+
          campoMinutaCompromiso_('Fecha límite', cid, 'fechaLimite', sel.fechaLimite, false, 'date')+
          campoMinutaCompromiso_('Observaciones', cid, 'observaciones', sel.observaciones, true)+
        '</div>'
      )+
    '</div>';
  }).join('');
}
function cargarYPintarActas_(){
  gasGet('actas').then(function(res){
    if(!res.ok){ document.getElementById('listadoActas').innerHTML = '<div class="panel"><div class="empty-state">'+res.error+'</div></div>'; return; }
    var actas = (res.actas||[]).sort(function(a,b){ return new Date(b.fecha||0) - new Date(a.fecha||0); });
    if(actas.length===0){ document.getElementById('listadoActas').innerHTML = '<div class="panel"><div class="empty-state">Todavía no hay minutas cargadas.</div></div>'; return; }
    document.getElementById('listadoActas').innerHTML = '<div class="panel">'+
      actas.map(function(a){
        return '<div class="minuta-card">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">'+
            '<div><h3 style="font-size:13px;">'+a.titulo+'</h3>'+
              '<div style="font-size:11px;color:var(--text-faint);margin-top:2px;">'+(a.fecha||'')+(a.hora?' · '+a.hora:'')+(a.responsableReunion?' · '+a.responsableReunion:'')+(a.asistentes?' · '+a.asistentes:'')+'</div></div>'+
            '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="verMinutaDetalle_(\''+a.id+'\')">Ver / Imprimir</button>'+
          '</div>'+
          (a.objetivo ? '<div style="margin-top:8px;font-size:12.3px;color:var(--text-dim);"><b style="color:var(--text);">Objetivo:</b> '+a.objetivo+'</div>' : '')+
          (a.casosVinculados && a.casosVinculados.length ? '<div style="margin-top:8px;">'+a.casosVinculados.map(function(cid){ return '<span class="pill" style="background:var(--caso-soft);color:var(--caso);margin-right:6px;cursor:pointer;" onclick="setView(\'detalle\',\''+cid+'\')">'+cid+'</span>'; }).join('')+'</div>' : '')+
        '</div>';
      }).join('')+
    '</div>';
  });
}

    document.getElementById('minutaModalTitulo').textContent = a.titulo;
    document.getElementById('minutaModalBody').innerHTML =
      '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:12px;">'+(a.fecha||'')+(a.hora?' · '+a.hora:'')+(a.responsableReunion?' · Responsable: '+a.responsableReunion:'')+'</div>'+
      (a.objetivo ? '<div style="margin-bottom:8px;font-size:12.6px;"><b>Objetivo:</b> '+a.objetivo+'</div>' : '')+

        return '<div class="compromiso-card">'+
          '<div class="cc-head"><span class="cc-caso" style="cursor:pointer;" onclick="cerrarModalMinuta_();setView(\'detalle\',\''+co.casoId+'\')">'+co.casoId+'</span>'+
            '<span class="compromiso-badge '+co.estadoReal+'">'+co.estadoReal+'</span></div>'+
          (co.resumen?'<div style="font-size:12px;margin-bottom:4px;"><b>Resumen:</b> '+co.resumen+'</div>':'')+
          (co.problema?'<div style="font-size:12px;margin-bottom:4px;"><b>Problema:</b> '+co.problema+'</div>':'')+
          (co.analisis?'<div style="font-size:12px;margin-bottom:4px;"><b>Análisis:</b> '+co.analisis+'</div>':'')+
          (co.decision?'<div style="font-size:12px;margin-bottom:4px;"><b>Decisión:</b> '+co.decision+'</div>':'')+
          (co.accion?'<div style="font-size:12px;margin-bottom:4px;"><b>Acción acordada:</b> '+co.accion+'</div>':'')+
          '<div style="font-size:11.5px;color:var(--text-faint);margin-top:6px;">'+(co.responsableCompromiso?'Responsable: '+co.responsableCompromiso+' · ':'')+(co.fechaLimite?'Vence: '+co.fechaLimite:'')+'</div>'+
          (co.observaciones?'<div style="font-size:11.8px;margin-top:6px;color:var(--text-dim);">'+co.observaciones+'</div>':'')+
          (co.estadoReal!=='cumplido' ? '<button class="btn btn-ghost btn-sm" style="width:auto;margin-top:8px;" onclick="marcarCompromisoCumplidoUI_(\''+co.id+'\',true)">Marcar cumplido</button>' : '')+
        '</div>';
      }).join('') : '<div class="empty-state" style="padding:14px;">Ningún caso con compromiso puntual en esta minuta.</div>')+
      (a.proximosPasos ? '<div style="margin-top:14px;font-size:12.6px;"><b>Próximos pasos:</b> '+a.proximosPasos+'</div>' : '')+
      '<button class="btn btn-primary" style="width:auto;margin-top:16px;" onclick="imprimirMinuta_(\''+a.id+'\')"><span class="material-symbols-outlined" style="font-size:15px;vertical-align:-3px;">print</span> Imprimir / Exportar PDF</button>';
  });

function cerrarModalMinuta_(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalMinuta').classList.remove('show');
}
function marcarCompromisoCumplidoUI_(id, desdeModal){
  var s = sesionActual();
  gasPost('marcarCompromisoCumplido', {id:id, autor: s?s.nombre:''}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    showToast('Compromiso marcado como cumplido');
    if(desdeModal && window._minutaActualDetalle) verMinutaDetalle_(window._minutaActualDetalle.id);
    var wrap = document.getElementById('listadoCompromisosWrap');
    if(wrap && !wrap.classList.contains('hidden')) cargarYPintarCompromisos_('');
  });
}
function cargarYPintarCompromisos_(estado, btnEl){
  if(btnEl){
    document.querySelectorAll('#quickViewsCompromisos .qv-chip').forEach(function(b){ b.classList.remove('active'); });
    btnEl.classList.add('active');
  }
  document.getElementById('listadoCompromisos').innerHTML = '<div class="panel"><div class="empty-state">Cargando…</div></div>';
  gasGet('compromisos', estado?{estado:estado}:{}).then(function(res){
    if(!res.ok){ document.getElementById('listadoCompromisos').innerHTML = '<div class="panel"><div class="empty-state">'+res.error+'</div></div>'; return; }
    var compromisos = res.compromisos||[];
    if(!compromisos.length){ document.getElementById('listadoCompromisos').innerHTML = '<div class="panel"><div class="empty-state">No hay compromisos en esta categoría.</div></div>'; return; }
    document.getElementById('listadoCompromisos').innerHTML = '<div class="panel"><table class="tbl"><thead><tr><th>Caso</th><th>Acción acordada</th><th>Responsable</th><th>Fecha límite</th><th>Estado</th><th>Minuta</th><th></th></tr></thead><tbody>'+
      compromisos.map(function(co){
        return '<tr>'+
          '<td class="mono" style="color:var(--caso);font-weight:700;cursor:pointer;" onclick="setView(\'detalle\',\''+co.casoId+'\')">'+co.casoId+'</td>'+
          '<td>'+(co.accion||co.decision||'—')+'</td>'+
          '<td>'+(co.responsableCompromiso||'—')+'</td>'+
          '<td>'+(co.fechaLimite||'—')+'</td>'+
          '<td><span class="compromiso-badge '+co.estadoReal+'">'+co.estadoReal+'</span></td>'+
          '<td><span style="cursor:pointer;color:var(--caso);" onclick="verMinutaDetalle_(\''+co.actaId+'\')">'+co.actaId+'</span></td>'+
          '<td>'+(co.estadoReal!=='cumplido' ? '<button class="btn btn-ghost btn-sm" style="width:auto;padding:4px 10px;" onclick="marcarCompromisoCumplidoUI_(\''+co.id+'\',false)">Marcar cumplido</button>' : '')+'</td>'+
        '</tr>';
      }).join('')+
    '</tbody></table></div>';
  });
}
function imprimirMinuta_(id){
  var render = function(a){
    var html = '<h1>'+a.titulo+'</h1>'+
      '<div class="mp-sub">'+(a.fecha||'')+(a.hora?' · '+a.hora:'')+(a.responsableReunion?' · Responsable: '+a.responsableReunion:'')+'</div>'+
      (a.objetivo?'<div style="margin-bottom:8px;"><b>Objetivo:</b> '+a.objetivo+'</div>':'')+
      (a.asistentes?'<div style="margin-bottom:8px;"><b>Participantes:</b> '+a.asistentes+'</div>':'')+
      (a.temas?'<div style="margin-bottom:8px;"><b>Temas tratados:</b> '+a.temas+'</div>':'')+
      '<h2>Casos tratados</h2>'+
      ((a.compromisos && a.compromisos.length) ? a.compromisos.map(function(co){
        return '<div class="mp-caso">'+
          '<b>'+co.casoId+'</b> — Estado del compromiso: '+co.estadoReal+'<br>'+
          (co.resumen?'<b>Resumen:</b> '+co.resumen+'<br>':'')+
          (co.problema?'<b>Problema:</b> '+co.problema+'<br>':'')+
          (co.analisis?'<b>Análisis:</b> '+co.analisis+'<br>':'')+
          (co.decision?'<b>Decisión:</b> '+co.decision+'<br>':'')+
          (co.accion?'<b>Acción acordada:</b> '+co.accion+'<br>':'')+
          'Responsable: '+(co.responsableCompromiso||'—')+' · Fecha límite: '+(co.fechaLimite||'—')+
          (co.observaciones?'<br>Observaciones: '+co.observaciones:'')+
        '</div>';
      }).join('') : '<div>Ningún caso con compromiso puntual.</div>')+
      (a.proximosPasos?'<h2>Próximos pasos</h2><div>'+a.proximosPasos+'</div>':'');
    document.getElementById('minutaPrintRoot').innerHTML = html;
    document.body.classList.add('print-minuta-mode');
    var limpiar = function(){ document.body.classList.remove('print-minuta-mode'); window.removeEventListener('afterprint', limpiar); };
    window.addEventListener('afterprint', limpiar);
    window.print();
    setTimeout(limpiar, 60000);
  };
  if(window._minutaActualDetalle && String(window._minutaActualDetalle.id)===String(id)){ render(window._minutaActualDetalle); return; }
  gasGet('acta', {id:id}).then(function(res){ if(res.ok) render(res.acta); else showToast(res.error); });
}

    '<div class="page-title" style="margin-bottom:2px;">Equipo</div>'+

    '<div style="display:flex;gap:8px;margin-bottom:14px;">'+

        campoSelect_('Rol','equRol', '<option value="calidad">Calidad — acceso total</option><option value="sector">Sector — solo sus casos</option><option value="referente">Referente — solo ver, de su sector</option>')+

function cargarYPintarEquipo_(){
  var s = sesionActual();
  var pass = _passwordSesionActual_();
  if(!pass) return;
  gasPost('listarUsuarios', {actorUsuario:s.usuario, actorPassword:pass}).then(function(res){
    if(!res.ok){ document.getElementById('tablaEquipo').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    pintarTablaEquipo_(res.usuarios||[]);
  });
}
function abrirFormUsuario_(usuarioExistente){
  document.getElementById('panelFormImportar').classList.add('hidden');
  document.getElementById('panelFormUsuario').classList.remove('hidden');
  document.getElementById('formUsuarioTitulo').textContent = usuarioExistente ? 'Editar usuario' : 'Nuevo usuario';
  document.getElementById('equNombre').value = usuarioExistente ? usuarioExistente.nombre : '';
  document.getElementById('equUsuario').value = usuarioExistente ? usuarioExistente.usuario : '';
  document.getElementById('equUsuario').disabled = !!usuarioExistente;
  document.getElementById('equPassword').value = '';
  document.getElementById('equPassword').placeholder = usuarioExistente ? '(dejar vacío para no cambiarla — próximamente)' : '';
  document.getElementById('equRol').value = usuarioExistente ? usuarioExistente.rol : 'sector';
  document.getElementById('equSector').value = usuarioExistente ? (usuarioExistente.sector||'') : '';
  document.getElementById('equEmail').value = usuarioExistente ? (usuarioExistente.email||'') : '';
  window._equipoEditando = usuarioExistente ? usuarioExistente.usuario : null;
}
function cerrarFormUsuario_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
}
function abrirFormImportar_(){
  document.getElementById('panelFormUsuario').classList.add('hidden');
  document.getElementById('panelFormImportar').classList.remove('hidden');
  document.getElementById('importarNombres').value = '';
}
function importarUsuariosUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  if(!actorPassword) return;
  var texto = document.getElementById('importarNombres').value.trim();
  if(!texto){ showToast('Pegá al menos un nombre'); return; }
  var lineas = texto.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  gasPost('importarUsuarios', {actorUsuario:s.usuario, actorPassword:actorPassword, nombres:lineas}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    var creados = res.creados||[], omitidos = res.omitidos||[];
    window._usuariosActivosCache = null;
    showToast(creados.length+' usuario(s) importado(s), sin acceso todavía'+(omitidos.length?' — '+omitidos.length+' omitido(s)':''));
    document.getElementById('panelFormImportar').classList.add('hidden');
    renderEquipo();
  });
}
function guardarUsuarioUI_(){
  var s = sesionActual();
  var actorPassword = _passwordSesionActual_();
  var nombre = document.getElementById('equNombre').value.trim();
  var usuario = document.getElementById('equUsuario').value.trim();
  var rol = document.getElementById('equRol').value;
  var sector = document.getElementById('equSector').value.trim();
  var email = document.getElementById('equEmail').value.trim();
  if(!nombre || !usuario){ showToast('Falta nombre o usuario'); return; }

  if(window._equipoEditando){
    gasPost('editarUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, usuarioObjetivo:window._equipoEditando, nombre:nombre, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      window._usuariosActivosCache = null;
      showToast('Usuario actualizado'); cerrarFormUsuario_(); renderEquipo();
    });
  } else {
    var password = document.getElementById('equPassword').value;
    if(!password || password.length<4){ showToast('La contraseña tiene que tener al menos 4 caracteres'); return; }
    gasPost('crearUsuario', {actorUsuario:s.usuario, actorPassword:actorPassword, nombre:nombre, usuario:usuario, password:password, rol:rol, sector:sector, email:email}).then(function(res){
      if(!res.ok){ showToast(res.error); return; }
      window._usuariosActivosCache = null;
      showToast('Usuario creado'); cerrarFormUsuario_(); renderEquipo();
    });
  }
}
function cambiarActivoUsuarioUI_(usuario, activo){
  var s = sesionActual();
  gasPost('desactivarUsuario', {actorUsuario:s.usuario, actorPassword:_passwordSesionActual_(), usuarioObjetivo:usuario, activo:activo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._usuariosActivosCache = null;
    showToast(activo?'Usuario activado':'Usuario desactivado'); renderEquipo();
  });
}
function pintarTablaEquipo_(usuarios){
  var etiquetasRol = {calidad:'Calidad', sector:'Sector', referente:'Referente'};
  var filas = usuarios.map(function(u){
    return '<tr style="cursor:default;">'+
      '<td>'+u.nombre+'</td>'+
      '<td class="mono">'+u.usuario+'</td>'+
      '<td>'+(etiquetasRol[u.rol]||u.rol)+'</td>'+
      '<td>'+(u.sector||'—')+'</td>'+
      '<td>'+(u.email||'—')+'</td>'+
      '<td>'+(u.activo ? '<span class="pill pill-resuelto">Activo</span>' : '<span class="pill pill-cerrado">Inactivo</span>')+'</td>'+
      '<td style="white-space:nowrap;">'+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick=\'abrirFormUsuario_('+JSON.stringify(u)+')\'>Editar</button> '+
        '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="cambiarActivoUsuarioUI_(\''+u.usuario+'\','+(!u.activo)+')">'+(u.activo?'Desactivar':'Activar')+'</button>'+
      '</td>'+
    '</tr>';
  }).join('');
  document.getElementById('tablaEquipo').innerHTML = usuarios.length ?
    '<table class="tbl"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Sector</th><th>Email</th><th>Estado</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>' :
    '<div class="empty-state">No hay usuarios cargados.</div>';
}

var CONFIG_EDITABLES_ = {
  SLA_HORAS_ALTA: {label:'SLA — Prioridad Alta (horas)', tipo:'number'},
  SLA_HORAS_MEDIA: {label:'SLA — Prioridad Media (horas)', tipo:'number'},
  SLA_HORAS_BAJA: {label:'SLA — Prioridad Baja (horas)', tipo:'number'},
  NOTIFICAR_EMAIL_CASO_NUEVO: {label:'Email para avisos de casos nuevos', tipo:'email'}
};
var CONFIG_SOLO_LECTURA_ = ['CONTADOR_CASOS','CONTADOR_EVENTOS','CONTADOR_SEGUIMIENTOS','CONTADOR_TIMELINE'];

function renderConfig(){
  gasGet('config').then(function(res){
    if(!res.ok){ document.getElementById('content').innerHTML = '<div class="empty-state">'+res.error+'</div>'; return; }
    window._configCache = res.config||{};
    window._catalogosCache = res.catalogos||{};
    window._configGlobalCache = res; // mismo caché que usa Reportar, así queda al día sin pedirlo de nuevo
    pintarConfig_();
  });
}
function pintarConfig_(){
  var cat = window._catalogosCache||{};
  var conf = window._configCache||{};
  var tabActiva = window._configTabActiva || 'catalogos';

  var html = '<div class="filter-bar" style="margin-bottom:16px;">'+
    tabBtn_('catalogos','Catálogos',tabActiva)+
    tabBtn_('parametros','Parámetros y SLA',tabActiva)+
    tabBtn_('automatizacion','Automatización',tabActiva)+
  '</div>';

  if(tabActiva==='catalogos'){
    html += '<div class="panel"><div class="panel-head"><h3>Catálogos — listas desplegables del sistema</h3></div><div style="padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;">';
    Object.keys(cat).forEach(function(nombre){
      html += '<div>'+
        '<div style="font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:8px;">'+nombre+'</div>'+
        cat[nombre].map(function(v){
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding:4px 0;">'+
            '<span>'+v+'</span>'+
            '<button onclick="eliminarCatalogoItemUI_(\''+nombre+'\',\''+String(v).replace(/'/g,"\\'")+'\')" title="Quitar" style="background:none;border:none;color:var(--text-faint);cursor:pointer;padding:2px;"><span class="material-symbols-outlined" style="font-size:14px;">close</span></button>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;gap:6px;margin-top:8px;">'+
          '<input type="text" id="nuevoItem_'+nombre+'" placeholder="Agregar..." style="flex:1;min-width:0;padding:6px 8px;border:1.5px solid var(--hairline);border-radius:7px;font-size:11.5px;background:var(--panel-2);color:var(--text);" onkeydown="if(event.key===\'Enter\')agregarCatalogoItemUI_(\''+nombre+'\')">'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;padding:6px 10px;" onclick="agregarCatalogoItemUI_(\''+nombre+'\')">+</button>'+
        '</div>'+
      '</div>';
    });
    html += '</div></div>';
  }

  if(tabActiva==='parametros'){
    html += '<div class="panel"><div class="panel-head"><h3>SLA por prioridad y avisos</h3></div><div style="padding:16px 18px;">'+
      '<div class="form-grid">'+
      Object.keys(CONFIG_EDITABLES_).map(function(k){
        var def = CONFIG_EDITABLES_[k];
        return '<div class="field"><label>'+def.label+'</label>'+
          '<div style="display:flex;gap:6px;">'+
          '<input type="'+def.tipo+'" id="conf_'+k+'" value="'+(conf[k]!==undefined?conf[k]:'')+'" style="flex:1;">'+
          '<button class="btn btn-ghost btn-sm" style="width:auto;" onclick="guardarConfigParamUI_(\''+k+'\')">Guardar</button>'+
          '</div></div>';
      }).join('')+
      '</div>'+
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);font-size:11px;color:var(--text-faint);">'+
        'Contadores internos (no editables): '+CONFIG_SOLO_LECTURA_.map(function(k){ return k+' = '+(conf[k]!==undefined?conf[k]:0); }).join(' · ')+
      '</div>'+
    '</div></div>';
  }

  if(tabActiva==='automatizacion'){
    html += '<div class="panel"><div class="panel-head"><h3>Motor de Eventos</h3></div><div style="padding:16px 18px;">'+
      '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px;">Creación automática de casos desde eventos (Etapa 2) — hoy está <b style="color:'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true'?'var(--ok)':'var(--warn)')+';">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true'?'ACTIVADA':'APAGADA')+'</b>.</div>'+
      '<div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px;">Apagada = todo pasa por la Bandeja de entrada para confirmar a mano antes de crear el caso. Activada = el caso se crea solo apenas llega el evento.</div>'+
      '<button class="btn btn-dark btn-sm" style="width:auto;" onclick="toggleCreacionAutomaticaUI_()">'+(String(conf.CREAR_CASOS_AUTOMATICO)==='true' ? 'Apagar creación automática' : 'Activar creación automática')+'</button>'+
    '</div></div>';
  }

  document.getElementById('content').innerHTML = html;
}
function tabBtn_(id, label, activa){
  var esActiva = id===activa;
  return '<button class="btn '+(esActiva?'btn-dark':'btn-ghost')+' btn-sm" style="width:auto;'+(esActiva?'border-color:var(--caso);color:var(--caso);':'')+'" onclick="window._configTabActiva=\''+id+'\';pintarConfig_();">'+label+'</button>';
}
function agregarCatalogoItemUI_(nombre){
  var input = document.getElementById('nuevoItem_'+nombre);
  var valor = input.value.trim();
  if(!valor) return;
  gasPost('agregarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    if(!window._catalogosCache[nombre]) window._catalogosCache[nombre]=[];
    window._catalogosCache[nombre].push(valor);
    pintarConfig_();
    showToast('Agregado a '+nombre);
  });
}
function eliminarCatalogoItemUI_(nombre, valor){
  if(!confirm('¿Quitar "'+valor+'" de '+nombre+'?')) return;
  gasPost('eliminarCatalogoItem', {nombre:nombre, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._catalogosCache[nombre] = window._catalogosCache[nombre].filter(function(v){return v!==valor;});
    pintarConfig_();
    showToast('Quitado de '+nombre);
  });
}
function guardarConfigParamUI_(clave){
  var valor = document.getElementById('conf_'+clave).value;
  gasPost('actualizarConfig', {clave:clave, valor:valor}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache[clave] = valor;
    showToast('Guardado');
  });
}
function toggleCreacionAutomaticaUI_(){
  var actual = String(window._configCache.CREAR_CASOS_AUTOMATICO)==='true';
  var nuevo = !actual;
  var msg = nuevo
    ? '¿Activar la creación automática de casos? A partir de ahora, los eventos van a crear el caso solos, sin pasar por la Bandeja de entrada.'
    : '¿Apagar la creación automática? Los eventos van a volver a esperar confirmación manual en la Bandeja de entrada.';
  if(!confirm(msg)) return;
  gasPost('actualizarConfig', {clave:'CREAR_CASOS_AUTOMATICO', valor:nuevo}).then(function(res){
    if(!res.ok){ showToast(res.error); return; }
    window._configCache.CREAR_CASOS_AUTOMATICO = nuevo;
    pintarConfig_();
    showToast(nuevo ? 'Creación automática activada' : 'Creación automática apagada');
  });
}

// No registramos Service Worker (mismo criterio que Planning ahora): evita
// versiones viejas cacheadas en el navegador de alguien. Si quedó uno de
// una prueba anterior, lo desinstala una sola vez.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  }).catch(function(){});
}
</script>
</body>
</html>
